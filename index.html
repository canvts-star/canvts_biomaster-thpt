hận biết","type":"mcq","question":"Khi tìm hiểu về \"Tái bản DNA theo nguyên tắc bán bảo toàn\" trong chuyên đề Di truyền phân tử & Cơ chế biến dị (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Mỗi phân tử DNA con giữ lại một mạch cũ của DNA mẹ và tổng hợp một mạch mới bổ sung theo chiều 5' → 3' nhờ enzyme DNA polymerase","Cả hai mạch mới được tổng hợp liên tục cùng chiều tháo xoắn mà không cần đoạn mồi RNA","Enzyme DNA polymerase tổng hợp mạch mới theo chiều 3' → 5' trên cả hai mạch khuôn","Phân tử DNA mẹ bị phân hủy hoàn toàn thành các nucleotide tự do sau mỗi lần nhân đôi"],"correct":0,"explanation":"[Mức độ: Nhận biết] DNA tái bản theo nguyên tắc bổ sung và bán bảo toàn; DNA polymerase chỉ tổng hợp mạch mới theo chiều 5' → 3'."},{"id":"SIN_12_T1_MCQ_2","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Phiên mã tổng hợp các loại RNA\" trong chuyên đề Di truyền phân tử & Cơ chế biến dị (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Quá trình phiên mã sử dụng cả hai mạch của gen làm khuôn để tạo ra RNA mạch kép","Enzyme RNA polymerase trượt trên mạch khuôn 3' → 5' của gen để tổng hợp phân tử RNA theo chiều 5' → 3' mà không cần đoạn mồi","Thymine (T) tự do của môi trường nội bào liên kết bổ sung với Adenine (A) trên mạch khuôn","Ở sinh vật nhân thực, mRNA sơ khai được dịch mã ngay trong nhân tế bào trước khi cắt intron"],"correct":1,"explanation":"[Mức độ: Nhận biết] RNA polymerase tự khởi đầu phiên mã trên mạch gốc 3' → 5', lắp rU bổ sung với A của gen."},{"id":"SIN_12_T1_MCQ_3","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Mã di truyền và tính thoái hóa của mã\" trong chuyên đề Di truyền phân tử & Cơ chế biến dị (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Một bộ ba codon trên mRNA có thể đồng thời mã hóa cho hai hoặc ba loại amino acid khác nhau","Mã di truyền được đọc gối lên nhau từng nucleotide một từ đầu 3' đến đầu 5' của mRNA","Nhiều bộ ba codon khác nhau cùng mã hóa cho một loại amino acid (trừ AUG và UGG), giúp giảm thiểu tác hại của đột biến thay thế nucleotide","Bộ ba UAA, UAG và UGA mã hóa cho amino acid mở đầu Methionine ở sinh vật nhân thực"],"correct":2,"explanation":"[Mức độ: Nhận biết] Tính thoái hóa của mã di truyền giúp nhiều đột biến đồng nghĩa không làm thay đổi chuỗi polypeptide."},{"id":"SIN_12_T1_MCQ_4","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Điều hòa biểu hiện gen ở Operon Lac (E. coli)\" trong chuyên đề Di truyền phân tử & Cơ chế biến dị (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Gen điều hòa lacI nằm trong thành phần cấu trúc của operon Lac và chỉ phiên mã khi có lactose","Khi môi trường không có lactose, RNA polymerase bám chặt vào vùng O để phiên mã nhóm gen Z, Y, A","Đột biến làm hỏng vùng khởi động Promoter (P) khiến các gen cấu trúc Z, Y, A phiên mã liên tục không ngừng","Khi môi trường có đường lactose, allolactose liên kết làm biến đổi cấu hình protein ức chế LacI khiến nó không bám được vào vùng vận hành Operator (O)"],"correct":3,"explanation":"[Mức độ: Nhận biết] Allolactose đóng vai trò chất cảm ứng làm bất hoạt protein ức chế, giải phóng vùng O cho RNA polymerase hoạt động."},{"id":"SIN_12_T1_MCQ_5","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Thông hiểu","type":"mcq","question":"Phân tích bản chất của \"Tái bản DNA theo nguyên tắc bán bảo toàn\" trong chương trình Sinh học 12 (Di truyền phân tử & Cơ chế biến dị), phát biểu nào dưới đây giải thích đúng cơ chế/nguyên lí?","options":["Mỗi phân tử DNA con giữ lại một mạch cũ của DNA mẹ và tổng hợp một mạch mới bổ sung theo chiều 5' → 3' nhờ enzyme DNA polymerase","Enzyme DNA polymerase tổng hợp d":"c","statement":"Ý c: Nhiều bộ ba codon khác nhau cùng mã hóa cho một loại amino acid (trừ AUG và UGG), giúp giảm thiểu tác hại của đột biến thay thế nucleotide.","correct":true},{"id":"d","statement":"Ý d: Thymine (T) tự do của môi trường nội bào liên kết bổ sung với Adenine (A) trên mạch khuôn.","correct":false}],"explanation":"Ý a và c đúng theo SGK 12; Ý b và d sai."},{"id":"SIN_12_T1_SA_1","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Vận dụng","type":"sa","question":"Phân tử mRNA trưởng thành của sinh vật nhân thực có 1500 nucleotide tham gia dịch mã (tính cả bộ ba mở đầu và 1 bộ ba kết thúc). Chuỗi polypeptide hoàn chỉnh sau khi cắt bỏ amino acid mở đầu có bao nhiêu amino acid?","correctAnswer":"498","explanation":"Số codon = 1500 / 3 = 500. Trừ 1 codon kết thúc và 1 Met mở đầu bị cắt bỏ => còn 498 amino acid."},{"id":"SIN_12_T1_SA_2","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Vận dụng","type":"sa","question":"Ở người, bộ nhiễm sắc thể lưỡng bội 2n = 46. Một người mắc hội chứng Turner (XO) có tổng số nhiễm sắc thể trong mỗi tế bào sinh dưỡng bình thường là bao nhiêu?","correctAnswer":"45","explanation":"Hội chứng Turner là thể một nhiễm cặp NST giới tính (2n - 1 = 45 NST)."},{"id":"SIN_12_T1_SA_3","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Vận dụng","type":"sa","question":"Phân tử mRNA trưởng thành của sinh vật nhân thực có 1500 nucleotide tham gia dịch mã (tính cả bộ ba mở đầu và 1 bộ ba kết thúc). Chuỗi polypeptide hoàn chỉnh sau khi cắt bỏ amino acid mở đầu có bao nhiêu amino acid?","correctAnswer":"498","explanation":"Số codon = 1500 / 3 = 500. Trừ 1 codon kết thúc và 1 Met mở đầu bị cắt bỏ => còn 498 amino acid."},{"id":"SIN_12_T1_SA_4","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Vận dụng","type":"sa","question":"Ở người, bộ nhiễm sắc thể lưỡng bội 2n = 46. Một người mắc hội chứ subject":"Sinh học","grade":"12","topic":"Di truyền Nhiễm sắc thể & Quy luật Mendel","level":"Vận dụng","type":"sa","question":"Một cơ thể có kiểu gen AB/ab thực hiện giảm phân tạo giao tử với tần số hoán vị gen f = 24%. Tỉ lệ loại giao tử hoán vị Ab tạo ra là bao nhiêu phần trăm?","correctAnswer":"12","explanation":"Tỉ lệ mỗi loại giao tử hoán vị = f / 2 = 24% / 2 = 12%."},{"id":"SIN_12_T2_SA_3","subject":"Sinh học","grade":"12","topic":"Di truyền Nhiễm sắc thể & Quy luật Mendel","level":"Vận dụng","type":"sa","question":"Ở đậu Hà Lan, gen A quy định hạt vàng trội hoàn toàn so với allele a quy định hạt xanh. Cho cây dị hợp Aa tự thụ phấn thu được đời F1. Tỉ lệ cây hạt vàng thuần chủng (AA) ở đời F1 là bao nhiêu phần trăm?","correctAnswer":"25","explanation":"Aa × Aa → 1/4 AA : 2/4 Aa : 1/4 aa. Vậy tỉ lệ AA = 25%."},{"id":"SIN_12_T2_SA_4","subject":"Sinh học","grade":"12","topic":"Di truyền Nhiễm sắc thể & Quy luật Mendel","level":"Vận dụng","type":"sa","question":"Một cơ thể có kiểu gen AB/ab thực hiện giảm phân tạo giao tử với tần số hoán vị gen f = 24%. Tỉ lệ loại giao tử hoán vị Ab tạo ra là bao nhiêu phần trăm?","correctAnswer":"12","explanation":"Tỉ lệ mỗi loại giao tử hoán vị = f / 2 = 24% / 2 = 12%."},{"id":"SIN_12_T3_MCQ_1","subject":"Sinh học","grade":"12","topic":"Di truyền quần thể & Công nghệ Gen","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Định luật cân bằng di truyền Hardy-Weinberg\" trong chuyên đề Di truyền quần thể & Công nghệ Gen (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Trong quần thể ngẫu phối kích thước lớn, không có tác động của các nhân tố tiến hóa, tần số allele và thành phần kiểu gen duy trì không đổi qua các thế hệ","Chỉ cần một thế hệ tự thụ phấn thì quần thể sẽ ngay lập tức đạt trạng thái cân bằng Hardy-Weinberg","Khi quần thể đạt cân bằng di truyền, tần số kiểu gen dị hợp luôn bằng tổng tần số hai kiểu gen đồng hợp","Định luật Hardy-Weinberg áp dụng chính xác cho các quần thể nhỏ đang inberg"],"correct":2,"explanation":"[Mức độ: Thông hiểu] Điều kiện nghiệm đúng của định luật Hardy-Weinberg: quần thể lớn, ngẫu phối, không đột biến, không chọn lọc, không di-nhập gen."},{"id":"SIN_12_T3_MCQ_4","subject":"Sinh học","grade":"12","topic":"Di truyền quần thể & Công nghệ Gen","level":"Thông hiểu","type":"mcq","question":"Phân tích bản chất của \"Quy trình tạo DNA tái tổ hợp trong Công nghệ Gen\" trong chương trình Sinh học 12 (Di truyền quần thể & Công nghệ Gen), phát biểu nào dưới đây giải thích đúng cơ chế/nguyên lí?","options":["Thể truyền plasmid là một đoạn RNA mạch đơn có khả năng nhân đôi độc lập trong tế bào chất vi khuẩn","Sau khi chuyển DNA tái tổ hợp vào tế bào nhận, tất cả 100% tế bào đều nhận được gen mong muốn","Sử dụng hai loại enzyme cắt giới hạn tạo ra hai đầu cắt hoàn toàn không bổ sung để tránh plasmid tự nối lại","Sử dụng cùng một loại enzyme cắt giới hạn (restrictase) để cắt gen cần chuyển và thể truyền plasmid tạo đầu dính bổ sung, sau đó nối lại bằng enzyme DNA ligase"],"correct":3,"explanation":"[Mức độ: Thông hiểu] Dùng chung 1 loại restrictase tạo đầu dính bổ sung giúp DNA ligase nối chính xác gen mục tiêu vào vector."},{"id":"SIN_12_T3_MCQ_5","subject":"Sinh học","grade":"12","topic":"Di truyền quần thể & Công nghệ Gen","level":"Vận dụng","type":"mcq","question":"[Tình huống thực tiễn] Trong một quần thể người đang ở trạng thái cân bằng di truyền Hardy-Weinberg, tỉ lệ người mắc bệnh bạch tạng là 1/10000. Vận dụng kiến thức về \"Định luật cân bằng di truyền Hardy-Weinberg\", kết luận hoặc giải pháp nào sau đây là phù hợp nhất?","options":["Trong quần thể ngẫu phối kích thước lớn, không có tác động của các nhân tố tiến hóa, tần số allele và thành phần kiểu gen duy trì không đổi qua các thế hệ","Định luật Hardy-Weinberg áp dụng chính xác cho các quần thể nhỏ đang chịu chọn lọc tự nhiên khốc liệt","Chỉ cần một thế hệ tự thụ phấn thì quần thể sẽ ngay lập tức đạt trạng thái cân bằng Hardy-Weinberg","Khi quần thể đạt cân bằng di truy phần trăm?","correctAnswer":"4","explanation":"q(a) = 1 - 0.8 = 0.2. Tỉ lệ kiểu gen aa = q² = 0.2² = 0.04 = 4%."},{"id":"SIN_12_T3_SA_3","subject":"Sinh học","grade":"12","topic":"Di truyền quần thể & Công nghệ Gen","level":"Vận dụng","type":"sa","question":"Một quần thể ngẫu phối đạt cân bằng Hardy-Weinberg có tần số allele trội A = 0.8. Tỉ lệ kiểu gen đồng hợp lặn aa trong quần thể này là bao nhiêu phần trăm?","correctAnswer":"4","explanation":"q(a) = 1 - 0.8 = 0.2. Tỉ lệ kiểu gen aa = q² = 0.2² = 0.04 = 4%."},{"id":"SIN_12_T3_SA_4","subject":"Sinh học","grade":"12","topic":"Di truyền quần thể & Công nghệ Gen","level":"Vận dụng","type":"sa","question":"Một quần thể ngẫu phối đạt cân bằng Hardy-Weinberg có tần số allele trội A = 0.8. Tỉ lệ kiểu gen đồng hợp lặn aa trong quần thể này là bao nhiêu phần trăm?","correctAnswer":"4","explanation":"q(a) = 1 - 0.8 = 0.2. Tỉ lệ kiểu gen aa = q² = 0.2² = 0.04 = 4%."},{"id":"SIN_12_T4_MCQ_1","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Bằng chứng giải phẫu so sánh (Cơ quan tương đồng và tương tự)\" trong chuyên đề Tiến hóa & Học thuyết hiện đại (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Cơ quan tương đồng là những cơ quan nằm ở vị trí tương ứng trên cơ thể, có cùng nguồn gốc phôi sinh nên phản ánh sự tiến hóa phân li từ tổ tiên chung","Cánh của chim và cánh của côn trùng là cơ quan tương đồng vì chúng đều thực hiện chức năng bay lượn","Cơ quan tương tự phản ánh nguồn gốc chung gần gũi giữa các loài thuộc các lớp động vật khác nhau","Cơ quan thoái hóa ở người như ruột thừa chứng tỏ loài người không có quan hệ họ hàng với động vật có vú"],"correct":0,"explanation":"[Mức độ: Nhận biết] Cơ quan tương đồng cùng nguồn gốc phôi sinh, thực hiện chức năng khác nhau do thích nghi môi trường."},{"id":"SIN_12_T4_MCQ_2","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Chọn lọc tự nhiên theo thuyết tiến hóa hiện đại\" trong chuyên đề Tiến hóa & Học thuyết hiện đại (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Chọn lọc tự nhiên chống lại allele lặn sẽ loại bỏ hoàn toàn allele lặn khỏi quần thể ngẫu phối chỉ sau 1 thế hệ","Chọn lọc tự nhiên tác động trực tiếp lên kiểu hình, qua đó gián tiếp làm biến đổi tần số kiểu gen và tần số allele theo một hướng xác định","Chọn lọc tự nhiên chống lại allele trội diễn ra chậm hơn nhiều so với chọn lọc chống lại allele lặn","Chọn lọc tự nhiên làm phát sinh các đột biến có lợi đáp ứng nhu cầu thích nghi của sinh vật"],"correct":1,"explanation":"[Mức độ: Nhận biết] Chọn lọc tự nhiên sàng lọc kiểu hình thích nghi, định hướng tiến hóa."},{"id":"SIN_12_T4_MCQ_3","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Thông hiểu","type":"mcq","question":"Phân tích bản chất của \"Bằng chứng giải phẫu so sánh (Cơ quan tương đồng và tương tự)\" trong chương trình Sinh học 12 (Tiến hóa & Học thuyết hiện đại), phát biểu nào dưới đây giải thích đúng cơ chế/nguyên lí?","options":["Cơ quan tương tự phản ánh nguồn gốc chung gần gũi giữa các loài thuộc các lớp động vật khác nhau","Cơ quan thoái hóa ở người như ruột thừa chứng tỏ loài người không có quan hệ họ hàng với động vật có vú","Cơ quan tương đồng là những cơ quan nằm ở vị trí tương ứng trên cơ thể, có cùng nguồn gốc phôi sinh nên phản ánh sự tiến hóa phân li từ tổ tiên chung","Cánh của chim và cánh của côn trùng là cơ quan tương đồng vì chúng đều thực hiện chức năng bay lượn"],"correct":2,"explanation":"[Mức độ: Thông hiểu] Cơ quan tương đồng cùng nguồn gốc phôi sinh, thực hiện chức năng khác nhau do thích nghi môi trường."},{"id":"SIN_12_T4_MCQ_4","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Thông hiểu","type":"mcq","question":"Phân tích bản chất của \"Chọn lọc tự nhiên theo thuyết tiến hóa hiện đại\" trong chương trình Sinh học 12 (Tiến hóa & Học thuyết hiện đại), phát biểu nào dưới đây giải thích đúng cơ chế/nguyên lí?","options":["Chọn lọc tự nhiên chống lại allele trội diễn ra chậm hơn nhiều so với chọn lọc chống lại allele lặn","Chọn lọc tự nhiên làm phát sinh các đột biến có lợi đáp ứng nhu cầu thích nghi của sinh vật","Chọn lọc tự nhiên chống lại allele lặn sẽ loại bỏ hoàn toàn allele lặn khỏi quần thể ngẫu phối chỉ sau 1 thế hệ","Chọn lọc tự nhiên tác động trực tiếp lên kiểu hình, qua đó gián tiếp làm biến đổi tần số kiểu gen và tần số allele theo một hướng xác định"],"correct":3,"explanation":"[Mức độ: Thông hiểu] Chọn lọc tự nhiên sàng lọc kiểu hình thích nghi, định hướng tiến hóa."},{"id":"SIN_12_T4_MCQ_5","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Vận dụng","type":"mcq","question":"[Tình huống thực tiễn] Việc lạm dụng kháng sinh không đúng liều lượng khiến các chủng vi khuẩn tụ cầu vàng kháng thuốc ngày càng phổ biến trong bệnh viện. Vận dụng kiến thức về \"Bằng chứng giải phẫu so sánh (Cơ quan tương đồng và tương tự)\", kết luận hoặc giải pháp nào sau đây là phù hợp nhất?","options":["Cơ quan tương đồng là những cơ quan nằm ở vị trí tương ứng trên cơ thể, có cùng nguồn gốc phôi sinh nên phản ánh sự tiến hóa phân li từ tổ tiên chung","Cơ quan thoái hóa ở người như ruột thừa chứng tỏ loài người không có quan hệ họ hàng với động vật có vú","Cánh của chim và cánh của côn trùng là cơ quan tương đồng vì chúng đều thực hiện chức năng bay lượn","Cơ quan tương tự phản ánh nguồn gốc chung gần gũi giữa các loài thuộc các lớp động vật khác nhau"],"correct":0,"explanation":"[Mức độ: Vận dụng] Cơ quan tương đồng cùng nguồn gốc phôi sinh, thực hiện chức năng khác nhau do thích nghi môi trường."},{"id":"SIN_12_T4_MCQ_6","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Vận dụng","type":"mcq","question":"[Tình huống thực tiễn] Một trận bão lớn cuốn trôi một nhóm nhỏ chim sẻ từ đất liền ra một hòn đảo hoang vắ   <script>
    (function() {
      const e = React.createElement;

      const INITIAL_QUESTIONS = JSON.parse(document.getElementById("app-data-questions").textContent);
      const SUBJECT_GRADE_TOPICS = JSON.parse(document.getElementById("app-data-topics").textContent);
      const DEFAULT_PIN = JSON.parse(document.getElementById("app-data-pin").textContent);

      function BioMasterWebApp() {
        const [tab, setTab] = useState("quiz");
        const [questions, setQuestions] = useState(function() {
          try { const s = localStorage.getItem("bm_q_v4"); return s ? JSON.parse(s) : INITIAL_QUESTIONS; } catch(err) { return INITIAL_QUESTIONS; }
        });
        const [subject, setSubject] = useState("Sinh học");
        const [grade, setGrade] = useState("12");
        const [topic, setTopic] = useState("Tất cả");
        const [mode, setMode] = useState("practice");
        const [stuName, setStuName] = useState("");
        const [stuClass, setStuClass] = useState("");
        const [started, setStarted] = useState(false);
        const [activeQs, setActiveQs] = useState([]);
        const [idx, setIdx] = useState(0);
        const [answers, setAnswers] = useState({});
        const [submitted, setSubmitted] = useState(false);
        const [timeLeft, setTimeLeft] = useState(900);
        const [subs, setSubs] = useState(function() {
          try { const s = localStorage.getItem("bm_s_v4"); return s ? JSON.parse(s) : []; } catch(err) { return []; }
        });
        const [auth, setAuth] = useState(false);
        const [pinIn, setPinIn] = useState("");
        const [apiKey, setApiKey] = useState(function() { return localStorage.getItem("bm_gemini_key") || ""; });
        const [upSub, setUpSub] = useState("Sinh học");
        const [upGrade, setUpGrade] = useState("12");
        const [upTopic, setUpTopic] = useState(SUBJECT_GRADE_TOPICS["Sinh học"]["12"][0]);
        const [rawTxt, setRawTxt] = useState("");
        const [aiList, setAiList] = useState([]);
        const [loadingAi, setLoadingAi] = useState(false);
        const [msg, setMsg] = useState("");

        const notify = function(t) { setMsg(t); setTimeout(function() { setMsg(""); }, 4000); };

        useEffect(function() {
          try {
            const p = new URLSearchParams(window.location.search);
            if (p.get("role") === "teacher") setTab("teacher");
            if (p.get("subject") && SUBJECT_GRADE_TOPICS[p.get("subject")]) setSubject(p.get("subject"));
            if (["10","11","12"].includes(p.get("grade"))) setGrade(p.get("grade"));
          } catch(err) {}
        }, []);

        useEffect(function() { try { localStorage.setItem("bm_q_v4", JSON.stringify(questions)); } catch(err) {} }, [questions]);
        useEffect(function() { try { localStorage.setItem("bm_s_v4", JSON.stringify(subs)); } catch(err) {} }, [subs]);

        const topicsList = useMemo(function() {
          return ["Tất cả"].concat(SUBJECT_GRADE_TOPICS[subject]?.[grade] || []);
        }, [subject, grade]);

        const filteredQs = useMemo(function() {
          return questions.filter(function(q) {
            if (q.subject !== subject || q.grade !== grade) return false;
            if (topic !== "Tất cả" && q.topic !== topic) return false;
            return true;
          });
        }, [questions, subject, grade, topic]);

        const calcScore = useCallback(function() {
          let sc = 0;
          activeQs.forEach(function(q, i) {
            const a = answers[i];
            if (q.type === "mcq" && a === q.correct) sc++;
            if (q.type === "tf" && a && Array.isArray(q.items)) { if (q.items.every(function(it) { return a[it.id] === it.correct; })) sc++; }
            if (q.type === "sa" && a && q.correctAnswer) { if (a.toString().trim().toLowerCase() === q.correctAnswer.toString().trim().toLowerCase()) sc++; }
          });
          return sc;
        }, [activeQs, answers]);

        const submitQuiz = useCallback(function() {
          setSubmitted(true);
          const sc = calcScore();
          setSubs(function(prev) {
            return [{ id: Date.now(), name: stuName.trim(), cls: stuClass.trim() || ("Lớp " + grade), sub: subject, gr: grade, sc: sc, tot: activeQs.length, pct: Math.round((sc / (activeQs.length || 1)) * 100), time: new Date().toLocaleString("vi-VN") }].concat(prev);
          });
        }, [calcScore, stuName, stuClass, grade, subject, activeQs.length]);

        useEffect(function() {
          if (!started || mode === "practice" || submitted) return;
          const t = setInterval(function() {
            setTimeLeft(function(p) { if (p <= 1) { clearInterval(t); submitQuiz(); return 0; } return p - 1; });
          }, 1000);
          return function() { clearInterval(t); };
        }, [started, mode, submitted, submitQuiz]);

        const startQuiz = function() {
          if (!stuName.trim()) { notify("Vui lòng nhập Họ và Tên học sinh!"); return; }
          const list = mode === "mock" ? filteredQs.slice().sort(function() { return Math.random() - 0.5; }) : filteredQs.slice();
          setActiveQs(list); setIdx(0); setAnswers({}); setSubmitted(false); setTimeLeft(mode === "mock" ? 3000 : 900); setStarted(true);
        };

        const onDocxFile = async function(ev) {
          const f = ev.target.files && ev.target.files[0];
          if (!f) return;
          if (f.name.toLowerCase().endsWith(".docx") && window.mammoth) {
            const buf = await f.arrayBuffer();
            const r = await window.mammoth.extractRawText({ arrayBuffer: buf });
            setRawTxt(r.value || ""); notify("Đã đọc xong file Word (.docx)!");
          } else {
            const rd = new FileReader();
            rd.onload = function(x) { setRawTxt(x.target.result || ""); notify("Đã đọc nội dung tệp!"); };
            rd.readAsText(f);
          }
        };

        const runAi = async function() {
          if (!apiKey.trim()) { notify("Vui lòng dán Gemini API Key (miễn phí tại aistudio.google.com)!"); return; }
          if (!rawTxt.trim()) { notify("Vui lòng tải file đề hoặc dán nội dung câu hỏi!"); return; }
          localStorage.setItem("bm_gemini_key", apiKey.trim());
          setLoadingAi(true);
          try {
            const prompt = "Bạn là chuyên gia ra đề THPT GDPT 2018. Dựa vào đề gốc:\n" + rawTxt + "\nHãy tạo bộ câu hỏi MỚI tương tự cho môn " + upSub + " lớp " + upGrade + ", chủ đề " + upTopic + ". Trả về DUY NHẤT JSON array gồm các object: {type, question, options, correct, items, correctAnswer, explanation}";
            const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey.trim(), {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const txt = (data?.candidates?.[0]?.content?.parts?.[0]?.text || "").replace(/```json/g, "").replace(/```/g, "").trim();
            const arr = JSON.parse(txt);
            if (Array.isArray(arr)) {
              setAiList(arr.map(function(it, i) { return Object.assign({}, it, { id: "AI_" + Date.now() + "_" + i, subject: upSub, grade: upGrade, topic: upTopic, isCloned: true }); }));
              notify("AI đã tạo thành công " + arr.length + " câu hỏi tương tự!");
            }
          } catch(err) { notify("Lỗi gọi AI, kiểm tra lại API Key!"); }
          setLoadingAi(false);
        };

        const curQ = activeQs[idx];

        return e("div", { className: "min-h-screen flex flex-col" },
          msg && e("div", { className: "fixed bottom-4 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs font-bold border border-emerald-500" }, "✨ " + msg),
          e("header", { className: "bg-gradient-to-r from-emerald-800 via-teal-700 to-indigo-900 text-white p-4 shadow-md no-print" },
            e("div", { className: "max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3" },
              e("div", null,
                e("h1", { className: "text-lg sm:text-xl font-bold" }, "BioMaster THPT — Thầy Trương Trung Can"),
                e("p", { className: "text-xs text-emerald-100" }, "Hệ thống Ôn thi 3 Khối (10, 11, 12) • Sinh học • Công nghệ NN • Tiếng Anh")
              ),
              e("div", { className: "flex gap-2" },
                e("button", { onClick: function() { setTab("quiz"); }, className: "px-3 py-1.5 rounded-lg text-xs font-bold " + (tab === "quiz" ? "bg-white text-emerald-900" : "bg-white/15 text-white") }, "Luyện Ôn Thi"),
                e("button", { onClick: function() { setTab("teacher"); }, className: "px-3 py-1.5 rounded-lg text-xs font-bold " + (tab === "teacher" ? "bg-white text-emerald-900" : "bg-white/15 text-white") }, "Góc Giáo Viên"),
                e("button", { onClick: function() { setTab("print"); }, className: "px-3 py-1.5 rounded-lg text-xs font-bold " + (tab === "print" ? "bg-white text-emerald-900" : "bg-white/15 text-white") }, "In Đề PDF")
              )
            )
          ),
          e("main", { className: "flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6" },
            tab === "quiz" && !started && e("div", { className: "bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5" },
              e("div", { className: "flex flex-wrap items-center justify-between gap-2 border-b pb-3" },
                e("span", { className: "font-bold text-sm text-slate-700" }, "1. Chọn Môn & Khối Lớp:"),
                e("div", { className: "flex gap-1.5 bg-slate-100 p-1 rounded-xl" },
                  ["10", "11", "12"].map(function(g) {
                    return e("button", { key: g, onClick: function() { setGrade(g); setTopic("Tất cả"); }, className: "px-3 py-1 rounded-lg text-xs font-bold " + (grade === g ? "bg-emerald-600 text-white" : "text-slate-600") }, "Lớp " + g);
                  })
                )
              ),
              e("div", { className: "grid grid-cols-1 sm:grid-cols-3 gap-3" },
                ["Sinh học", "Công nghệ Nông nghiệp", "Tiếng Anh"].map(function(s) {
                  return e("button", { key: s, onClick: function() { setSubject(s); setTopic("Tất cả"); }, className: "p-3.5 rounded-xl border-2 text-left font-bold text-sm " + (subject === s ? "border-emerald-600 bg-emerald-50 text-emerald-900" : "border-slate-200 text-slate-700") },
                    s,
                    e("span", { className: "block text-xs font-normal text-slate-500 mt-0.5" }, "Chương trình Lớp " + grade)
                  );
                })
              ),
              e("div", { className: "grid grid-cols-1 sm:grid-cols-2 gap-3 bg-emerald-50/60 p-4 rounded-xl border border-emerald-200" },
                e("div", null,
                  e("label", { className: "block text-xs font-bold text-slate-700 mb-1" }, "Họ và Tên Học Sinh (*):"),
                  e("input", { type: "text", value: stuName, onChange: function(ev) { setStuName(ev.target.value); }, placeholder: "Nhập họ tên...", className: "w-full p-2.5 border rounded-lg text-sm bg-white" })
                ),
                e("div", null,
                  e("label", { className: "block text-xs font-bold text-slate-700 mb-1" }, "Lớp:"),
                  e("input", { type: "text", value: stuClass, onChange: function(ev) { setStuClass(ev.target.value); }, placeholder: "Ví dụ: " + grade + "A1", className: "w-full p-2.5 border rounded-lg text-sm bg-white" })
                )
              ),
              e("div", { className: "grid grid-cols-1 sm:grid-cols-2 gap-3" },
                e("div", null,
                  e("label", { className: "block text-xs font-bold text-slate-700 mb-1" }, "Chủ đề ôn tập:"),
                  e("select", { value: topic, onChange: function(ev) { setTopic(ev.target.value); }, className: "w-full p-2.5 border rounded-xl text-sm bg-white" },
                    topicsList.map(function(t) { return e("option", { key: t, value: t }, t); })
                  )
                ),
                e("div", null,
                  e("label", { className: "block text-xs font-bold text-slate-700 mb-1" }, "Chế độ làm bài:"),
                  e("select", { value: mode, onChange: function(ev) { setMode(ev.target.value); }, className: "w-full p-2.5 border rounded-xl text-sm bg-white" },
                    e("option", { value: "practice" }, "Tự luyện (Xem đáp án ngay)"),
                    e("option", { value: "timed" }, "Tính giờ 15 phút"),
                    e("option", { value: "mock" }, "Thi thử Full 50 phút")
                  )
                )
              ),
              e("div", { className: "flex items-center justify-between pt-3 border-t" },
                e("span", { className: "text-xs text-slate-600" }, "Ngân hàng sẵn sàng: ", e("b", null, filteredQs.length + " câu hỏi")),
                e("button", { onClick: startQuiz, disabled: filteredQs.length === 0, className: "bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm shadow" }, "Bắt Đầu Làm Bài ⚡")
              )
            ),
            tab === "quiz" && started && curQ && e("div", { className: "space-y-4" },
              e("div", { className: "bg-white p-4 rounded-xl border flex flex-wrap items-center justify-between gap-2" },
                e("button", { onClick: function() { setStarted(false); }, className: "text-xs font-bold bg-slate-100 px-3 py-1.5 rounded-lg" }, "← Đổi môn/khối"),
                e("span", { className: "text-xs font-bold text-emerald-800" }, subject + " " + grade + " • Câu " + (idx + 1) + "/" + activeQs.length),
                mode !== "practice" && e("span", { className: "font-mono text-xs font-bold bg-amber-100 text-amber-800 px-3 py-1 rounded-lg" }, "⏱ " + Math.floor(timeLeft/60).toString().padStart(2,"0") + ":" + (timeLeft%60).toString().padStart(2,"0")),
                !submitted && e("button", { onClick: submitQuiz, className: "bg-emerald-600 text-white text-xs font-bold px-4 py-1.5 rounded-lg" }, "Nộp Bài")
              ),
              submitted && e("div", { className: "bg-emerald-50 border border-emerald-300 rounded-2xl p-5 text-center" },
                e("h3", { className: "font-bold text-lg text-emerald-900" }, "KẾT QUẢ CỦA " + stuName.toUpperCase()),
                e("p", { className: "text-3xl font-extrabold text-emerald-700 font-mono mt-1" }, calcScore() + " / " + activeQs.length + " Câu Đúng")
              ),
              e("div", { className: "bg-white p-6 rounded-2xl border shadow-sm space-y-5" },
                e("div", { className: "text-xs font-bold text-slate-500" }, curQ.topic),
                e("h3", { className: "text-base sm:text-lg font-bold text-slate-800" }, curQ.question),
                curQ.type === "mcq" && Array.isArray(curQ.options) && e("div", { className: "space-y-2.5" },
                  curQ.options.map(function(opt, oi) {
                    const picked = answers[idx] === oi;
                    const showRes = mode === "practice" ? answers[idx] !== undefined : submitted;
                    let cls = "border-slate-200 hover:bg-slate-50";
                    if (showRes) {
                      if (oi === curQ.correct) cls = "border-emerald-600 bg-emerald-50 font-bold text-emerald-900";
                      else if (picked) cls = "border-rose-500 bg-rose-50 text-rose-900";
                    } else if (picked) cls = "border-emerald-600 bg-emerald-50 font-bold";
                    return e("button", { key: oi, onClick: function() { if (!(submitted && mode !== "practice")) setAnswers(function(p) { return Object.assign({}, p, { [idx]: oi }); }); }, className: "w-full p-3.5 rounded-xl border text-left text-sm flex gap-3 " + cls },
                      e("span", { className: "font-bold" }, String.fromCharCode(65 + oi) + "."),
                      e("span", null, opt)
                    );
                  })
                ),
                curQ.type === "tf" && Array.isArray(curQ.items) && e("div", { className: "space-y-2.5" },
                  curQ.items.map(function(it) {
                    const tfAns = (answers[idx] || {})[it.id];
                    const showRes = mode === "practice" ? Object.keys(answers[idx] || {}).length > 0 : submitted;
                    return e("div", { key: it.id, className: "p-3 bg-slate-50 rounded-xl border flex flex-wrap items-center justify-between gap-2 text-sm" },
                      e("span", { className: "flex-1" }, e("b", null, it.id + ") "), it.statement),
                      e("div", { className: "flex items-center gap-1.5" },
                        e("button", { onClick: function() { setAnswers(function(p) { const cur = Object.assign({}, p[idx] || {}, { [it.id]: true }); return Object.assign({}, p, { [idx]: cur }); }); }, className: "px-3 py-1 rounded text-xs font-bold border " + (tfAns === true ? "bg-emerald-600 text-white" : "bg-white") }, "Đúng"),
                        e("button", { onClick: function() { setAnswers(function(p) { const cur = Object.assign({}, p[idx] || {}, { [it.id]: false }); return Object.assign({}, p, { [idx]: cur }); }); }, className: "px-3 py-1 rounded text-xs font-bold border " + (tfAns === false ? "bg-rose-600 text-white" : "bg-white") }, "Sai"),
                        showRes && e("span", { className: "text-xs font-bold text-emerald-700 ml-1" }, "[" + (it.correct ? "Đ" : "S") + "]")
                      )
                    );
                  })
                ),
                curQ.type === "sa" && e("div", { className: "space-y-2" },
                  e("input", { type: "text", value: answers[idx] || "", onChange: function(ev) { const v = ev.target.value; setAnswers(function(p) { return Object.assign({}, p, { [idx]: v }); }); }, placeholder: "Nhập đáp án ngắn...", className: "w-full p-3 border rounded-xl font-mono text-sm" }),
                  (mode === "practice" ? Boolean(answers[idx]) : submitted) && e("div", { className: "p-3 bg-emerald-50 text-emerald-900 rounded-xl text-xs font-bold" }, "Đáp án chuẩn: " + curQ.correctAnswer)
                ),
                ((mode === "practice" && answers[idx] !== undefined) || submitted) && e("div", { className: "p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-900" },
                  e("b", null, "💡 Giải thích: "), curQ.explanation
                ),
                e("div", { className: "flex justify-between pt-3 border-t" },
                  e("button", { disabled: idx === 0, onClick: function() { setIdx(function(i) { return i - 1; }); }, className: "px-4 py-2 border rounded-lg text-xs font-bold disabled:opacity-40" }, "← Câu trước"),
                  e("button", { disabled: idx === activeQs.length - 1, onClick: function() { setIdx(function(i) { return i + 1; }); }, className: "px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold disabled:opacity-40" }, "Câu sau →")
                )
              )
            ),
            tab === "teacher" && !auth && e("div", { className: "max-w-sm mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4 text-center" },
              e("h2", { className: "font-bold text-lg" }, "Đăng Nhập Góc Giáo Viên"),
              e("input", { type: "password", value: pinIn, onChange: function(ev) { setPinIn(ev.target.value); }, placeholder: "Nhập mã PIN (mặc định: 123456)", className: "w-full p-3 border rounded-xl text-center font-mono" }),
              e("button", { onClick: function() { if (pinIn === DEFAULT_PIN) setAuth(true); else notify("Sai mật khẩu PIN!"); }, className: "w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-sm" }, "Mở Khóa")
            ),
            tab === "teacher" && auth && e("div", { className: "bg-white p-6 rounded-2xl border shadow-sm space-y-5" },
              e("div", { className: "flex flex-wrap items-center justify-between gap-2 border-b pb-3" },
                e("h2", { className: "font-bold text-base text-slate-800" }, "Upload Đề (.docx / .txt) → AI Sinh Đề Tương Tự"),
                e("button", { onClick: function() { setAuth(false); }, className: "text-xs text-rose-600 font-bold" }, "Đăng xuất")
              ),
              e("div", { className: "bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs space-y-1.5" },
                e("label", { className: "font-bold text-amber-900 block" }, "Gemini API Key (Để chạy AI tạo đề tương tự trên GitHub Pages):"),
                e("input", { type: "password", value: apiKey, onChange: function(ev) { setApiKey(ev.target.value); }, placeholder: "Dán mã AIzaSy... lấy miễn phí tại aistudio.google.com", className: "w-full p-2 border rounded-lg bg-white font-mono text-xs" })
              ),
              e("div", { className: "grid grid-cols-1 sm:grid-cols-3 gap-3" },
                e("select", { value: upSub, onChange: function(ev) { const v = ev.target.value; setUpSub(v); setUpTopic(SUBJECT_GRADE_TOPICS[v][upGrade][0]); }, className: "p-2 border rounded-lg text-xs font-bold" },
                  e("option", { value: "Sinh học" }, "Sinh học"),
                  e("option", { value: "Công nghệ Nông nghiệp" }, "Công nghệ Nông nghiệp"),
                  e("option", { value: "Tiếng Anh" }, "Tiếng Anh")
                ),
                e("select", { value: upGrade, onChange: function(ev) { const v = ev.target.value; setUpGrade(v); setUpTopic(SUBJECT_GRADE_TOPICS[upSub][v][0]); }, className: "p-2 border rounded-lg text-xs font-bold" },
                  e("option", { value: "10" }, "Lớp 10"),
                  e("option", { value: "11" }, "Lớp 11"),
                  e("option", { value: "12" }, "Lớp 12")
                ),
                e("select", { value: upTopic, onChange: function(ev) { setUpTopic(ev.target.value); }, className: "p-2 border rounded-lg text-xs" },
                  (SUBJECT_GRADE_TOPICS[upSub]?.[upGrade] || []).map(function(t) { return e("option", { key: t, value: t }, t); })
                )
              ),
              e("div", null,
                e("label", { className: "cursor-pointer bg-indigo-50 text-indigo-800 border border-indigo-200 px-3 py-2 rounded-lg text-xs font-bold inline-block" },
                  "📂 Chọn file Word (.docx) hoặc (.txt)",
                  e("input", { type: "file", accept: ".docx,.txt", onChange: onDocxFile, className: "hidden" })
                )
              ),
              e("textarea", { rows: 6, value: rawTxt, onChange: function(ev) { setRawTxt(ev.target.value); }, placeholder: "Dán nội dung đề gốc vào đây...", className: "w-full p-3 border rounded-xl text-xs font-mono" }),
              e("div", { className: "flex flex-wrap gap-2" },
                e("button", { onClick: runAi, disabled: loadingAi, className: "bg-indigo-600 text-white font-bold px-4 py-2.5 rounded-xl text-xs" }, loadingAi ? "⏳ AI Đang Tạo Đề..." : "✨ Tạo Đề Tương Tự Bằng AI"),
                aiList.length > 0 && e("button", { onClick: function() { setQuestions(function(p) { return aiList.concat(p); }); setAiList([]); notify("Đã lưu đề AI vào ngân hàng!"); }, className: "bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-xl text-xs" }, "✅ Lưu " + aiList.length + " Câu Vào Ngân Hàng")
              ),
              e("div", { className: "border-t pt-4" },
                e("h3", { className: "font-bold text-sm mb-2" }, "Kết quả học sinh làm bài trên thiết bị này (" + subs.length + " lượt):"),
                subs.map(function(s) {
                  return e("div", { key: s.id, className: "text-xs py-1.5 border-b flex justify-between" },
                    e("span", null, e("b", null, s.name), " (" + s.cls + ") — " + s.sub + " " + s.gr),
                    e("span", { className: "font-bold text-emerald-700" }, s.sc + "/" + s.tot + " (" + s.pct + "%)")
                  );
                })
              )
            ),
            tab === "print" && e("div", { className: "bg-white p-6 rounded-2xl border space-y-4" },
              e("div", { className: "flex justify-between items-center no-print" },
                e("h2", { className: "font-bold text-base" }, "In Đề Thi PDF (" + filteredQs.length + " câu — " + subject + " Lớp " + grade + ")"),
                e("button", { onClick: function() { window.print(); }, className: "bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold" }, "🖨️ In / Lưu PDF")
              ),
              e("div", { className: "space-y-4 text-sm font-serif" },
                filteredQs.map(function(q, i) {
                  return e("div", { key: q.id, className: "space-y-1" },
                    e("p", null, e("b", null, "Câu " + (i + 1) + ": "), q.question),
                    q.type === "mcq" && Array.isArray(q.options) && e("div", { className: "grid grid-cols-2 gap-1 pl-4" },
                      q.options.map(function(o, oi) { return e("div", { key: oi }, e("b", null, String.fromCharCode(65 + oi) + ". "), o); })
                    )
                  );
                })
              )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(e(BioMasterWebApp));
    })();
  </script>
</body>
</html>
