hận biết","type":"mcq","question":"Khi tìm hiểu về \"Tái bản DNA theo nguyên tắc bán bảo toàn\" trong chuyên đề Di truyền phân tử & Cơ chế biến dị (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Mỗi phân tử DNA con giữ lại một mạch cũ của DNA mẹ và tổng hợp một mạch mới bổ sung theo chiều 5' → 3' nhờ enzyme DNA polymerase","Cả hai mạch mới được tổng hợp liên tục cùng chiều tháo xoắn mà không cần đoạn mồi RNA","Enzyme DNA polymerase tổng hợp mạch mới theo chiều 3' → 5' trên cả hai mạch khuôn","Phân tử DNA mẹ bị phân hủy hoàn toàn thành các nucleotide tự do sau mỗi lần nhân đôi"],"correct":0,"explanation":"[Mức độ: Nhận biết] DNA tái bản theo nguyên tắc bổ sung và bán bảo toàn; DNA polymerase chỉ tổng hợp mạch mới theo chiều 5' → 3'."},{"id":"SIN_12_T1_MCQ_2","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Phiên mã tổng hợp các loại RNA\" trong chuyên đề Di truyền phân tử & Cơ chế biến dị (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Quá trình phiên mã sử dụng cả hai mạch của gen làm khuôn để tạo ra RNA mạch kép","Enzyme RNA polymerase trượt trên mạch khuôn 3' → 5' của gen để tổng hợp phân tử RNA theo chiều 5' → 3' mà không cần đoạn mồi","Thymine (T) tự do của môi trường nội bào liên kết bổ sung với Adenine (A) trên mạch khuôn","Ở sinh vật nhân thực, mRNA sơ khai được dịch mã ngay trong nhân tế bào trước khi cắt intron"],"correct":1,"explanation":"[Mức độ: Nhận biết] RNA polymerase tự khởi đầu phiên mã trên mạch gốc 3' → 5', lắp rU bổ sung với A của gen."},{"id":"SIN_12_T1_MCQ_3","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Mã di truyền và tính thoái hóa của mã\" trong chuyên đề Di truyền phân tử & Cơ chế biến dị (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Một bộ ba codon trên mRNA có thể đồng thời mã hóa cho hai hoặc ba loại amino acid khác nhau","Mã di truyền được đọc gối lên nhau từng nucleotide một từ đầu 3' đến đầu 5' của mRNA","Nhiều bộ ba codon khác nhau cùng mã hóa cho một loại amino acid (trừ AUG và UGG), giúp giảm thiểu tác hại của đột biến thay thế nucleotide","Bộ ba UAA, UAG và UGA mã hóa cho amino acid mở đầu Methionine ở sinh vật nhân thực"],"correct":2,"explanation":"[Mức độ: Nhận biết] Tính thoái hóa của mã di truyền giúp nhiều đột biến đồng nghĩa không làm thay đổi chuỗi polypeptide."},{"id":"SIN_12_T1_MCQ_4","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Điều hòa biểu hiện gen ở Operon Lac (E. coli)\" trong chuyên đề Di truyền phân tử & Cơ chế biến dị (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Gen điều hòa lacI nằm trong thành phần cấu trúc của operon Lac và chỉ phiên mã khi có lactose","Khi môi trường không có lactose, RNA polymerase bám chặt vào vùng O để phiên mã nhóm gen Z, Y, A","Đột biến làm hỏng vùng khởi động Promoter (P) khiến các gen cấu trúc Z, Y, A phiên mã liên tục không ngừng","Khi môi trường có đường lactose, allolactose liên kết làm biến đổi cấu hình protein ức chế LacI khiến nó không bám được vào vùng vận hành Operator (O)"],"correct":3,"explanation":"[Mức độ: Nhận biết] Allolactose đóng vai trò chất cảm ứng làm bất hoạt protein ức chế, giải phóng vùng O cho RNA polymerase hoạt động."},{"id":"SIN_12_T1_MCQ_5","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Thông hiểu","type":"mcq","question":"Phân tích bản chất của \"Tái bản DNA theo nguyên tắc bán bảo toàn\" trong chương trình Sinh học 12 (Di truyền phân tử & Cơ chế biến dị), phát biểu nào dưới đây giải thích đúng cơ chế/nguyên lí?","options":["Mỗi phân tử DNA con giữ lại một mạch cũ của DNA mẹ và tổng hợp một mạch mới bổ sung theo chiều 5' → 3' nhờ enzyme DNA polymerase","Enzyme DNA polymerase tổng hợp d":"c","statement":"Ý c: Nhiều bộ ba codon khác nhau cùng mã hóa cho một loại amino acid (trừ AUG và UGG), giúp giảm thiểu tác hại của đột biến thay thế nucleotide.","correct":true},{"id":"d","statement":"Ý d: Thymine (T) tự do của môi trường nội bào liên kết bổ sung với Adenine (A) trên mạch khuôn.","correct":false}],"explanation":"Ý a và c đúng theo SGK 12; Ý b và d sai."},{"id":"SIN_12_T1_SA_1","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Vận dụng","type":"sa","question":"Phân tử mRNA trưởng thành của sinh vật nhân thực có 1500 nucleotide tham gia dịch mã (tính cả bộ ba mở đầu và 1 bộ ba kết thúc). Chuỗi polypeptide hoàn chỉnh sau khi cắt bỏ amino acid mở đầu có bao nhiêu amino acid?","correctAnswer":"498","explanation":"Số codon = 1500 / 3 = 500. Trừ 1 codon kết thúc và 1 Met mở đầu bị cắt bỏ => còn 498 amino acid."},{"id":"SIN_12_T1_SA_2","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Vận dụng","type":"sa","question":"Ở người, bộ nhiễm sắc thể lưỡng bội 2n = 46. Một người mắc hội chứng Turner (XO) có tổng số nhiễm sắc thể trong mỗi tế bào sinh dưỡng bình thường là bao nhiêu?","correctAnswer":"45","explanation":"Hội chứng Turner là thể một nhiễm cặp NST giới tính (2n - 1 = 45 NST)."},{"id":"SIN_12_T1_SA_3","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Vận dụng","type":"sa","question":"Phân tử mRNA trưởng thành của sinh vật nhân thực có 1500 nucleotide tham gia dịch mã (tính cả bộ ba mở đầu và 1 bộ ba kết thúc). Chuỗi polypeptide hoàn chỉnh sau khi cắt bỏ amino acid mở đầu có bao nhiêu amino acid?","correctAnswer":"498","explanation":"Số codon = 1500 / 3 = 500. Trừ 1 codon kết thúc và 1 Met mở đầu bị cắt bỏ => còn 498 amino acid."},{"id":"SIN_12_T1_SA_4","subject":"Sinh học","grade":"12","topic":"Di truyền phân tử & Cơ chế biến dị","level":"Vận dụng","type":"sa","question":"Ở người, bộ nhiễm sắc thể lưỡng bội 2n = 46. Một người mắc hội chứ subject":"Sinh học","grade":"12","topic":"Di truyền Nhiễm sắc thể & Quy luật Mendel","level":"Vận dụng","type":"sa","question":"Một cơ thể có kiểu gen AB/ab thực hiện giảm phân tạo giao tử với tần số hoán vị gen f = 24%. Tỉ lệ loại giao tử hoán vị Ab tạo ra là bao nhiêu phần trăm?","correctAnswer":"12","explanation":"Tỉ lệ mỗi loại giao tử hoán vị = f / 2 = 24% / 2 = 12%."},{"id":"SIN_12_T2_SA_3","subject":"Sinh học","grade":"12","topic":"Di truyền Nhiễm sắc thể & Quy luật Mendel","level":"Vận dụng","type":"sa","question":"Ở đậu Hà Lan, gen A quy định hạt vàng trội hoàn toàn so với allele a quy định hạt xanh. Cho cây dị hợp Aa tự thụ phấn thu được đời F1. Tỉ lệ cây hạt vàng thuần chủng (AA) ở đời F1 là bao nhiêu phần trăm?","correctAnswer":"25","explanation":"Aa × Aa → 1/4 AA : 2/4 Aa : 1/4 aa. Vậy tỉ lệ AA = 25%."},{"id":"SIN_12_T2_SA_4","subject":"Sinh học","grade":"12","topic":"Di truyền Nhiễm sắc thể & Quy luật Mendel","level":"Vận dụng","type":"sa","question":"Một cơ thể có kiểu gen AB/ab thực hiện giảm phân tạo giao tử với tần số hoán vị gen f = 24%. Tỉ lệ loại giao tử hoán vị Ab tạo ra là bao nhiêu phần trăm?","correctAnswer":"12","explanation":"Tỉ lệ mỗi loại giao tử hoán vị = f / 2 = 24% / 2 = 12%."},{"id":"SIN_12_T3_MCQ_1","subject":"Sinh học","grade":"12","topic":"Di truyền quần thể & Công nghệ Gen","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Định luật cân bằng di truyền Hardy-Weinberg\" trong chuyên đề Di truyền quần thể & Công nghệ Gen (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Trong quần thể ngẫu phối kích thước lớn, không có tác động của các nhân tố tiến hóa, tần số allele và thành phần kiểu gen duy trì không đổi qua các thế hệ","Chỉ cần một thế hệ tự thụ phấn thì quần thể sẽ ngay lập tức đạt trạng thái cân bằng Hardy-Weinberg","Khi quần thể đạt cân bằng di truyền, tần số kiểu gen dị hợp luôn bằng tổng tần số hai kiểu gen đồng hợp","Định luật Hardy-Weinberg áp dụng chính xác cho các quần thể nhỏ đang inberg"],"correct":2,"explanation":"[Mức độ: Thông hiểu] Điều kiện nghiệm đúng của định luật Hardy-Weinberg: quần thể lớn, ngẫu phối, không đột biến, không chọn lọc, không di-nhập gen."},{"id":"SIN_12_T3_MCQ_4","subject":"Sinh học","grade":"12","topic":"Di truyền quần thể & Công nghệ Gen","level":"Thông hiểu","type":"mcq","question":"Phân tích bản chất của \"Quy trình tạo DNA tái tổ hợp trong Công nghệ Gen\" trong chương trình Sinh học 12 (Di truyền quần thể & Công nghệ Gen), phát biểu nào dưới đây giải thích đúng cơ chế/nguyên lí?","options":["Thể truyền plasmid là một đoạn RNA mạch đơn có khả năng nhân đôi độc lập trong tế bào chất vi khuẩn","Sau khi chuyển DNA tái tổ hợp vào tế bào nhận, tất cả 100% tế bào đều nhận được gen mong muốn","Sử dụng hai loại enzyme cắt giới hạn tạo ra hai đầu cắt hoàn toàn không bổ sung để tránh plasmid tự nối lại","Sử dụng cùng một loại enzyme cắt giới hạn (restrictase) để cắt gen cần chuyển và thể truyền plasmid tạo đầu dính bổ sung, sau đó nối lại bằng enzyme DNA ligase"],"correct":3,"explanation":"[Mức độ: Thông hiểu] Dùng chung 1 loại restrictase tạo đầu dính bổ sung giúp DNA ligase nối chính xác gen mục tiêu vào vector."},{"id":"SIN_12_T3_MCQ_5","subject":"Sinh học","grade":"12","topic":"Di truyền quần thể & Công nghệ Gen","level":"Vận dụng","type":"mcq","question":"[Tình huống thực tiễn] Trong một quần thể người đang ở trạng thái cân bằng di truyền Hardy-Weinberg, tỉ lệ người mắc bệnh bạch tạng là 1/10000. Vận dụng kiến thức về \"Định luật cân bằng di truyền Hardy-Weinberg\", kết luận hoặc giải pháp nào sau đây là phù hợp nhất?","options":["Trong quần thể ngẫu phối kích thước lớn, không có tác động của các nhân tố tiến hóa, tần số allele và thành phần kiểu gen duy trì không đổi qua các thế hệ","Định luật Hardy-Weinberg áp dụng chính xác cho các quần thể nhỏ đang chịu chọn lọc tự nhiên khốc liệt","Chỉ cần một thế hệ tự thụ phấn thì quần thể sẽ ngay lập tức đạt trạng thái cân bằng Hardy-Weinberg","Khi quần thể đạt cân bằng di truy phần trăm?","correctAnswer":"4","explanation":"q(a) = 1 - 0.8 = 0.2. Tỉ lệ kiểu gen aa = q² = 0.2² = 0.04 = 4%."},{"id":"SIN_12_T3_SA_3","subject":"Sinh học","grade":"12","topic":"Di truyền quần thể & Công nghệ Gen","level":"Vận dụng","type":"sa","question":"Một quần thể ngẫu phối đạt cân bằng Hardy-Weinberg có tần số allele trội A = 0.8. Tỉ lệ kiểu gen đồng hợp lặn aa trong quần thể này là bao nhiêu phần trăm?","correctAnswer":"4","explanation":"q(a) = 1 - 0.8 = 0.2. Tỉ lệ kiểu gen aa = q² = 0.2² = 0.04 = 4%."},{"id":"SIN_12_T3_SA_4","subject":"Sinh học","grade":"12","topic":"Di truyền quần thể & Công nghệ Gen","level":"Vận dụng","type":"sa","question":"Một quần thể ngẫu phối đạt cân bằng Hardy-Weinberg có tần số allele trội A = 0.8. Tỉ lệ kiểu gen đồng hợp lặn aa trong quần thể này là bao nhiêu phần trăm?","correctAnswer":"4","explanation":"q(a) = 1 - 0.8 = 0.2. Tỉ lệ kiểu gen aa = q² = 0.2² = 0.04 = 4%."},{"id":"SIN_12_T4_MCQ_1","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Bằng chứng giải phẫu so sánh (Cơ quan tương đồng và tương tự)\" trong chuyên đề Tiến hóa & Học thuyết hiện đại (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Cơ quan tương đồng là những cơ quan nằm ở vị trí tương ứng trên cơ thể, có cùng nguồn gốc phôi sinh nên phản ánh sự tiến hóa phân li từ tổ tiên chung","Cánh của chim và cánh của côn trùng là cơ quan tương đồng vì chúng đều thực hiện chức năng bay lượn","Cơ quan tương tự phản ánh nguồn gốc chung gần gũi giữa các loài thuộc các lớp động vật khác nhau","Cơ quan thoái hóa ở người như ruột thừa chứng tỏ loài người không có quan hệ họ hàng với động vật có vú"],"correct":0,"explanation":"[Mức độ: Nhận biết] Cơ quan tương đồng cùng nguồn gốc phôi sinh, thực hiện chức năng khác nhau do thích nghi môi trường."},{"id":"SIN_12_T4_MCQ_2","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Nhận biết","type":"mcq","question":"Khi tìm hiểu về \"Chọn lọc tự nhiên theo thuyết tiến hóa hiện đại\" trong chuyên đề Tiến hóa & Học thuyết hiện đại (Sinh học 12 - GDPT 2018), nhận định nào sau đây là chính xác?","options":["Chọn lọc tự nhiên chống lại allele lặn sẽ loại bỏ hoàn toàn allele lặn khỏi quần thể ngẫu phối chỉ sau 1 thế hệ","Chọn lọc tự nhiên tác động trực tiếp lên kiểu hình, qua đó gián tiếp làm biến đổi tần số kiểu gen và tần số allele theo một hướng xác định","Chọn lọc tự nhiên chống lại allele trội diễn ra chậm hơn nhiều so với chọn lọc chống lại allele lặn","Chọn lọc tự nhiên làm phát sinh các đột biến có lợi đáp ứng nhu cầu thích nghi của sinh vật"],"correct":1,"explanation":"[Mức độ: Nhận biết] Chọn lọc tự nhiên sàng lọc kiểu hình thích nghi, định hướng tiến hóa."},{"id":"SIN_12_T4_MCQ_3","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Thông hiểu","type":"mcq","question":"Phân tích bản chất của \"Bằng chứng giải phẫu so sánh (Cơ quan tương đồng và tương tự)\" trong chương trình Sinh học 12 (Tiến hóa & Học thuyết hiện đại), phát biểu nào dưới đây giải thích đúng cơ chế/nguyên lí?","options":["Cơ quan tương tự phản ánh nguồn gốc chung gần gũi giữa các loài thuộc các lớp động vật khác nhau","Cơ quan thoái hóa ở người như ruột thừa chứng tỏ loài người không có quan hệ họ hàng với động vật có vú","Cơ quan tương đồng là những cơ quan nằm ở vị trí tương ứng trên cơ thể, có cùng nguồn gốc phôi sinh nên phản ánh sự tiến hóa phân li từ tổ tiên chung","Cánh của chim và cánh của côn trùng là cơ quan tương đồng vì chúng đều thực hiện chức năng bay lượn"],"correct":2,"explanation":"[Mức độ: Thông hiểu] Cơ quan tương đồng cùng nguồn gốc phôi sinh, thực hiện chức năng khác nhau do thích nghi môi trường."},{"id":"SIN_12_T4_MCQ_4","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Thông hiểu","type":"mcq","question":"Phân tích bản chất của \"Chọn lọc tự nhiên theo thuyết tiến hóa hiện đại\" trong chương trình Sinh học 12 (Tiến hóa & Học thuyết hiện đại), phát biểu nào dưới đây giải thích đúng cơ chế/nguyên lí?","options":["Chọn lọc tự nhiên chống lại allele trội diễn ra chậm hơn nhiều so với chọn lọc chống lại allele lặn","Chọn lọc tự nhiên làm phát sinh các đột biến có lợi đáp ứng nhu cầu thích nghi của sinh vật","Chọn lọc tự nhiên chống lại allele lặn sẽ loại bỏ hoàn toàn allele lặn khỏi quần thể ngẫu phối chỉ sau 1 thế hệ","Chọn lọc tự nhiên tác động trực tiếp lên kiểu hình, qua đó gián tiếp làm biến đổi tần số kiểu gen và tần số allele theo một hướng xác định"],"correct":3,"explanation":"[Mức độ: Thông hiểu] Chọn lọc tự nhiên sàng lọc kiểu hình thích nghi, định hướng tiến hóa."},{"id":"SIN_12_T4_MCQ_5","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Vận dụng","type":"mcq","question":"[Tình huống thực tiễn] Việc lạm dụng kháng sinh không đúng liều lượng khiến các chủng vi khuẩn tụ cầu vàng kháng thuốc ngày càng phổ biến trong bệnh viện. Vận dụng kiến thức về \"Bằng chứng giải phẫu so sánh (Cơ quan tương đồng và tương tự)\", kết luận hoặc giải pháp nào sau đây là phù hợp nhất?","options":["Cơ quan tương đồng là những cơ quan nằm ở vị trí tương ứng trên cơ thể, có cùng nguồn gốc phôi sinh nên phản ánh sự tiến hóa phân li từ tổ tiên chung","Cơ quan thoái hóa ở người như ruột thừa chứng tỏ loài người không có quan hệ họ hàng với động vật có vú","Cánh của chim và cánh của côn trùng là cơ quan tương đồng vì chúng đều thực hiện chức năng bay lượn","Cơ quan tương tự phản ánh nguồn gốc chung gần gũi giữa các loài thuộc các lớp động vật khác nhau"],"correct":0,"explanation":"[Mức độ: Vận dụng] Cơ quan tương đồng cùng nguồn gốc phôi sinh, thực hiện chức năng khác nhau do thích nghi môi trường."},{"id":"SIN_12_T4_MCQ_6","subject":"Sinh học","grade":"12","topic":"Tiến hóa & Học thuyết hiện đại","level":"Vận dụng","type":"mcq","question":"[Tình huống thực tiễn] Một trận bão lớn cuốn trôi một nhóm nhỏ chim sẻ từ đất liền ra một hòn đảo hoang vắ  đổi thức ăn (FCR) của ao nuôi là bao nhiêu?","correctAnswer":"1.2","explanation":"FCR = 9.6 / 8 = 1.2."},{"id":"CÔN_12_T4_SA_4","subject":"Công nghệ Nông nghiệp","grade":"12","topic":"Công nghệ Thủy sản Bền vững","level":"Vận dụng","type":"sa","question":"Một ao nuôi tôm thẻ chân trắng thu hoạch được 8 tấn tôm thương phẩm, tổng lượng thức ăn công nghiệp đã sử dụng trong cả vụ là 9.6 tấn. Hệ số chuyển đổi thức ăn (FCR) của ao nuôi là bao nhiêu?","correctAnswer":"1.2","explanation":"FCR = 9.6 / 8 = 1.2."},{"id":"ENG_10_D1_MCQ_1","subject":"Tiếng Anh","grade":"10","topic":"English 10: Đề chuẩn cấu trúc THPT - Đọc điền & Sắp xếp hội thoại","type":"mcq","question":"[Read the following school notice and choose the correct option]\nGREEN SCHOOL CLEAN-UP DAY\nAll Grade 10 students are invited to join our annual campus clean-up this Sunday. Please bring reusable water bottles and gardening gloves. Students _______ arrive before 7:30 AM will receive complimentary breakfast vouchers.","options":["who","which","where","whose"],"correct":0,"explanation":"Đại từ quan hệ thay thế cho danh từ chỉ người \"Students\" làm chủ ngữ → \"who\"."},{"id":"ENG_10_D1_MCQ_2","subject":"Tiếng Anh","grade":"10","topic":"English 10: Đề chuẩn cấu trúc THPT - Đọc điền & Sắp xếp hội thoại","type":"mcq","question":"[Choose the correct arrangement of utterances to make a meaningful exchange]\na. Minh: Sure! Let's meet at the school gate at 4:00 PM.\nb. Hoa: Hi Minh, would you like to join our volunteer group to plant trees in the park this afternoon?\nc. Hoa: Awesome! See you there.","options":["a - b - c","b - a - c","b - c - a","c - a - b"],"correct":1,"explanation":"Trình tự hội thoại: Hoa rủ Minh tham gia trồng cây (b) → Minh đồng ý và hẹn giờ gặp (a) → Hoa hẹn gặp lại (c)."},{"id":"ENG_10_D2_MCQ_1","subject":"Tiếng Anh","grade":"10","topic":"English 10: Đề chuẩn cấu trúc THPT - Đọc hiểu & Ngữ pháp ứng dụng","type":"mcq","question":"[Read the following passage and choose the best answer]\nProtecting family traditions helps young people understand their cultural roots. Even in busy modern cities, sharing dinner together allows family members to communicate, reduce stress, and strengthen emotional bonds.\nQuestion: What is the main benefit of sharing family dinners mentioned in the text?","options":["It improves communication and strengthens emotional bonds among family members.","It replaces the need for working or studying in modern cities.","It eliminates all household chores for parents.","It forces children to stay away from their friends."],"correct":0,"explanation":"Câu cuối nêu rõ: \"allows family members to communicate, reduce stress, and strengthen emotional bonds\"."},{"id":"ENG_11_D1_MCQ_1","subject":"Tiếng Anh","grade":"11","topic":"English 11: Đề chuẩn cấu trúc THPT - Đọc điền tờ rơi & Sắp xếp đoạn văn","type":"mcq","question":"[Read the following smart city leaflet and choose the correct option]\nWELCOME TO GREENFIELD SMART CITY\nOur city uses advanced sensors and renewable energy grids to create a cleaner, safer living environment. Smart traffic lights automatically adjust to real-time vehicle flow, _______ reduces daily commuting time by up to 25%.","options":["which","that","who","where"],"correct":0,"explanation":"Đại từ quan hệ \"which\" đứng sau dấu phẩy thay thế cho cả mệnh đề phía trước."},{"id":"ENG_11_D1_MCQ_2","subject":"Tiếng Anh","grade":"11","topic":"English 11: Đề chuẩn cấu trúc THPT - Đọc điền tờ rơi & Sắp xếp đoạn văn","type":"mcq","question":"[Choose the correct arrangement of sentences to make a meaningful paragraph]\na. Therefore, bridging the generation gap requires open-minded listening from both parents and teenagers.\nb. Growing up in different eras often leads to contrasting views on career choices, fashion, and technology use.\nc. When family members respect each other's perspectives, conflicts can turn into constructive conversations.","options":["a - b - c","b - a - c","c - b - a","b - c - a"],"correct":1,"explanation":"Nguyên nhân khoảng cách thế hệ (b) → Giải pháp lắng nghe cởi mở (a) → Kết quả tích cực (c)."},{"id":"ENG_11_D2_MCQ_1","subject":"Tiếng Anh","grade":"11","topic":"English 11: Đề chuẩn cấu trúc THPT - Đọc hiểu & Mệnh đề ngữ pháp","type":"mcq","question":"[Read the following passage and choose the best answer]\nASEAN Youth Volunteer Programs provide high school and university students with opportunities to collaborate on regional environmental and educational projects. Through these exchanges, young leaders develop cross-cultural teamwork skills and deepen mutual understanding across Southeast Asia.\nQuestion: What do participants gain from ASEAN Youth Volunteer Programs?","options":["Cross-cultural teamwork skills and deeper mutual understanding in the region.","Permanent citizenship in all Southeast Asian countries.","Exemption from all university entrance examinations.","Full-time salaries as government diplomats."],"correct":0,"explanation":"Thông tin ở câu cuối: \"develop cross-cultural teamwork skills and deepen mutual understanding across Southeast Asia\"."},{"id":"ENG_12_D1_MCQ_1","subject":"Tiếng Anh","grade":"12","topic":"Đề 1 (Cấu trúc 3 Đề Mẫu): Green Living, City Life & Lifelong Learning","type":"mcq","question":"[Read the following announcement and choose the correct option]\nJOIN OUR GREEN CAMPUS INITIATIVE!\nAre you passionate about protecting the environment? Our school is launching a (1) _______ campaign to reduce plastic waste and promote sustainable habits among students. Every Friday afternoon, volunteers will gather to sort recyclables and plant native trees around the campus. Students (2) _______ participate in at least four sessions will receive a Green Ambassador certificate.","options":["meaningful","meaning","meaningfully","mean"],"correct":0,"explanation":"Trước danh từ \"campaign\" cần một tính từ → \"meaningful\" (có ý nghĩa)."},{"id":"ENG_12_D1_MCQ_2","subject":"Tiếng Anh","grade":"12","topic":"Đề 1 (Cấu trúc 3 Đề Mẫu): Green Living, City Life & Lifelong Learning","type":"mcq","question":"[Read the following leaflet and choose the correct option]\nTIPS FOR EFFECTIVE LIFELONG LEARNING\n• Set clear goals: Break big skills into small, manageable milestones so you do not (1) _______ when facing difficulties.\n• Stay curious: Read widely and ask questions instead of passively memorizing facts.\n• Leverage technology: Use reliable online courses and digital flashcards to review knowledge (2) _______ a regular basis.","options":["take off","give up","put on","look after"],"correct":1,"explanation":"Cụm động từ \"give up\" nghĩa là bỏ cuộc, phù hợp với ngữ cảnh \"khi đối mặt khó khăn\"."},{"id":"ENG_12_D1_MCQ_3","subject":"Tiếng Anh","grade":"12","topic":"Đề 1 (Cấu trúc 3 Đề Mẫu): Green Living, City Life & Lifelong Learning","type":"mcq","question":"[Choose the correct arrangement of utterances to make a meaningful exchange]\na. Nam: That sounds great! What time does the workshop start?\nb. Lan: Hey Nam, are you free this Saturday morning? Our English club is hosting a workshop on AI in education.\nc. Lan: It starts at 8:30 AM in the school library. Don't forget to bring your laptop!","options":["a - b - c","b - c - a","b - a - c","c - a - b"],"correct":2,"explanation":"Trình tự hội thoại tự nhiên: Lan mời tham gia (b) → Nam hỏi giờ bắt đầu (a) → Lan trả lời giờ và địa điểm (c)."},{"id":"ENG_12_D1_MCQ_4","subject":"Tiếng Anh","grade":"12","topic":"Đề 1 (Cấu trúc 3 Đề Mẫu): Green Living, City Life & Lifelong Learning","type":"mcq","question":"[Choose the correct arrangement of sentences to make a meaningful letter]\nDear Mr. Harrison,\na. In addition, I have volunteered at local community clean-up events for the past two years, which strengthened my teamwork skills.\nb. I am writing to express my keen interest in the Youth Environmental Internship advertised on your organization's website.\nc. Thank you for considering my application, and I look forward to the opportunity to discuss how I can contribute to your team.\nd. Currently, I am a twelfth-grade student with a strong academic background in Biology and Environmental Science.\nYours sincerely, Minh Anh","options":["d - b - a - c","b - a - d - c","a - b - d - c","b - d - a - c"],"correct":3,"explanation":"Cấu trúc thư ứng tuyển chuẩn: Nêu lý do viết thư (b) → Giới thiệu bản thân hiện tại (d) → Bổ sung kinh nghiệm tình nguyện (a) → Lời cảm ơn kết thư (c)."},{"id":"ENG_12_D1_MCQ_5","subject":"Tiếng Anh","grade":"12","topic":"Đề 1 (Cấu trúc 3 Đề Mẫu): Green Living, City Life & Lifelong Learning","type":"mcq","question":"[Choose the correct arrangement of sentences to make a meaningful paragraph]\na. Consequently, urban planners are increasingly prioritizing green spaces, pedestrian zones, and electric public transit.\nb. Rapid urbanization has brought significant economic opportunities to millions of people worldwide.\nc. These sustainable solutions not only reduce carbon emissions but also improve the overall mental and physical well-being of city residents.\nd. However, this rapid growth has also led to severe traffic congestion, air pollution, and housing shortages in major metropolises.","options":["b - d - a - c","b - a - d - c","d - b - a - c","a - b - d - c"],"correct":0,"explanation":"Trình tự đoạn văn nghị luận: Mặt tích cực của đô thị hóa (b) → Mặt trái/vấn đề phát sinh (d) → Giải pháp của nhà quy hoạch (a) → Lợi ích của giải pháp (c)."},{"id":"ENG_12_D1_MCQ_6","subject":"Tiếng Anh","grade":"12","topic":"Đề 1 (Cấu trúc 3 Đề Mẫu): Green Living, City Life & Lifelong Learning","type":"mcq","question":"[Read the following passage and choose the correct option that best fits the blank]\nVertical farming is an innovative agricultural method in which crops are grown in vertically stacked layers inside controlled indoor environments. Using LED lighting and hydroponic systems, vertical farms can produce fresh vegetables year-round regardless of external weather conditions. This approach requires up to 95% less water than traditional farming, _______, making it an ideal solution for densely populated cities facing land scarcity.","options":["which eliminating the need for harmful chemical pesticides","and eliminates the need for harmful chemical pesticides","although chemical pesticides are heavily required","because traditional farming uses no water at all"],"correct":1,"explanation":"Cấu trúc song song nối hai động từ vị ngữ của chủ ngữ \"This approach\": \"requires... and eliminates...\"."},{"id":"ENG_12_D1_MCQ_7","subject":"Tiếng Anh","grade":"12","topic":"Đề 1 (Cấu trúc 3 Đề Mẫu): Green Living, City Life & Lifelong Learning","type":"mcq","question":"[Read the following passage about Lifelong Learning and choose the best answer]\nIn the twenty-first century, rapid technological advancements mean that knowledge acquired in school can quickly become outdated. As a result, lifelong learning—the continuous, self-motivated pursuit of knowledge for personal or professional reasons—has become essential. Employees who regularly update their digital literacy and critical thinking skills are far more adaptable in an evolving job market. Moreover, studies in neuroscience show that learning new languages or musical instruments helps keep the brain active and delays cognitive decline in older adults.\nQuestion: Which of the following best summarizes the main idea of the passage?","options":["Traditional school education is no longer necessary because everyone can learn online.","Only older adults benefit from learning new languages and musical instruments.","Lifelong learning is vital for both career adaptability and long-term cognitive health in a fast-changing world.","Technological advancements have eliminated the need for critical thinking in the workplace."],"correct":2,"explanation":"Đoạn văn nhấn mạnh hai lợi ích chính của học tập suốt đời: thích ứng nghề nghiệp (adaptable in an evolving job market) và duy trì sức khỏe nhận thức (delays cognitive decline)."},{"id":"ENG_12_D1_MCQ_8","subject":"Tiếng Anh","grade":"12","topic":"Đề 1 (Cấu trúc 3 Đề Mẫu): Green Living, City Life & Lifelong Learning","type":"mcq","question":"[Read the passage in Question 7 again and answer]\nThe word \"outdated\" in the first sentence is CLOSEST in meaning to _______.","options":["innovative","essential","permanent","obsolete"],"correct":3,"explanation":"\"outdated\" (lỗi thời) đồng nghĩa với \"obsolete\"."},{"id":"ENG_12_D2_MCQ_1","subject":"Tiếng Anh","grade":"12","topic":"Đề 2 (Cấu trúc 3 Đề Mẫu): Cultural Diversity, Technology & Career Paths","type":"mcq","question":"[Read the following advertisement and choose the correct option]\nDISCOVER THE INTERNATIONAL CULTURAL FESTIVAL 2026!\nExperience the vibrant traditions of over 30 countries right in the heart of the city! Visitors will have a chance to taste authentic street food, admire traditional costumes, and enjoy live folk music performances. We strongly encourage attendees (1) _______ public transportation to avoid parking congestion around the venue.","options":["to use","using","use","used"],"correct":0,"explanation":"Cấu trúc \"encourage someone to do something\" (khuyến khích ai làm gì) → \"to use\"."},{"id":"ENG_12_D2_MCQ_2","subject":"Tiếng Anh","grade":"12","topic":"Đề 2 (Cấu trúc 3 Đề Mẫu): Cultural Diversity, Technology & Career Paths","type":"mcq","question":"[Read the following career guide leaflet and choose the correct option]\nPREPARING FOR FUTURE CAREERS IN THE AI ERA\n• Develop soft skills: While machines excel at routine data processing, human qualities such as empathy, leadership, and creative problem-solving remain (1) _______.\n• Build a digital portfolio: Showcase your real-world projects, internships, and volunteer work to stand (2) _______ to potential employers.","options":["irreplaceably","irreplaceable","replace","replacement"],"correct":1,"explanation":"Sau động từ nối \"remain\" cần một tính từ mô tả chủ ngữ \"human qualities\" → \"irreplaceable\" (không thể thay thế)."},{"id":"ENG_12_D2_MCQ_3","subject":"Tiếng Anh","grade":"12","topic":"Đề 2 (Cấu trúc 3 Đề Mẫu): Cultural Diversity, Technology & Career Paths","type":"mcq","question":"[Choose the correct arrangement of utterances to make a meaningful exchange]\na. Mai: I'm leaning toward renewable energy engineering because I want to help combat climate change.\nb. Khoa: Have you decided which university major you're going to apply for next month?\nc. Khoa: That's a super promising field with tons of job opportunities!","options":["a - b - c","b - c - a","b - a - c","c - b - a"],"correct":2,"explanation":"Trình tự hội thoại: Khoa hỏi dự định chọn ngành (b) → Mai trả lời ngành kỹ thuật năng lượng tái tạo (a) → Khoa khen ngợi triển vọng ngành đó (c)."},{"id":"ENG_12_D2_MCQ_4","subject":"Tiếng Anh","grade":"12","topic":"Đề 2 (Cấu trúc 3 Đề Mẫu): Cultural Diversity, Technology & Career Paths","type":"mcq","question":"[Choose the correct arrangement of sentences to make a meaningful paragraph]\na. For instance, exchanging greetings or dining etiquette varies significantly between East Asian and Western societies.\nb. Understanding these subtle cultural differences helps prevent misunderstandings and fosters mutual respect in international workplaces.\nc. Globalization has made cross-cultural communication a daily reality for millions of students and professionals.\nd. Therefore, developing cultural intelligence is just as important as mastering a foreign language.","options":["a - c - b - d","c - b - a - d","b - c - a - d","c - a - b - d"],"correct":3,"explanation":"Trình tự logic: Bối cảnh toàn cầu hóa (c) → Ví dụ cụ thể về khác biệt văn hóa (a) → Lợi ích khi hiểu khác biệt (b) → Kết luận (d)."},{"id":"ENG_12_D2_MCQ_5","subject":"Tiếng Anh","grade":"12","topic":"Đề 2 (Cấu trúc 3 Đề Mẫu): Cultural Diversity, Technology & Career Paths","type":"mcq","question":"[Read the following passage and choose the correct option that best fits the blank]\nArtificial Intelligence is transforming modern healthcare by assisting doctors in diagnosing diseases at an early stage. Machine learning algorithms can analyze thousands of medical images within seconds, _______. Nevertheless, medical experts emphasize that AI should serve as a supportive tool rather than a complete replacement for human physicians, who provide vital emotional care and ethical judgment.","options":["detecting subtle abnormalities that might be missed by the human eye","that detected subtle abnormalities missed by the human eye","which detects subtle abnormalities by the human eye missed","detected subtle abnormalities that might miss the human eye"],"correct":0,"explanation":"Sử dụng phân từ hiện tại (V-ing: \"detecting...\") để rút gọn mệnh đề chỉ kết quả/chức năng bổ sung cho vế trước."},{"id":"ENG_12_D2_MCQ_6","subject":"Tiếng Anh","grade":"12","topic":"Đề 2 (Cấu trúc 3 Đề Mẫu): Cultural Diversity, Technology & Career Paths","type":"mcq","question":"[Read the following passage about Cultural Heritage and choose the best answer]\nIntangible cultural heritage—such as folk songs, traditional festivals, oral storytelling, and artisanal crafts—plays a crucial role in preserving a community's identity. Unlike historic monuments made of stone or wood, intangible heritage lives through people and must be passed down from generation to generation. In Vietnam, UNESCO has recognized numerous treasures, including Quan Ho Bac Ninh folk songs and Ca Tru singing. Today, young artists are creatively blending these traditional melodies with contemporary music to attract younger audiences and keep the heritage alive.\nQuestion: According to the passage, how are young Vietnamese artists helping to preserve intangible cultural heritage?","options":["By building new stone monuments to replace ancient wooden temples.","By combining traditional folk melodies with modern music styles to appeal to youth.","By banning contemporary music from national cultural festivals.","By translating all oral stories into foreign languages only."],"correct":1,"explanation":"Thông tin ở câu cuối: \"young artists are creatively blending these traditional melodies with contemporary music to attract younger audiences\"."},{"id":"ENG_12_D3_MCQ_1","subject":"Tiếng Anh","grade":"12","topic":"Đề 3 (Cấu trúc 3 Đề Mẫu): Wildlife Conservation, Media & Urbanization","type":"mcq","question":"[Read the following notice and choose the correct option]\nWILDLIFE PHOTOGRAPHY EXHIBITION\nCome and witness breathtaking moments captured in Vietnam's national parks! Organized by the Youth Nature Foundation, the exhibition aims to raise public awareness about endangered species (1) _______ habitats are threatened by deforestation. All proceeds from ticket sales will directly fund ranger patrols and wildlife rescue centers.","options":["whose","which","who","whom"],"correct":0,"explanation":"Đại từ quan hệ chỉ sở hữu đứng trước danh từ \"habitats\" (môi trường sống của các loài có nguy cơ tuyệt chủng) → \"whose\"."},{"id":"ENG_12_D3_MCQ_2","subject":"Tiếng Anh","grade":"12","topic":"Đề 3 (Cấu trúc 3 Đề Mẫu): Wildlife Conservation, Media & Urbanization","type":"mcq","question":"[Read the following digital literacy leaflet and choose the correct option]\nHOW TO SPOT FAKE NEWS ON SOCIAL MEDIA\n• Check the source: Verify whether the article comes from a reputable news outlet or an unknown website with sensational headlines.\n• Cross-check facts: Compare the story with other trusted reports before sharing it, so you do not accidentally (1) _______ misinformation among your friends.","options":["prevent","spread","verify","delete"],"correct":1,"explanation":"Động từ \"spread\" (lan truyền) phù hợp với cụm \"spread misinformation\" (lan truyền thông tin sai lệch)."},{"id":"ENG_12_D3_MCQ_3","subject":"Tiếng Anh","grade":"12","topic":"Đề 3 (Cấu trúc 3 Đề Mẫu): Wildlife Conservation, Media & Urbanization","type":"mcq","question":"[Choose the correct arrangement of utterances to make a meaningful exchange]\na. Tuan: I completely agree. Checking multiple reliable sources is essential before believing viral posts.\nb. Linh: Did you see that rumor online claiming that our school is closing for a month?\nc. Linh: Exactly! It turned out to be completely fabricated just to get clicks.","options":["a - b - c","b - c - a","b - a - c","c - a - b"],"correct":2,"explanation":"Trình tự hội thoại: Linh nhắc đến tin đồn trên mạng (b) → Tuấn đồng tình cần kiểm chứng nguồn tin (a) → Linh xác nhận đó là tin giả câu view (c)."},{"id":"ENG_12_D3_MCQ_4","subject":"Tiếng Anh","grade":"12","topic":"Đề 3 (Cấu trúc 3 Đề Mẫu): Wildlife Conservation, Media & Urbanization","type":"mcq","question":"[Choose the correct arrangement of sentences to make a meaningful paragraph]\na. Establishing strictly protected wildlife corridors allows animals to migrate safely between fragmented forest areas.\nb. Illegal poaching and habitat loss have pushed numerous rare mammals and birds to the brink of extinction.\nc. As a result, biodiversity in many tropical regions has declined at an alarming rate over the last few decades.\nd. Thankfully, coordinated conservation programs involving local communities are helping several endangered populations recover.","options":["b - a - c - d","c - b - a - d","a - b - c - d","b - c - a - d"],"correct":3,"explanation":"Trình tự đoạn văn: Nguyên nhân suy giảm (b) → Hậu quả suy giảm đa dạng sinh học (c) → Biện pháp hành lang bảo tồn (a) → Kết quả phục hồi tích cực (d)."},{"id":"ENG_12_D3_MCQ_5","subject":"Tiếng Anh","grade":"12","topic":"Đề 3 (Cấu trúc 3 Đề Mẫu): Wildlife Conservation, Media & Urbanization","type":"mcq","question":"[Read the following passage and choose the correct option that best fits the blank]\nMarine plastic pollution poses a severe threat to ocean ecosystems worldwide. Millions of tons of plastic waste enter the sea each year, breaking down into tiny microplastics _______. Sea turtles, seabirds, and whales often mistake plastic bags for food, leading to internal injuries and starvation.","options":["that are easily ingested by fish and other marine organisms","where are easily ingested by fish and other marine organisms","who easily ingest fish and other marine organisms","ingesting easily by fish and other marine organisms"],"correct":0,"explanation":"Mệnh đề quan hệ xác định bổ nghĩa cho danh từ chỉ vật \"tiny microplastics\" đóng vai trò chủ ngữ → \"that are easily ingested...\"."},{"id":"ENG_12_D3_MCQ_6","subject":"Tiếng Anh","grade":"12","topic":"Đề 3 (Cấu trúc 3 Đề Mẫu): Wildlife Conservation, Media & Urbanization","type":"mcq","question":"[Read the following passage about Eco-tourism and choose the best answer]\nEco-tourism has emerged as a responsible alternative to mass tourism, focusing on visiting fragile, pristine natural areas while minimizing environmental impact. Unlike conventional resorts that often consume excessive water and energy, true eco-lodges rely on solar power, rainwater harvesting, and locally sourced organic food. Furthermore, eco-tourism empowers indigenous communities by creating sustainable jobs as nature guides and conservationists, ensuring that local residents directly benefit from protecting their surrounding forests and coral reefs.\nQuestion: What is one key difference between eco-lodges and conventional resorts mentioned in the passage?","options":["Eco-lodges prohibit local residents from working as nature guides.","Eco-lodges utilize renewable energy and local resources rather than consuming excessive energy and water.","Conventional resorts always rely 100% on rainwater harvesting and solar power.","Eco-lodges are built exclusively inside crowded metropolitan centers."],"correct":1,"explanation":"Thông tin ở câu 2: \"Unlike conventional resorts that often consume excessive water and energy, true eco-lodges rely on solar power, rainwater harvesting, and locally sourced organic food.\""}]</script>

          } else {

        };

              method: "POST", headers: { "Content-Type": "application/json" },

                    e("select", { value: it.correct ? "true" : "false", onChange: function(ev) { const next = editingQ.items.slice(); next[ii] = Object.assign({}, it, { correct: ev.target.value === "true" }); setEditingQ(Object.assign({}, editingQ, { items: next })); }, className: "p-2 border rounded-lg text-xs font-bold" },
                      e("option", { value: "true" }, "Đúng"),
