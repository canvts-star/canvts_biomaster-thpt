<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, Component } = React;

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error?.message || 'Lỗi hiển thị giao diện.' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 max-w-lg mx-auto my-10 bg-rose-50 border border-rose-300 rounded-2xl text-center space-y-3">
              <h2 className="text-lg font-bold text-rose-800">Đã xảy ra sự cố hiển thị</h2>
              <p className="text-xs text-rose-600 font-mono">{this.state.errorMessage}</p>
              <button
                onClick={() => this.setState({ hasError: false, errorMessage: '' })}
                className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold"
              >
                Khôi Phục Ứng Dụng
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    function cleanVietnameseUnicode(str) {
      if (!str) return '';
      return String(str)
        .normalize('NFC')
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFD]/g, '')
        .replace(/\u00A0/g, ' ')
        .replace(/[ \t]+/g, ' ');
    }

    function isRedOrHighlightHex(hexStr) {
      if (!hexStr) return false;
      const clean = String(hexStr).replace(/[^0-9A-Fa-f]/g, '').toUpperCase();
      if (clean.length !== 6) return false;
      if (['000000', 'FFFFFF', 'AUTO', '111111', '222222', '333333', '444444'].includes(clean)) return false;
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      if (r >= 130 && r > g + 45 && r > b + 45) return true;
      if (b >= 140 && b > r + 50 && b > g + 30) return true;
      return false;
    }

    async function extractTextFromPdfFile(file, onProgress) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        if (!window.pdfjsLib) return { text: '', pageImages: {} };
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';
        const pageImages = {};

        for (let p = 1; p <= pdf.numPages; p++) {
          const page = await pdf.getPage(p);
          const content = await page.getTextContent();
          const ops = await page.getOperatorList();

          let hasGraphicsOrTable = false;
          const redOrUnderlineYCoords = [];

          if (ops && Array.isArray(ops.fnArray) && window.pdfjsLib.OPS) {
            const OPS = window.pdfjsLib.OPS;
            const imgOps = [OPS.paintImageXObject, OPS.paintInlineImageXObject, OPS.paintJpegXObject, OPS.paintImageMaskXObject];
            let curIsRed = false;
            let curY = 0;

            for (let k = 0; k < ops.fnArray.length; k++) {
              const fn = ops.fnArray[k];
              const args = ops.argsArray[k] || [];
              if (imgOps.includes(fn)) hasGraphicsOrTable = true;

              if (fn === OPS.setFillRGBColor || fn === OPS.setStrokeRGBColor) {
                const [r, g, b] = args;
                const r255 = r <= 1 ? Math.round(r * 255) : r;
                const g255 = g <= 1 ? Math.round(g * 255) : g;
                const b255 = b <= 1 ? Math.round(b * 255) : b;
                curIsRed = (r255 >= 130 && r255 > g255 + 45 && r255 > b255 + 45);
              } else if (fn === OPS.setTextMatrix && args.length >= 6) {
                curY = args[5];
              } else if ((fn === OPS.showText || fn === OPS.showSpacedText) && curIsRed) {
                redOrUnderlineYCoords.push(curY);
              }
            }
          }

          const sortedItems = [...content.items].sort((a, b) => {
            const yDiff = Math.abs(b.transform[5] - a.transform[5]);
            if (yDiff > 5) return b.transform[5] - a.transform[5];
            return a.transform[4] - b.transform[4];
          });

          const lines = [];
          let currentLine = [];
          let lastY = null;
          sortedItems.forEach(item => {
            const y = item.transform[5];
            if (lastY !== null && Math.abs(y - lastY) > 6) {
              lines.push(currentLine.join(' '));
              currentLine = [];
            }
            const isMarkedY = redOrUnderlineYCoords.some(ry => Math.abs(ry - y) < 6);
            const strVal = isMarkedY && /^[A-D][\.\:\)]/.test(item.str.trim()) ? `[[ANS_MARK]]${item.str}` : item.str;
            currentLine.push(strVal);
            lastY = y;
          });
          if (currentLine.length > 0) lines.push(currentLine.join(' '));

          let pageText = cleanVietnameseUnicode(lines.join('\n')).trim();
          if (hasGraphicsOrTable || pageText.length < 200) {
            if (onProgress) onProgress(`Đang trích xuất dữ liệu Trang ${p}/${pdf.numPages}...`);
            const viewport = page.getViewport({ scale: 1.8 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
            if (hasGraphicsOrTable) pageImages[p] = canvas.toDataURL('image/png');
          }
          fullText += `\n[[PAGE_${p}]]\n` + pageText;
        }
        return { text: fullText.trim(), pageImages };
      } catch (err) {
        console.error('Lỗi đọc PDF:', err);
        return { text: '', pageImages: {} };
      }
    }

    async function extractTextFromDocxFile(file) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        let xmlExtractedText = '';
        const answerHints = {};
        if (window.JSZip) {
          try {
            const zip = await window.JSZip.loadAsync(arrayBuffer);
            const docXmlStr = await zip.file('word/document.xml')?.async('string');
            if (docXmlStr) {
              const xmlDoc = new DOMParser().parseFromString(docXmlStr, 'application/xml');
              const paragraphs = Array.from(xmlDoc.getElementsByTagName('w:p'));
              const pLines = [];
              paragraphs.forEach(p => {
                const runs = Array.from(p.getElementsByTagName('w:r'));
                let lineStr = '';
                runs.forEach(r => {
                  const rPr = r.getElementsByTagName('w:rPr')[0];
                  let isMarked = false;
                  if (rPr) {
                    const cEl = rPr.getElementsByTagName('w:color')[0];
                    const uEl = rPr.getElementsByTagName('w:u')[0];
                    const cVal = cEl?.getAttribute('w:val') || cEl?.getAttribute('val');
                    if ((cVal && isRedOrHighlightHex(cVal)) || uEl) isMarked = true;
                  }
                  const tNodes = Array.from(r.getElementsByTagName('w:t'));
                  const rText = tNodes.map(t => t.textContent || '').join('');
                  if (rText) lineStr += isMarked ? `[[ANS_MARK]]${rText}` : rText;
                });
                if (lineStr.trim()) pLines.push(lineStr);
              });
              xmlExtractedText = cleanVietnameseUnicode(pLines.join('\n'));
            }
          } catch (e) {}
        }
        return { text: xmlExtractedText, richBlocks: {}, answerHints };
      } catch (err) {
        return { text: '', richBlocks: {}, answerHints: {} };
      }
    }

    function extractAnswerKeyFromRawText(rawText, preDetectedMap = {}) {
      const ansMap = { ...preDetectedMap };
      if (!rawText) return ansMap;
      const clean = cleanVietnameseUnicode(rawText).replace(/\[\[ANS_MARK\]\]/g, '');
      const pairRegex = /(?:^|\s|\||\(|\b)(?:Câu|Q)?\s*(\d{1,2})\s*(?:[\.:\-\)\/\s])\s*([A-D])(?=\s|$|\||,|;|\)|\.|\b)/gi;
      let m;
      while ((m = pairRegex.exec(clean)) !== null) {
        const qNum = parseInt(m[1], 10);
        if (qNum >= 1 && qNum <= 60 && !ansMap[qNum]) ansMap[qNum] = m[2].toUpperCase();
      }
      return ansMap;
    }

    function parseAndGenerateSimilarFromText(rawText, grade, topic, options = {}) {
      const { richBlocks = {}, pageImages = {}, answerHints = {}, mode = 'similar' } = options;
      const normalized = cleanVietnameseUnicode(rawText);
      const answerKeyMap = extractAnswerKeyFromRawText(normalized, answerHints);
      const bodyOnly = normalized.split(/\n\s*(?:BẢNG\s+ĐÁP\s+ÁN|ĐÁP\s+ÁN)\b/i)[0];

      const regexSplit = /(?:^|\n)\s*(?:Câu|Question)\s*(\d{1,2})\s*[\.:\)]\s*/gi;
      const matches = [];
      let m;
      while ((m = regexSplit.exec(bodyOnly)) !== null) {
        matches.push({ qNum: parseInt(m[1], 10), start: m.index, contentStart: m.index + m[0].length });
      }

      const results = [];
      for (let idx = 0; idx < matches.length; idx++) {
        const curMatch = matches[idx];
        const nextMatch = matches[idx + 1];
        const rawBlock = bodyOnly.slice(curMatch.contentStart, nextMatch ? nextMatch.start : bodyOnly.length).trim();
        if (!rawBlock) continue;

        const cleanedBlock = rawBlock.replace(/\[\[RICH_BLOCK_(\d+)\]\]/g, '').replace(/\[\[PAGE_\d+\]\]/g, '').trim();

        const findMarkerPos = (letter, searchFrom) => {
          const re = new RegExp(`(?:^|\\n|\\s)(?:\\[\\[ANS_MARK\\]\\]\\s*)*(\\*?)${letter}\\s*(?:\\[\\[ANS_MARK\\]\\]\\s*)*[\\.:\\)]\\s*(?:\\[\\[ANS_MARK\\]\\]\\s*)*`, 'g');
          re.lastIndex = searchFrom;
          const found = re.exec(cleanedBlock);
          return found ? { start: found.index, contentStart: found.index + found[0].length, markerMarked: found[0].includes('[[ANS_MARK]]') || found[1] === '*' } : null;
        };

        const posA = findMarkerPos('A', 0);
        const posB = posA ? findMarkerPos('B', posA.contentStart) : null;
        const posC = posB ? findMarkerPos('C', posB.contentStart) : null;
        const posD = posC ? findMarkerPos('D', posC.contentStart) : null;
        const qNum = curMatch.qNum;

        if (posA && posB && posC && posD) {
          const questionStemRaw = cleanedBlock.slice(0, posA.start).replace(/\[\[ANS_MARK\]\]/g, '').trim();
          const rawOpts = [
            cleanedBlock.slice(posA.contentStart, posB.start),
            cleanedBlock.slice(posB.contentStart, posC.start),
            cleanedBlock.slice(posC.contentStart, posD.start),
            cleanedBlock.slice(posD.contentStart)
          ];

          let markedCorrectIdx = -1;
          const markerFlags = [posA.markerMarked, posB.markerMarked, posC.markerMarked, posD.markerMarked];
          const cleanOpts = rawOpts.map((optStr, oIdx) => {
            if (markerFlags[oIdx] || optStr.includes('[[ANS_MARK]]')) markedCorrectIdx = oIdx;
            return optStr.replace(/\[\[ANS_MARK\]\]/g, '').replace(/\s+/g, ' ').trim();
          });

          let finalQuestionText = questionStemRaw;
          if (mode === 'similar') {
            finalQuestionText = finalQuestionText.replace(/\b(\d+)\b/g, (numStr) => {
              const v = parseInt(numStr, 10);
              if (v >= 12 && v <= 2000 && v !== 2018 && v !== 2025 && v !== 2026) return String(v * 2);
              return numStr;
            });
          }

          let detectedOrigCorrect = markedCorrectIdx >= 0 ? markedCorrectIdx : (answerKeyMap[qNum] ? ['A', 'B', 'C', 'D'].indexOf(answerKeyMap[qNum]) : 0);
          const originalCorrectText = cleanOpts[detectedOrigCorrect];
          let finalOptions = [...cleanOpts];
          let finalCorrect = detectedOrigCorrect;

          if (mode === 'similar') {
            finalOptions = [...cleanOpts].sort(() => Math.random() - 0.5);
            finalCorrect = Math.max(0, finalOptions.indexOf(originalCorrectText));
          }

          results.push({
            id: `${mode === 'exact' ? 'EXACT' : 'SIM'}_${Date.now()}_${idx + 1}`,
            subject: 'Sinh học',
            grade,
            topic,
            type: 'mcq',
            question: finalQuestionText,
            options: finalOptions,
            correct: finalCorrect,
            explanation: `[Đề sinh học] Đáp án đúng: ${String.fromCharCode(65 + finalCorrect)}.`
          });
        }
      }
      return results;
    }

    function downloadExamAsWordDoc(examTitle, examCode, teacherName, timeAllowed, grade, questionsList) {
      const questionsHtml = questionsList.map((q, idx) => {
        const optsHtml = (q.options || []).map((opt, oi) =>
          `<div style="margin-left:20px;margin-top:3px;"><b>${String.fromCharCode(65 + oi)}.</b> ${opt}</div>`
        ).join('');
        return `<div style="margin-bottom:12px;"><div><b>Câu ${idx + 1}:</b> ${q.question}</div>${optsHtml}</div>`;
      }).join('');

      const keyCells = questionsList.map((q, i) => {
        const ans = q.type === 'mcq' ? String.fromCharCode(65 + (q.correct || 0)) : 'Đ/S';
        return `<td style="border:1px solid #000;padding:4px;text-align:center;"><b>${i + 1}</b><br/>${ans}</td>`;
      }).join('');

      const fullHtml = `\uFEFF
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
        <head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>${examTitle}</title></head>
        <body style="font-family:'Times New Roman',serif;font-size:13pt;line-height:1.4;">
          <table style="width:100%;border-bottom:2px solid #000;margin-bottom:16px;">
            <tr>
              <td style="text-align:center;width:45%;"><b>SỞ GIÁO DỤC & ĐÀO TẠO</b><br/><b>${teacherName.toUpperCase()}</b></td>
              <td style="text-align:center;width:55%;"><b>${examTitle.toUpperCase()}</b><br/>Môn: Sinh học - Khối ${grade}<br/>Thời gian: ${timeAllowed} phút | Mã đề: <b>${examCode}</b></td>
            </tr>
          </table>
          ${questionsHtml}
          <h4 style="margin-top:20px;">BẢNG ĐÁP ÁN MÃ ĐỀ ${examCode}</h4>
          <table style="border-collapse:collapse;width:100%;"><tr>${keyCells}</tr></table>
        </body>
        </html>
      `;

      const blob = new Blob([fullHtml], { type: 'application/msword;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `De_Sinh_Hoc_Khoi_${grade}_Ma_${examCode}.doc`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    const BIOLOGY_TOPICS = {
      '10': ['Sinh học tế bào & Thành phần hóa học', 'Chuyển hóa vật chất & Năng lượng', 'Phân bào & Sinh học vi sinh vật'],
      '11': ['Trao đổi chất & Chuyển hóa năng lượng', 'Cảm ứng & Điều hòa hoạt động', 'Sinh trưởng, phát triển & Sinh sản'],
      '12': ['Di truyền phân tử & Cơ chế biến dị', 'Di truyền Nhiễm sắc thể & Quy luật Mendel', 'Di truyền quần thể & Công nghệ Gen', 'Tiến hóa & Học thuyết hiện đại', 'Sinh thái học & Bảo tồn môi trường']
    };

    function buildInitialQuestions() {
      const bank = [];
      Object.entries(BIOLOGY_TOPICS).forEach(([grade, topicsList]) => {
        topicsList.forEach((topic, tIdx) => {
          for (let i = 1; i <= 6; i++) {
            bank.push({
              id: `BIO_${grade}_T${tIdx + 1}_Q${i}`,
              subject: 'Sinh học',
              grade,
              topic,
              type: 'mcq',
              question: `[Sinh học ${grade} - ${topic}] Phát biểu nào sau đây là chính xác khi nghiên cứu về quá trình sinh học này (câu số ${i})?`,
              options: [
                `Đặc điểm đúng chuẩn chương trình Sinh học THPT (GDPT 2018)`,
                `Phát biểu sai lệch về nguyên lý hoạt động của sinh vật`,
                `Quá trình diễn ra tự phát không chịu sự kiểm soát của hệ thống`,
                `Chỉ xuất hiện trong điều kiện nhân tạo phòng thí nghiệm`
              ],
              correct: 0,
              explanation: `Hướng dẫn giải chi tiết cho chuyên đề ${topic} (Sinh học lớp ${grade}).`
            });
          }
        });
      });
      return bank;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('quiz');
      const [questions, setQuestions] = useState(() => buildInitialQuestions());
      const [customExams, setCustomExams] = useState([]);
      const [selectedGrade, setSelectedGrade] = useState('12');
      const [isTeacherAuth, setIsTeacherAuth] = useState(false);
      const [teacherPin] = useState('123456');
      const [submissions, setSubmissions] = useState([]);
      const [toastMsg, setToastMsg] = useState('');

      const showToast = useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      }, []);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          {toastMsg && (
            <div className="fixed bottom-4 right-4 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg border border-emerald-500 text-xs font-bold">
              {toastMsg}
            </div>
          )}

          <header className="bg-emerald-700 text-white shadow sticky top-0 z-40 print:hidden">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 className="text-lg font-bold">BioMaster THPT - Chuyên Môn Sinh Học <span className="text-xs bg-emerald-800 px-2 py-0.5 rounded-full font-mono">v4.3</span></h1>
                <p className="text-[11px] text-emerald-200">Biên soạn: <b>Thầy Trương Trung Can</b></p>
              </div>
              <nav className="flex flex-wrap gap-1.5 text-xs font-bold">
                <button
                  onClick={() => setActiveTab('quiz')}
                  className={`px-3 py-1.5 rounded-lg transition ${activeTab === 'quiz' ? 'bg-white text-emerald-800 shadow' : 'hover:bg-emerald-600 text-white'}`}
                >
                  Luyện Trắc Nghiệm
                </button>
                <button
                  onClick={() => setActiveTab('teacher')}
                  className={`px-3 py-1.5 rounded-lg transition ${activeTab === 'teacher' ? 'bg-white text-emerald-800 shadow' : 'hover:bg-emerald-600 text-white'}`}
                >
                  Góc Giáo Viên (Sửa &amp; Tạo Đề)
                </button>
                <button
                  onClick={() => setActiveTab('exporter')}
                  className={`px-3 py-1.5 rounded-lg transition ${activeTab === 'exporter' ? 'bg-white text-emerald-800 shadow' : 'hover:bg-emerald-600 text-white'}`}
                >
                  Xuất Đề Word / PDF
                </button>
                <button
                  onClick={() => setActiveTab('bioTools')}
                  className={`px-3 py-1.5 rounded-lg transition ${activeTab === 'bioTools' ? 'bg-white text-emerald-800 shadow' : 'hover:bg-emerald-600 text-white'}`}
                >
                  🧬 Tiện Ích Sinh Học 12
                </button>
              </nav>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 print:p-0 print:max-w-none">
            {activeTab === 'quiz' && (
              <QuizView
                questions={questions}
                customExams={customExams}
                selectedGrade={selectedGrade}
                setSelectedGrade={setSelectedGrade}
                onSaveSubmission={(sub) => setSubmissions(prev => [sub, ...prev])}
              />
            )}
            {activeTab === 'teacher' && (
              <TeacherView
                questions={questions}
                setQuestions={setQuestions}
                customExams={customExams}
                setCustomExams={setCustomExams}
                isAuth={isTeacherAuth}
                setIsAuth={setIsTeacherAuth}
                teacherPin={teacherPin}
                submissions={submissions}
                setSubmissions={setSubmissions}
                showToast={showToast}
              />
            )}
            {activeTab === 'exporter' && (
              <ExporterView
                questions={questions}
                customExams={customExams}
                selectedGrade={selectedGrade}
                setSelectedGrade={setSelectedGrade}
              />
            )}
            {activeTab === 'bioTools' && <BioToolsView />}
          </main>

          <footer className="bg-slate-800 text-slate-400 py-3 text-center text-xs print:hidden">
            © 2026 BioMaster THPT (Chuyên Sinh Học) - <b>Thầy Trương Trung Can</b>
          </footer>
        </div>
      );
    }

    function QuizView({ questions, customExams, selectedGrade, setSelectedGrade, onSaveSubmission }) {
      const [selectedTopic, setSelectedTopic] = useState('Tất cả');
      const [selectedCustomExamId, setSelectedCustomExamId] = useState('');
      const [studentName, setStudentName] = useState('');
      const [studentClass, setStudentClass] = useState('');
      const [started, setStarted] = useState(false);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [activeList, setActiveList] = useState([]);

      const topics = useMemo(() => ['Tất cả', ...(BIOLOGY_TOPICS[selectedGrade] || [])], [selectedGrade]);
      const matchingCustomExams = useMemo(() => (customExams || []).filter(ex => ex.grade === selectedGrade), [customExams, selectedGrade]);

      const filtered = useMemo(() => {
        if (selectedCustomExamId) {
          const found = (customExams || []).find(ex => String(ex.id) === String(selectedCustomExamId));
          return found ? found.questions : [];
        }
        return questions.filter(q => q.subject === 'Sinh học' && q.grade === selectedGrade && (selectedTopic === 'Tất cả' || q.topic === selectedTopic));
      }, [questions, customExams, selectedCustomExamId, selectedGrade, selectedTopic]);

      const score = useMemo(() => activeList.reduce((acc, q, i) => (q.type === 'mcq' && answers[i] === q.correct ? acc + 1 : acc), 0), [activeList, answers]);

      if (!started) {
        return (
          <div className="max-w-2xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">

            <div className="grid grid-cols-3 gap-2">

                <button key={g} onClick={() => { setSelectedGrade(g); setSelectedTopic('Tất cả'); setSelectedCustomExamId(''); }} className={`p-2.5 rounded-xl text-xs font-bold ${selectedGrade === g ? 'bg-emerald-600 text-white' : 'bg-slate-100'}`}>Khối {g}</button>
              ))}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <input type="text" placeholder="Họ và tên học sinh..." value={studentName} onChange={e => setStudentName(e.target.value)} className="p-2.5 border rounded-xl text-xs" />
              <input type="text" placeholder="Lớp (VD: 12A1)..." value={studentClass} onChange={e => setStudentClass(e.target.value)} className="p-2.5 border rounded-xl text-xs" />
            </div>

            {matchingCustomExams.length > 0 && (
              <div className="p-3 bg-indigo-50/70 border border-indigo-200 rounded-xl space-y-1.5">
                <label className="block text-[11px] font-bold text-indigo-800 uppercase">📁 Chọn Đề Riêng Của Thầy Can:</label>
                <select
                  value={selectedCustomExamId}
                  onChange={e => setSelectedCustomExamId(e.target.value)}
                  className="w-full p-2 border border-indigo-300 rounded-lg text-xs bg-white font-semibold text-indigo-900"
                >
                  <option value="">-- Luyện theo chuyên đề ngân hàng --</option>
                  {matchingCustomExams.map(ex => (
                    <option key={ex.id} value={ex.id}>[Mã {ex.examCode}] {ex.title} ({ex.questions.length} câu)</option>
                  ))}
                </select>
              </div>
            )}

            {!selectedCustomExamId && (
              <select value={selectedTopic} onChange={e => setSelectedTopic(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-white">
                {topics.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            )}

            <button
              onClick={() => {
                if (!studentName.trim() || filtered.length === 0) return;
                setActiveList(filtered);
                setAnswers({});
                setSubmitted(false);
                setCurrentIdx(0);
                setStarted(true);
              }}
              disabled={!studentName.trim() || filtered.length === 0}
              className="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold text-sm disabled:opacity-50"
            >
              Bắt Đầu Làm Bài ({filtered.length} câu)
            </button>
          </div>
        );
      }

      const cur = activeList[currentIdx];
      return (
        <div className="max-w-3xl mx-auto space-y-4">
          <div className="bg-white p-3.5 rounded-xl border flex justify-between items-center text-xs font-bold">
            <button onClick={() => setStarted(false)} className="text-slate-500">← Thoát</button>
            <span>{studentName} | Câu {currentIdx + 1}/{activeList.length}</span>
            {!submitted && (
              <button
                onClick={() => {
                  setSubmitted(true);
                  onSaveSubmission({
                    id: Date.now(),
                    name: studentName.trim(),
                    className: studentClass.trim() || `Khối ${selectedGrade}`,
                    subject: 'Sinh học',
                    topic: selectedCustomExamId ? 'Đề riêng giáo viên' : selectedTopic,
                    score,
                    total: activeList.length,
                    submittedAt: new Date().toLocaleString('vi-VN')
                  });
                }}
                className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg"
              >
                Nộp Bài
              </button>
            )}
          </div>

          {submitted && (
            <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center">
              <p className="text-lg font-extrabold text-emerald-800">Kết quả: {score} / {activeList.length} câu đúng</p>
            </div>
          )}

          {cur && (
            <div className="bg-white p-6 rounded-2xl border space-y-4">
              <h3 className="font-bold text-sm leading-relaxed">Câu {currentIdx + 1}: {cur.question}</h3>
              <div className="space-y-2">
                {(cur.options || []).map((opt, oi) => {
                  const picked = answers[currentIdx] === oi;
                  const right = cur.correct === oi;
                  let cls = 'border-slate-200';
                  if (submitted) {
                    if (right) cls = 'border-emerald-500 bg-emerald-50 font-bold text-emerald-900';
                    else if (picked) cls = 'border-rose-500 bg-rose-50 text-rose-900';
                  } else if (picked) {
                    cls = 'border-emerald-600 bg-emerald-50 font-semibold';
                  }
                  return (
                    <button key={oi} onClick={() => !submitted && setAnswers(p => ({ ...p, [currentIdx]: oi }))} className={`w-full p-3 border rounded-xl text-left text-xs ${cls} block`}>
                      <b>{String.fromCharCode(65 + oi)}.</b> {opt}
                    </button>
                  );
                })}
              </div>
              {submitted && cur.explanation && (
                <div className="p-3 bg-slate-50 border rounded-xl text-xs text-slate-700">{cur.explanation}</div>
              )}
              <div className="flex justify-between pt-2 border-t">
                <button disabled={currentIdx === 0} onClick={() => setCurrentIdx(i => i - 1)} className="px-3 py-1.5 border rounded-lg text-xs disabled:opacity-40">← Trước</button>
                <button disabled={currentIdx === activeList.length - 1} onClick={() => setCurrentIdx(i => i + 1)} className="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs disabled:opacity-40">Tiếp →</button>
              </div>
            </div>
          )}
        </div>
      );
    }

        if (file.name.toLowerCase().endsWith('.pdf')) {
          extracted = await extractTextFromPdfFile(file, setUploadStatus);
        } else if (file.name.toLowerCase().endsWith('.docx')) {
          extracted = await extractTextFromDocxFile(file);
        } else {
          extracted.text = cleanVietnameseUnicode(await file.text());
        }
        const generated = parseAndGenerateSimilarFromText(extracted.text, grade, topicName.trim() || file.name, {
          richBlocks: extracted.richBlocks,
          pageImages: extracted.pageImages,
          answerHints: extracted.answerHints,
          mode
        });
        setParsedList(generated);
        setPreviewMode(true);
        setUploadStatus(generated.length > 0 ? `Đã xử lý thành công ${generated.length} câu hỏi!` : 'Không tìm thấy cấu trúc câu hỏi.');

                          <div className="space-y-1 pl-3">
                            {(q.options || []).map((opt, oIdx) => (

                        <th className="p-2.5">Chủ Đề</th>

                    <tbody className="divide-y">

                          <td className="p-2.5">{s.className}</td>
                          <td className="p-2.5">{s.topic}</td>
                          <td className="p-2.5 font-bold text-emerald-700">{s.score}/{s.total}</td>
                          <td className="p-2.5 text-slate-400">{s.submittedAt}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </div>
      );

    function ExporterView({ questions, customExams, selectedGrade, setSelectedGrade }) {

      const exportList = useMemo(() => {
        if (activeCustomExam) return activeCustomExam.questions;
        return questions.filter(q => q.subject === 'Sinh học' && q.grade === selectedGrade);
      }, [questions, activeCustomExam, selectedGrade]);

      return (

            <select value={selectedGrade} onChange={e => { setSelectedGrade(e.target.value); setSelectedCustomExamId(''); }} className="p-2 border rounded-lg text-xs bg-white font-bold">

              <option value="11">Khối 11</option>
              <option value="10">Khối 10</option>

                  setSelectedCustomExamId(e.target.value);

              >
                <option value="">Nguồn: Ngân hàng mặc định</option>
                {matchingCustomExams.map(ex => (
                  <option key={ex.id} value={ex.id}>📁 Đề riêng: {ex.title} (Mã {ex.examCode})</option>
                ))}
              </select>
            )}
            <input type="text" value={examCode} onChange={e => setExamCode(e.target.value)} className="w-20 p-2 border rounded-lg text-xs font-mono" placeholder="Mã đề" />
            <div className="ml-auto flex gap-2">
              <button
                onClick={() => downloadExamAsWordDoc(activeCustomExam ? activeCustomExam.title : `ĐỀ THI MÔN SINH HỌC KHỐI ${selectedGrade}`, examCode, 'Thầy Trương Trung Can', '50', selectedGrade, exportList)}
                className="px-3 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold"
              >
                📥 Tải File Word (.DOC)
              </button>
              <button onClick={() => window.print()} className="px-3 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold">
                🖨️ In / Lưu PDF
              </button>
            </div>
          </div>

          <div className="bg-white p-8 rounded-xl border font-serif text-sm space-y-5 print:border-none print:p-0">
            <div className="text-center border-b-2 border-slate-900 pb-3">
              <h2 className="font-bold text-base uppercase">{activeCustomExam ? activeCustomExam.title : `ĐỀ KIỂM TRA MÔN SINH HỌC - KHỐI ${selectedGrade}`}</h2>
              <p className="text-xs italic">Giáo viên: Thầy Trương Trung Can | Mã đề: {examCode}</p>
            </div>
            {exportList.map((q, idx) => (
              <div key={idx} className="space-y-1.5">
                <p className="font-bold">Câu {idx + 1}: <span className="font-normal">{q.question}</span></p>
                <div className="space-y-1 pl-4">
                  {(q.options || []).map((o, oi) => (
                    <div key={oi} className="block"><b>{String.fromCharCode(65 + oi)}.</b> {o}</div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function BioToolsView() {
      const [activeToolTab, setActiveToolTab] = useState('terms');

      const termsList = [
        { term: 'Gen', desc: 'Một đoạn DNA mang thông tin mã hóa cho một chuỗi polypeptide hoặc RNA.' },
        { term: 'Mã di truyền', desc: 'Bộ ba nucleotide trên mRNA quy định axit amin tương ứng (có 64 bộ ba).' },
        { term: 'Phiên mã', desc: 'Quá trình tổng hợp RNA dựa trên mạch khuôn DNA dưới sự xúc tác của RNA polymerase.' },
        { term: 'Dịch mã', desc: 'Quá trình tổng hợp chuỗi polypeptide tại ribosome dựa trên khuôn mẫu mRNA.' },
        { term: 'Đột biến gen', desc: 'Những biến đổi nhỏ trong cấu trúc của gene liên quan đến một hoặc một số cặp nucleotide.' },
        { term: 'Operon Lac', desc: 'Cụm gồm các gene điều hòa, vận hành, khởi động và các gene cấu trúc (Z, Y, A) ở vi khuẩn E. coli.' },
        { term: 'Thể dị bội', desc: 'Cơ thể mà tế bào sinh dưỡng có số lượng NST thay đổi ở một hay một số cặp NST (2n+1, 2n-1).' },
        { term: 'Quần thể giao phấn ngẫu nhiên', desc: 'Quần thể trong đó các cá thể tự do giao phối với nhau không phụ thuộc vào kiểu gen.' }
      ];

      const formulasList = [
        { name: '1. Số lượng Nu & Chiều dài DNA', formula: 'L = (N / 2) × 3.4 Å\nN = (L / 3.4) × 2\nM = N × 300 đvc' },
        { name: '2. Nguyên tắc bổ sung (NTBS DNA)', formula: 'A = T, G = X\n%A = %T, %G = %X\n%A + %G = 50%' },
        { name: '3. Số liên kết Hydro (H)', formula: 'H = 2A + 3G' },
        { name: '4. Số liên kết Hóa trị Phosphodiester', formula: 'HT = N - 2 (trên 2 mạch)' },
        { name: '5. Số phân tử mRNA & Axit Amin', formula: 'Số phân tử mRNA = k × số lần phiên mã\nSố amino acid tham gia dịch mã = (N/6) - 1' }
      ];

      const mendelCrosses = [
        { title: '1. P: AA x aa (Trội hoàn toàn)', f1: '100% Aa (100% Trội)', f2: '3 Trội : 1 Lặn (1 AA : 2 Aa : 1 aa)' },
        { title: '2. P: Aa x Aa (Phân ly)', f1: '1 AA : 2 Aa : 1 aa', f2: '3 Trội : 1 Lặn' },
        { title: '3. P: Aa x aa (Lai phân tích)', f1: '1 Aa : 1 aa', f2: '1 Trội : 1 Lặn' },
        { title: '4. P: AA x AA hoặc aa x aa', f1: '100% đồng tính', f2: '100% đồng tính' },
        { title: '5. P: Aa x AA', f1: '100% Trội (1 AA : 1 Aa)', f2: '100% Trội' },
        { title: '6. P: Trội không hoàn toàn (Aa x Aa)', f1: '1 Trội : 2 Trung gian : 1 Lặn', f2: '1:2:1 (Kiểu hình trùng kiểu gen)' }
      ];

      return (
        <div className="space-y-4">
          <div className="flex border-b gap-3 pb-2 text-xs font-bold">
            <button onClick={() => setActiveToolTab('terms')} className={`px-4 py-2 rounded-lg ${activeToolTab === 'terms' ? 'bg-emerald-600 text-white' : 'bg-white border'}`}>📖 Thuật Ngữ Sinh Học 12</button>
            <button onClick={() => setActiveToolTab('formulas')} className={`px-4 py-2 rounded-lg ${activeToolTab === 'formulas' ? 'bg-emerald-600 text-white' : 'bg-white border'}`}>📐 Công Thức Sinh Học Phân Tử</button>
            <button onClick={() => setActiveToolTab('crosses')} className={`px-4 py-2 rounded-lg ${activeToolTab === 'crosses' ? 'bg-emerald-600 text-white' : 'bg-white border'}`}>🧬 6 Phép Lai Cơ Bản Mendel</button>
          </div>

          {activeToolTab === 'terms' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {termsList.map((t, idx) => (
                <div key={idx} className="p-4 bg-white border rounded-xl space-y-1">
                  <h4 className="font-bold text-emerald-800 text-sm">{idx + 1}. {t.term}</h4>
                  <p className="text-xs text-slate-600 leading-relaxed">{t.desc}</p>
                </div>
              ))}
            </div>
          )}

          {activeToolTab === 'formulas' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {formulasList.map((f, idx) => (
                <div key={idx} className="p-4 bg-white border rounded-xl space-y-2">
                  <h4 className="font-bold text-slate-800 text-sm">{f.name}</h4>
                  <pre className="p-2.5 bg-slate-50 border rounded-lg text-xs font-mono text-emerald-900 whitespace-pre-wrap">{f.formula}</pre>
                </div>
              ))}
            </div>
          )}

          {activeToolTab === 'crosses' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {mendelCrosses.map((c, idx) => (
                <div key={idx} className="p-4 bg-white border rounded-xl space-y-1.5 text-xs">
                  <h4 className="font-bold text-emerald-900 text-sm">{c.title}</h4>
                  <p><b>F1:</b> {c.f1}</p>
                  <p><b>Tỷ lệ F2:</b> {c.f2}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
