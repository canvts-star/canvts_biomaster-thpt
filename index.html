    // =========================================================================
    // 1. ERROR BOUNDARY CHỐNG SẬP TRANG WEB
    // =========================================================================
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errText: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errText: error?.message || 'Lỗi hiển thị' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
              <div className="max-w-md w-full bg-white p-6 rounded-2xl shadow-xl border border-rose-200 text-center space-y-4">

                <h2 className="text-lg font-bold text-slate-800">Khôi Phục Phiên Làm Việc</h2>

                <button
                  onClick={() => {
                    try { localStorage.clear(); } catch (e) {}
                    window.location.reload();
                  }}
                  className="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs shadow hover:bg-emerald-700"

                  Làm Mới Ứng Dụng Ngay

          );
        }

      }

    // =========================================================================
    // 2. TRÌNH ĐỌC FILE PDF & WORD (.DOCX) TRỰC TIẾP (KHÔNG CẦN API KEY)
    // =========================================================================
    async function extractTextFromPdfFile(file) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        if (!window.pdfjsLib) return '';
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';
        for (let p = 1; p <= pdf.numPages; p++) {
          const page = await pdf.getPage(p);
          const content = await page.getTextContent();
          const strings = content.items.map(item => item.str);
          fullText += `\n--- Trang ${p} ---\n` + strings.join(' ');
        }
        return fullText.trim();
      } catch (err) {
        console.error('Lỗi đọc PDF:', err);
        return '';
      }
    }

    async function extractTextFromDocxFile(file) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        if (!window.mammoth) return '';
        const result = await window.mammoth.extractRawText({ arrayBuffer });
        return (result.value || '').trim();
      } catch (err) {
        console.error('Lỗi đọc DOCX:', err);
        return '';
      }
    }

    // Phân tích đề từ văn bản trích xuất (PDF / DOCX / TXT) và tạo đề tương tự tự động (Không cần API Key)
    function parseAndGenerateSimilarFromText(rawText, subject, grade, topic, generateSimilarMode = true) {
      const isEnglish = subject === 'Tiếng Anh';
      const cleaned = rawText.replace(/\r\n/g, '\n');
      // Tách theo "Question 1." hoặc "Câu 1:" hoặc "Câu 1."
      const blocks = cleaned.split(/(?:Question|Câu)\s+\d+[\.:]/i).filter(b => b.trim().length > 8);
      const results = [];

      blocks.forEach((block, idx) => {
        const qNum = idx + 1;
        // Cố gắng tách 4 phương án A. B. C. D.
        const optMatch = block.match(/([\s\S]*?)\bA[\.:]\s*([\s\S]*?)\bB[\.:]\s*([\s\S]*?)\bC[\.:]\s*([\s\S]*?)\bD[\.:]\s*([\s\S]*)/i);
        let qBody = block.trim();
        let options = [
          `Phương án A (Câu ${qNum})`,
          `Phương án B (Câu ${qNum})`,
          `Phương án C (Câu ${qNum})`,
          `Phương án D (Câu ${qNum})`
        ];

        if (optMatch) {
          qBody = optMatch[1].trim().slice(0, 650);
          options = [
            optMatch[2].trim().split('\n')[0].slice(0, 180) || options[0],
            optMatch[3].trim().split('\n')[0].slice(0, 180) || options[1],
            optMatch[4].trim().split('\n')[0].slice(0, 180) || options[2],
            optMatch[5].trim().split('\n')[0].slice(0, 180) || options[3]
          ];
        } else {
          qBody = qBody.slice(0, 650);
        }

        // Nếu bật chế độ sinh đề tương tự: biến đổi số liệu (với môn KHTN) và xáo trộn vị trí đáp án
        let finalQuestion = qBody;
        let correctIdx = 0;

        if (generateSimilarMode) {
          const factor = (idx % 3) + 2;
          if (!isEnglish) {
            finalQuestion = finalQuestion.replace(/\b(\d+)\b/g, (m) => {
              const num = parseInt(m, 10);
              if (num >= 10 && num <= 5000 && num !== 2018 && num !== 2025 && num !== 2026) {
                return String(num * factor);
              }
              return m;
            });
          }
          const prefix = isEnglish ? `[Similar Practice #${qNum}] ` : `[Đề tương tự #${qNum}] `;
          finalQuestion = prefix + finalQuestion;

          const rightAnswerText = options[0];
          const shuffled = [...options].sort(() => Math.random() - 0.5);
          correctIdx = shuffled.indexOf(rightAnswerText);
          options = shuffled;
        }

        results.push({
          id: `UPLOAD_${Date.now()}_${qNum}_${Math.floor(Math.random() * 9999)}`,
          subject,
          grade,
          topic,
          type: 'mcq', // Tiếng Anh & đề upload chuẩn hóa MCQ 4 lựa chọn
          question: finalQuestion,
          options,
          correct: correctIdx >= 0 ? correctIdx : 0,
          explanation: generateSimilarMode
            ? `Câu hỏi tương tự được tạo tự động từ cấu trúc đề gốc (Câu ${qNum}).`
            : `Trích xuất từ đề thi gốc (Câu ${qNum}).`,
          isCloned: generateSimilarMode
        });
      });

      return results;
    }

    // Sinh biến thể tương tự từ 1 bộ đề có sẵn trong ngân hàng (Không cần API Key)
    function cloneExistingTopicQuestions(sourceQuestions, targetTopicName, variantNumber) {
      return sourceQuestions.map((q, idx) => {
        const isEnglish = q.subject === 'Tiếng Anh';
        const effectiveType = isEnglish ? 'mcq' : (q.type || 'mcq');
        let newText = q.question || '';

        if (!isEnglish) {
          const mult = (variantNumber % 3) + 2;
          newText = newText.replace(/\b(\d+)\b/g, (m) => {
            const v = parseInt(m, 10);
            if (v >= 10 && v <= 4000 && v !== 2018 && v !== 2025 && v !== 2026) return String(v * mult);
            return m;
          });
        }

        const tag = isEnglish ? `[Variant #${variantNumber}] ` : `[Biến thể #${variantNumber}] `;
        const cleanBase = newText.replace(/^\[(Variant|Biến thể|Similar Practice|Đề tương tự)[^\]]*\]\s*/i, '');

        if (effectiveType === 'mcq') {
          const opts = Array.isArray(q.options) && q.options.length === 4
            ? [...q.options]
            : ['Option A', 'Option B', 'Option C', 'Option D'];
          const rightText = opts[q.correct] ?? opts[0];
          const shuffled = [...opts].sort(() => Math.random() - 0.5);
          return {
            ...q,
            id: `SIM_${Date.now()}_${variantNumber}_${idx + 1}`,
            topic: targetTopicName || q.topic,
            type: 'mcq',
            question: tag + cleanBase,
            options: shuffled,
            correct: Math.max(0, shuffled.indexOf(rightText)),
            items: undefined,
            correctAnswer: undefined,
            explanation: `[Đề tương tự #${variantNumber}] ${q.explanation || ''}`,
            isCloned: true
          };
        }

        return {
          ...q,
          id: `SIM_${Date.now()}_${variantNumber}_${idx + 1}`,
          topic: targetTopicName || q.topic,
          type: effectiveType,
          question: tag + cleanBase,
          explanation: `[Đề tương tự #${variantNumber}] ${q.explanation || ''}`,
          isCloned: true
        };
      });
    }

    function buildCompleteQuestionBank() {
      const bank = [...ENGLISH_EXAMS_SEED];

      // Tạo thêm các câu hỏi mở rộng cho Đề 1, 2, 3, 4, 5 môn Tiếng Anh (100% MCQ)
      const engTopics12 = SUBJECT_GRADE_TOPICS['Tiếng Anh']['12'];
      engTopics12.forEach((topic, tIdx) => {
        const existingCount = bank.filter(q => q.topic === topic).length;
        for (let i = existingCount + 1; i <= 12; i++) {
          bank.push({
            id: `EN12_D${tIdx + 1}_EXT_${i}`,
            subject: 'Tiếng Anh',
            grade: '12',
            topic,
            type: 'mcq',
            question: `[${topic.split(':')[0]} - Question ${i}] Choose the best option (A, B, C, or D) that fits the context of sustainable development, digital transformation, and modern communication.`,
            options: [
              `Option A: Grammatically accurate and contextually appropriate structure #${i}`,
              `Option B: Incorrect tense or passive/active participle form`,
              `Option C: Mismatched collocation or phrasal verb usage`,
              `Option D: Inappropriate linking word or relative pronoun`
            ],
            correct: 0,
            explanation: `Đáp án A chuẩn xác theo cấu trúc đề thi Tốt nghiệp THPT môn Tiếng Anh (100% trắc nghiệm MCQ).`
          });
        }
      });

      // Tiếng Anh lớp 10 & 11 (100% MCQ)
      ['10', '11'].forEach(gr => {
        SUBJECT_GRADE_TOPICS['Tiếng Anh'][gr].forEach((topic, tIdx) => {
          for (let i = 1; i <= 10; i++) {
            bank.push({
              id: `EN${gr}_D${tIdx + 1}_Q${i}`,
              subject: 'Tiếng Anh',
              grade: gr,
              topic,
              type: 'mcq',
              question: `[English ${gr} - ${topic}] Question ${i}: Select the best answer (A, B, C, or D) to complete the sentence/passage according to the 2025+ exam format.`,
              options: [
                `Option A: Correct grammatical and lexical choice for Grade ${gr}`,
                `Option B: Distractor with incorrect verb agreement`,
                `Option C: Distractor with wrong preposition`,
                `Option D: Distractor with incorrect word form`
              ],
              correct: 0,
              explanation: `Giải thích chi tiết câu ${i} Tiếng Anh lớp ${gr} (Định dạng MCQ 4 lựa chọn).`
            });
          }
        });
      });

      // Sinh học & Công nghệ Nông nghiệp (Khối 10, 11, 12 - Đủ 3 dạng MCQ, Đúng/Sai, Trả lời ngắn)
      ['Sinh học', 'Công nghệ Nông nghiệp'].forEach(subject => {
        ['10', '11', '12'].forEach(grade => {
          SUBJECT_GRADE_TOPICS[subject][grade].forEach((topic, tIdx) => {
            // 8 câu MCQ
            for (let i = 1; i <= 8; i++) {
              bank.push({
                id: `${subject.slice(0, 2).toUpperCase()}${grade}_T${tIdx + 1}_MCQ_${i}`,
                subject,
                grade,
                topic,
                type: 'mcq',
                question: `[${subject} ${grade} - ${topic}] Câu ${i}: Nội dung nào sau đây phản ánh đúng bản chất khoa học của chuyên đề ${topic} theo chương trình GDPT 2018?`,
                options: [
                  `Đặc điểm chuẩn xác theo SGK Kết nối tri thức (${subject} lớp ${grade})`,
                  `Nhận định sai lệch về cơ chế điều hòa tự nhiên`,
                  `Quá trình diễn ra độc lập hoàn toàn với môi trường`,
                  `Kết quả chỉ đúng khi không có xúc tác sinh học`
                ],
                correct: 0,
                explanation: `Hướng dẫn giải câu ${i}: Dựa trên kiến thức trọng tâm ${subject} lớp ${grade} - Chủ đề ${topic}.`
              });
            }
            // 2 câu Đúng/Sai 4 ý
            for (let i = 1; i <= 2; i++) {
              bank.push({
                id: `${subject.slice(0, 2).toUpperCase()}${grade}_T${tIdx + 1}_TF_${i}`,
                subject,
                grade,
                topic,
                type: 'tf',
                question: `[${subject} ${grade} - ${topic}] Câu Đúng/Sai ${i}: Xét các nhận định thực tiễn sau về ${topic}:`,
                items: [
                  { id: 'a', statement: `a) Quy trình tuân thủ đúng nguyên lý khoa học của ${topic}.`, correct: true },
                  { id: 'b', statement: `b) Yếu tố ngoại cảnh không có bất kỳ tác động nào đến kết quả.`, correct: false },
                  { id: 'c', statement: `c) Ứng dụng công nghệ giúp nâng cao hiệu quả và tính bền vững.`, correct: true },
                  { id: 'd', statement: `d) Không cần kiểm soát các thông số kỹ thuật trong thực tế.`, correct: false }
                ],
                explanation: `Phân tích từng mệnh đề a, b, c, d dựa theo chuẩn kiến thức ${subject} ${grade}.`
              });
            }
            // 2 câu Trả lời ngắn
            for (let i = 1; i <= 2; i++) {
              const ans = String(i * 120);
              bank.push({
                id: `${subject.slice(0, 2).toUpperCase()}${grade}_T${tIdx + 1}_SA_${i}`,
                subject,
                grade,
                topic,
                type: 'sa',
                question: `[${subject} ${grade} - ${topic}] Câu trả lời ngắn ${i}: Cho hệ thống nghiên cứu có chỉ số ban đầu bằng ${i * 60}. Tính giá trị sau 1 chu kỳ nhân đôi (nhập số nguyên)?`,
                correctAnswer: ans,
                explanation: `Áp dụng công thức nhân đôi: ${i * 60} × 2 = ${ans}.`
              });
            }
          });
        });
      });

      return bank;
    }

    function QuizSection({ questions, topicsMap, selectedSubject, setSelectedSubject, selectedGrade, setSelectedGrade, onSaveSubmission }) {
      const [selectedTopic, setSelectedTopic] = useState('Tất cả');
      const [mode, setMode] = useState('practice');
      const [studentName, setStudentName] = useState('');
      const [studentClass, setStudentClass] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const [quizStarted, setQuizStarted] = useState(false);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [activeQuestions, setActiveQuestions] = useState([]);
      const [timeLeft, setTimeLeft] = useState(50 * 60);

      const availableTopics = useMemo(
        () => ['Tất cả', ...(topicsMap[selectedSubject]?.[selectedGrade] || [])],
        [topicsMap, selectedSubject, selectedGrade]
      );

      const filteredQuestions = useMemo(() => {
        return questions.filter(q => {
          if (!q || q.subject !== selectedSubject || q.grade !== selectedGrade) return false;
          // Riêng môn Tiếng Anh chỉ lấy dạng MCQ
          if (selectedSubject === 'Tiếng Anh' && q.type !== 'mcq') return false;
          if (selectedTopic !== 'Tất cả' && q.topic !== selectedTopic) return false;
          return true;
        });
      }, [questions, selectedSubject, selectedGrade, selectedTopic]);

      const calculateScore = useCallback(() => {
        let correct = 0;
        activeQuestions.forEach((q, idx) => {
          const ans = userAnswers[idx];
          if (q.type === 'mcq' && ans === q.correct) correct++;
          else if (q.type === 'tf' && ans && Array.isArray(q.items)) {
            if (q.items.every(it => ans[it.id] === it.correct)) correct++;
          } else if (q.type === 'sa' && ans !== undefined && String(ans).trim() === String(q.correctAnswer).trim()) {
            correct++;
          }
        });
        return correct;
      }, [activeQuestions, userAnswers]);

      const handleSubmit = useCallback(() => {
        setIsSubmitted(true);
        const score = calculateScore();
        const total = activeQuestions.length || 1;
        onSaveSubmission({
          id: Date.now(),
          name: studentName.trim() || 'Học sinh',
          className: studentClass.trim() || `Lớp ${selectedGrade}`,
          subject: selectedSubject,
          grade: selectedGrade,
          topic: selectedTopic,
          mode: mode === 'practice' ? 'Tự luyện' : 'Thi tính giờ (50p)',
          score,
          total: activeQuestions.length,
          score10: ((score / total) * 10).toFixed(2),
          percentage: Math.round((score / total) * 100),
          submittedAt: new Date().toLocaleString('vi-VN')
        });
      }, [calculateScore, activeQuestions.length, onSaveSubmission, studentName, studentClass, selectedGrade, selectedSubject, selectedTopic, mode]);

      useEffect(() => {
        let timer;
        if (quizStarted && mode === 'timed' && !isSubmitted && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                handleSubmit();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [quizStarted, mode, isSubmitted, timeLeft, handleSubmit]);

      if (!quizStarted) {
        return (
          <div className="max-w-3xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <div className="text-center">
              <h2 className="text-2xl font-extrabold text-slate-800">Luyện Thi Trắc Nghiệm THPT (GDPT 2018)</h2>
              <p className="text-xs text-emerald-700 font-semibold mt-1">Chọn Khối, Môn học và Đề thi / Chủ đề để bắt đầu ôn luyện</p>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-emerald-50/70 p-4 rounded-xl border border-emerald-200">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Họ và Tên Học Sinh (*):</label>
                <input
                  type="text"
                  value={studentName}
                  onChange={e => { setStudentName(e.target.value); setErrorMsg(''); }}
                  placeholder="Ví dụ: Nguyễn Văn An..."
                  className="w-full p-2.5 border border-slate-300 rounded-xl text-xs bg-white"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Lớp:</label>
                <input
                  type="text"
                  value={studentClass}
                  onChange={e => setStudentClass(e.target.value)}
                  placeholder="Ví dụ: 12A1..."
                  className="w-full p-2.5 border border-slate-300 rounded-xl text-xs bg-white"
                />
              </div>
              {errorMsg && <p className="sm:col-span-2 text-xs text-rose-600 font-bold">{errorMsg}</p>}
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1.5">1. Chọn Khối Lớp:</label>
              <div className="grid grid-cols-3 gap-2">
                {['10', '11', '12'].map(gr => (
                  <button
                    key={gr}
                    onClick={() => { setSelectedGrade(gr); setSelectedTopic('Tất cả'); }}
                    className={`p-3 rounded-xl font-bold text-xs border transition ${selectedGrade === gr ? 'bg-emerald-600 text-white border-emerald-600 shadow' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}
                  >
                    Khối {gr}
                  </button>
                ))}
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1.5">2. Chọn Môn Học:</label>
              <div className="grid grid-cols-3 gap-2">
                {['Tiếng Anh', 'Sinh học', 'Công nghệ Nông nghiệp'].map(sub => (
                  <button
                    key={sub}
                    onClick={() => { setSelectedSubject(sub); setSelectedTopic('Tất cả'); }}
                    className={`p-3 rounded-xl font-bold text-xs border transition ${selectedSubject === sub ? 'bg-emerald-600 text-white border-emerald-600 shadow' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}
                  >
                    {sub}
                  </button>
                ))}
              </div>
              {selectedSubject === 'Tiếng Anh' && (
                <p className="text-[11px] text-indigo-700 font-semibold mt-1">✓ Môn Tiếng Anh áp dụng chuẩn 100% câu hỏi trắc nghiệm MCQ 4 lựa chọn.</p>
              )}
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1.5">3. Chọn Đề Thi / Chủ Đề Ôn Luyện:</label>
              <select
                value={selectedTopic}
                onChange={e => setSelectedTopic(e.target.value)}
                className="w-full p-3 border border-slate-300 rounded-xl text-xs bg-white font-medium"
              >
                {availableTopics.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <button
                onClick={() => setMode('practice')}
                className={`p-3 rounded-xl border text-left text-xs ${mode === 'practice' ? 'border-emerald-600 bg-emerald-50 font-bold text-emerald-900' : 'border-slate-200'}`}
              >
                ✨ <b>Tự Luyện:</b> Xem đáp án &amp; giải thích ngay từng câu
              </button>
              <button
                onClick={() => setMode('timed')}
                className={`p-3 rounded-xl border text-left text-xs ${mode === 'timed' ? 'border-emerald-600 bg-emerald-50 font-bold text-emerald-900' : 'border-slate-200'}`}
              >
                ⏱️ <b>Thi Tính Giờ (50 phút):</b> Nộp bài mới chấm điểm
              </button>
            </div>

            <button
              onClick={() => {
                if (!studentName.trim()) {
                  setErrorMsg('Vui lòng nhập Họ và Tên học sinh trước khi làm bài!');
                  return;
                }
                setActiveQuestions(filteredQuestions);
                setQuizStarted(true);
                setCurrentIdx(0);
                setUserAnswers({});
                setIsSubmitted(false);
                setTimeLeft(50 * 60);
              }}
              disabled={filteredQuestions.length === 0}
              className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold text-sm shadow-md disabled:opacity-50"
            >
              Bắt Đầu Làm Bài ({filteredQuestions.length} câu)
            </button>
          </div>
        );
      }

      const currentQ = activeQuestions[currentIdx];
      const hasAnswered = userAnswers[currentIdx] !== undefined && userAnswers[currentIdx] !== '';
      const showImmediate = (mode === 'practice' && hasAnswered) || isSubmitted;

      return (
        <div className="max-w-4xl mx-auto space-y-5">
          <div className="bg-white p-4 rounded-xl border border-slate-200 flex flex-wrap justify-between items-center gap-3 text-xs font-bold">
            <button onClick={() => setQuizStarted(false)} className="bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700">← Đổi Đề</button>
            <span>HS: <b className="text-emerald-700">{studentName}</b> | Câu {currentIdx + 1} / {activeQuestions.length}</span>
            {mode === 'timed' && !isSubmitted && (
              <span className="bg-amber-100 text-amber-800 px-3 py-1 rounded-lg font-mono">
                ⏱ {Math.floor(timeLeft / 60).toString().padStart(2, '0')}:{(timeLeft % 60).toString().padStart(2, '0')}
              </span>
            )}
            {!isSubmitted && (
              <button onClick={handleSubmit} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-lg shadow">Nộp Bài &amp; Lưu Điểm</button>
            )}
          </div>

          {isSubmitted && (
            <div className="bg-emerald-50 border border-emerald-300 p-6 rounded-2xl text-center space-y-2">
              <h3 className="text-lg font-extrabold text-emerald-900">ĐÃ NỘP BÀI &amp; GỬI KẾT QUẢ CHO GIÁO VIÊN</h3>
              <p className="text-3xl font-black text-emerald-700">
                {calculateScore()} / {activeQuestions.length} câu ({((calculateScore() / (activeQuestions.length || 1)) * 10).toFixed(2)} điểm)
              </p>
            </div>
          )}

          {currentQ && (
            <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 shadow-sm">
              <div className="flex justify-between items-center text-[11px] text-slate-400">
                <span className="bg-emerald-50 text-emerald-700 font-bold px-2.5 py-1 rounded">{currentQ.topic}</span>
                <span>{currentQ.type === 'mcq' ? 'Trắc nghiệm MCQ' : currentQ.type === 'tf' ? 'Đúng / Sai 4 ý' : 'Trả lời ngắn'}</span>
              </div>

              <h3 className="font-bold text-sm sm:text-base text-slate-800 whitespace-pre-line leading-relaxed">{currentQ.question}</h3>

              {/* DẠNG MCQ */}
              {currentQ.type === 'mcq' && Array.isArray(currentQ.options) && (
                <div className="space-y-2.5">
                  {currentQ.options.map((opt, oIdx) => {
                    const isSelected = userAnswers[currentIdx] === oIdx;
                    const isCorrect = currentQ.correct === oIdx;
                    let cls = 'border-slate-200 hover:border-emerald-400';
                    if (showImmediate) {
                      if (isCorrect) cls = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-bold';
                      else if (isSelected) cls = 'border-rose-500 bg-rose-50 text-rose-900';
                    } else if (isSelected) {
                      cls = 'border-emerald-600 bg-emerald-50 font-semibold';
                    }
                    return (
                      <button
                        key={oIdx}
                        onClick={() => !isSubmitted && setUserAnswers(prev => ({ ...prev, [currentIdx]: oIdx }))}
                        className={`w-full p-3.5 border rounded-xl text-left text-xs sm:text-sm transition flex items-start gap-2.5 ${cls}`}
                      >
                        <span className="font-bold">{String.fromCharCode(65 + oIdx)}.</span>
                        <span className="flex-1">{opt}</span>
                      </button>
                    );
                  })}
                </div>
              )}

              {/* DẠNG ĐÚNG SAI */}
              {currentQ.type === 'tf' && Array.isArray(currentQ.items) && (
                <div className="space-y-2">
                  {currentQ.items.map(it => {
                    const tfState = userAnswers[currentIdx] || {};
                    return (
                      <div key={it.id} className="p-3 bg-slate-50 border rounded-xl flex flex-wrap items-center justify-between gap-2 text-xs">
                        <span className="flex-1 font-medium">{it.statement}</span>
                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={() => !isSubmitted && setUserAnswers(prev => ({ ...prev, [currentIdx]: { ...(prev[currentIdx] || {}), [it.id]: true } }))}
                            className={`px-3 py-1 rounded font-bold border ${tfState[it.id] === true ? 'bg-emerald-600 text-white' : 'bg-white'}`}
                          >Đúng</button>
                          <button
                            onClick={() => !isSubmitted && setUserAnswers(prev => ({ ...prev, [currentIdx]: { ...(prev[currentIdx] || {}), [it.id]: false } }))}
                            className={`px-3 py-1 rounded font-bold border ${tfState[it.id] === false ? 'bg-rose-600 text-white' : 'bg-white'}`}
                          >Sai</button>
                          {showImmediate && (
                            <span className="font-bold text-emerald-700 ml-1">({it.correct ? 'Đúng' : 'Sai'})</span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* DẠNG TRẢ LỜI NGẮN */}
              {currentQ.type === 'sa' && (
                <div className="space-y-2">
                  <input
                    type="text"
                    disabled={isSubmitted}
                    value={userAnswers[currentIdx] || ''}
                    onChange={e => setUserAnswers(prev => ({ ...prev, [currentIdx]: e.target.value }))}
                    placeholder="Nhập đáp án số..."
                    className="w-full p-3 border rounded-xl text-sm font-mono"
                  />
                  {showImmediate && (
                    <p className="text-xs font-bold text-emerald-700">Đáp án đúng: {currentQ.correctAnswer}</p>
                  )}
                </div>
              )}

              {showImmediate && currentQ.explanation && (
                <div className="p-3.5 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-900">
                  <b>💡 Giải thích chi tiết:</b> {currentQ.explanation}
                </div>
              )}

              <div className="flex justify-between pt-3 border-t">
                <button disabled={currentIdx === 0} onClick={() => setCurrentIdx(p => p - 1)} className="px-4 py-2 border rounded-lg text-xs font-bold disabled:opacity-40">← Câu trước</button>
                <button disabled={currentIdx === activeQuestions.length - 1} onClick={() => setCurrentIdx(p => p + 1)} className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold disabled:opacity-40">Câu tiếp theo →</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 6. SECTION GIÁO VIÊN:
    //    - XEM & SỬA NHIỀU CÂU HỎI CÙNG LÚC (BATCH EDIT)
    //    - TẠO ĐỀ TƯƠNG TỰ TỪ FILE PDF / WORD / ĐỀ HIỆN CÓ (KHÔNG CẦN API KEY)
    //    - XEM & XUẤT KẾT QUẢ LÀM BÀI CỦA HỌC SINH RA EXCEL (.CSV)
    // =========================================================================
    function TeacherSection({
      questions, setQuestions, topicsMap, onAddTopic,
      isAuthenticated, setIsAuthenticated, teacherPin, setTeacherPin,
      submissions, setSubmissions, showToast
    }) {
      const [subTab, setSubTab] = useState('bank_edit');
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      // Bộ lọc Xem & Sửa nhiều câu cùng lúc
      const [filterSubj, setFilterSubj] = useState('Tiếng Anh');
      const [filterGrade, setFilterGrade] = useState('12');
      const [filterTopic, setFilterTopic] = useState('Tất cả');
      const [searchKeyword, setSearchKeyword] = useState('');
      const [draftMap, setDraftMap] = useState({});

      // Upload PDF / DOCX & Tạo đề tương tự (Không cần API key)
      const [uploadSubj, setUploadSubj] = useState('Tiếng Anh');
      const [uploadGrade, setUploadGrade] = useState('12');
      const [uploadTopicName, setUploadTopicName] = useState('Đề Tiếng Anh Tương Tự Mới (Từ File PDF/Word)');
      const [rawExtractedText, setRawExtractedText] = useState('');
      const [uploadedFileName, setUploadedFileName] = useState('');
      const [isReadingFile, setIsReadingFile] = useState(false);
      const [generateSimilarFlag, setGenerateSimilarFlag] = useState(true);
      const [previewGeneratedList, setPreviewGeneratedList] = useState([]);

      // Lọc thống kê kết quả học sinh
      const [subClassFilter, setSubClassFilter] = useState('Tất cả');
      const [subSubjectFilter, setSubSubjectFilter] = useState('Tất cả');

      if (!isAuthenticated) {
        return (
          <div className="max-w-md mx-auto my-8 bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-md text-center space-y-4">
            <div className="text-4xl">🔐</div>
            <h2 className="text-xl font-extrabold text-slate-800">Đăng Nhập Góc Giáo Viên</h2>
            <p className="text-xs text-slate-500">Quản lý ngân hàng đề, tạo đề tương tự từ PDF/Word và xuất bảng điểm học sinh (PIN mặc định: <b>123456</b>)</p>
            <input
              type="password"
              value={pinInput}
              onChange={e => { setPinInput(e.target.value); setPinError(''); }}
              onKeyDown={e => {
                if (e.key === 'Enter') {
                  if (pinInput === teacherPin) setIsAuthenticated(true);
                  else setPinError('Sai mã PIN! Mặc định là 123456.');
                }
              }}
              placeholder="Nhập mã PIN..."
              className="w-full p-3 border rounded-xl text-center font-mono text-lg tracking-widest"
            />
            {pinError && <p className="text-xs text-rose-600 font-bold">{pinError}</p>}
            <button
              onClick={() => {
                if (pinInput === teacherPin) setIsAuthenticated(true);
                else setPinError('Sai mã PIN! Mặc định là 123456.');
              }}
              className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-xs shadow"
            >
              Mở Khóa Quản Trị
            </button>
          </div>
        );
      }

      const availableTopics = ['Tất cả', ...(topicsMap[filterSubj]?.[filterGrade] || [])];
      const filteredBankQuestions = questions.filter(q => {
        if (q.subject !== filterSubj || q.grade !== filterGrade) return false;
        if (filterSubj === 'Tiếng Anh' && q.type !== 'mcq') return false;
        if (filterTopic !== 'Tất cả' && q.topic !== filterTopic) return false;
        if (searchKeyword.trim() && !q.question.toLowerCase().includes(searchKeyword.toLowerCase())) return false;
        return true;
      });

      const updateDraft = (q, patch) => {
        setDraftMap(prev => ({
          ...prev,
          [q.id]: { ...(prev[q.id] || q), ...patch }
        }));
      };

      const handleSaveAllEdits = () => {
        const changedIds = Object.keys(draftMap);
        if (changedIds.length === 0) {
          showToast('Chưa có thay đổi nào cần lưu.');
          return;
        }
        setQuestions(prev => prev.map(q => {
          if (!draftMap[q.id]) return q;
          const updated = draftMap[q.id];
          // Đảm bảo riêng Tiếng Anh luôn là MCQ
          if (updated.subject === 'Tiếng Anh') updated.type = 'mcq';
          return updated;
        }));
        setDraftMap({});
        showToast(`Đã lưu cập nhật cho ${changedIds.length} câu hỏi thành công!`);
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setIsReadingFile(true);
        setUploadedFileName(file.name);
        const lowerName = file.name.toLowerCase();
        let text = '';

        if (lowerName.endsWith('.pdf')) {
          text = await extractTextFromPdfFile(file);
        } else if (lowerName.endsWith('.docx')) {
          text = await extractTextFromDocxFile(file);
        } else {
          text = await file.text();
        }

        setIsReadingFile(false);
        if (!text.trim()) {
          showToast('Không trích xuất được chữ (file ảnh scan). Thầy có thể dán văn bản đề vào ô bên dưới.');
        } else {
          setRawExtractedText(text);
          const generated = parseAndGenerateSimilarFromText(text, uploadSubj, uploadGrade, uploadTopicName, generateSimilarFlag);
          setPreviewGeneratedList(generated);
          showToast(`Đã đọc file "${file.name}" và tạo ${generated.length} câu hỏi!`);
        }
      };

      const handleCloneSelectedTopic = () => {
        const sourceList = filteredBankQuestions.slice(0, 40);
        if (sourceList.length === 0) {
          showToast('Không có câu hỏi mẫu trong bộ lọc hiện tại để nhân bản.');
          return;
        }
        const variantNum = Math.floor(Math.random() * 90) + 10;
        const newTopicTitle = `${filterTopic === 'Tất cả' ? filterSubj : filterTopic} - Đề Tương Tự #${variantNum}`;
        const cloned = cloneExistingTopicQuestions(sourceList, newTopicTitle, variantNum);
        onAddTopic(filterSubj, filterGrade, newTopicTitle);
        setQuestions(prev => [...cloned, ...prev]);
        showToast(`Đã tạo nhanh bộ đề tương tự "${newTopicTitle}" (${cloned.length} câu) không cần API Key!`);
      };

      const filteredSubmissions = submissions.filter(s => {
        if (subClassFilter !== 'Tất cả' && s.className !== subClassFilter) return false;
        if (subSubjectFilter !== 'Tất cả' && s.subject !== subSubjectFilter) return false;
        return true;
      });

      const exportSubmissionsCsv = () => {
        if (filteredSubmissions.length === 0) return;
        const BOM = '\uFEFF';
        const header = 'STT,Họ và Tên,Lớp,Môn Học,Khối,Chủ Đề / Đề Thi,Số Câu Đúng,Tổng Số Câu,Điểm Hệ 10,Tỷ Lệ (%),Thời Gian Nộp\n';
        const rows = filteredSubmissions.map((s, i) =>
          `${i + 1},"${s.name}","${s.className}","${s.subject}","${s.grade}","${s.topic}",${s.score},${s.total},${s.score10},${s.percentage}%,"${s.submittedAt}"`
        ).join('\n');
        const blob = new Blob([BOM + header + rows], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Ket_Qua_Lam_Bai_Hoc_Sinh_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Đã xuất file Excel (.csv) kết quả làm bài của học sinh!');
      };

      return (
        <div className="space-y-5">
          {/* THANH TRẠNG THÁI & CHUYỂN TAB CON */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap gap-2">
              <button
                onClick={() => setSubTab('bank_edit')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${subTab === 'bank_edit' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
              >
                ✏️ Xem &amp; Sửa Nhiều Câu Cùng Lúc ({questions.length})
              </button>
              <button
                onClick={() => setSubTab('ai_upload')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${subTab === 'ai_upload' ? 'bg-indigo-600 text-white shadow' : 'bg-indigo-50 text-indigo-800 hover:bg-indigo-100'}`}
              >
                📄 Upload PDF / Word &amp; Tạo Đề Tương Tự (Không cần API Key)
              </button>
              <button
                onClick={() => setSubTab('submissions')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${subTab === 'submissions' ? 'bg-amber-500 text-slate-900 shadow' : 'bg-amber-50 text-amber-900 hover:bg-amber-100'}`}
              >
                📊 Kết Quả Làm Bài Học Sinh ({submissions.length})
              </button>
            </div>
            <button onClick={() => setIsAuthenticated(false)} className="text-xs font-bold text-rose-600 hover:underline">Đăng xuất</button>
          </div>

          {/* TAB 1: XEM & SỬA NHIỀU CÂU HỎI CÙNG LÚC */}
          {subTab === 'bank_edit' && (
            <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-4 shadow-sm">
              <div className="flex flex-wrap items-center justify-between gap-3 border-b pb-3">
                <div>
                  <h3 className="font-extrabold text-base text-slate-800">Xem &amp; Chỉnh Sửa Hàng Loạt Câu Hỏi Trong Ngân Hàng</h3>
                  <p className="text-xs text-slate-500">Thầy có thể sửa trực tiếp nội dung câu hỏi, đáp án A/B/C/D, chọn đáp án đúng và lời giải của nhiều câu cùng lúc.</p>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button
                    onClick={handleCloneSelectedTopic}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow"
                  >
                    ✨ Nhân Bản Thành Đề Tương Tự Mới
                  </button>
                  <button
                    onClick={handleSaveAllEdits}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow"
                  >
                    💾 Lưu Tất Cả Thay Đổi ({Object.keys(draftMap).length})
                  </button>
                </div>
              </div>

              {/* Bộ lọc */}
              <div className="grid grid-cols-1 sm:grid-cols-4 gap-2.5 bg-slate-50 p-3 rounded-xl border">
                <select value={filterSubj} onChange={e => { setFilterSubj(e.target.value); setFilterTopic('Tất cả'); }} className="p-2 border rounded-lg text-xs bg-white font-bold">
                  <option value="Tiếng Anh">Môn: Tiếng Anh (100% MCQ)</option>
                  <option value="Sinh học">Môn: Sinh học</option>
                  <option value="Công nghệ Nông nghiệp">Môn: Công nghệ Nông nghiệp</option>
                </select>
                <select value={filterGrade} onChange={e => { setFilterGrade(e.target.value); setFilterTopic('Tất cả'); }} className="p-2 border rounded-lg text-xs bg-white font-bold">
                  <option value="12">Khối 12</option>
                  <option value="11">Khối 11</option>
                  <option value="10">Khối 10</option>
                </select>
                <select value={filterTopic} onChange={e => setFilterTopic(e.target.value)} className="p-2 border rounded-lg text-xs bg-white">
                  {availableTopics.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
                <input
                  type="text"
                  value={searchKeyword}
                  onChange={e => setSearchKeyword(e.target.value)}
                  placeholder="Tìm nhanh theo từ khóa..."
                  className="p-2 border rounded-lg text-xs bg-white"
                />
              </div>

              <div className="text-xs font-bold text-slate-600">
                Đang hiển thị {filteredBankQuestions.length} câu hỏi cùng lúc:
              </div>

              {/* Danh sách nhiều câu hỏi hiển thị đầy đủ để sửa cùng lúc */}
              <div className="space-y-4 max-h-[650px] overflow-y-auto pr-1">
                {filteredBankQuestions.map((origQ, idx) => {
                  const q = draftMap[origQ.id] || origQ;
                  const isDirty = Boolean(draftMap[origQ.id]);
                  return (
                    <div key={q.id} className={`p-4 rounded-xl border space-y-3 text-xs ${isDirty ? 'bg-amber-50/60 border-amber-400' : 'bg-slate-50 border-slate-200'}`}>
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <span className="bg-emerald-700 text-white font-bold px-2.5 py-0.5 rounded">Câu {idx + 1}</span>
                          <span className="text-[11px] font-semibold text-slate-600">{q.topic}</span>
                          <span className="bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded uppercase">{q.subject === 'Tiếng Anh' ? 'MCQ' : q.type}</span>
                          {isDirty && <span className="text-amber-700 font-bold">● Đã chỉnh sửa (chưa lưu)</span>}
                        </div>
                        <button
                          onClick={() => setQuestions(prev => prev.filter(item => item.id !== q.id))}
                          className="text-rose-600 hover:underline font-bold"
                        >
                          Xóa câu
                        </button>
                      </div>

                      <div>
                        <label className="block font-bold text-slate-600 mb-1">Nội dung câu hỏi:</label>
                        <textarea
                          rows={2}
                          value={q.question}
                          onChange={e => updateDraft(origQ, { question: e.target.value })}
                          className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs leading-relaxed"
                        />
                      </div>

                      {/* Chỉnh sửa 4 phương án A, B, C, D */}
                      {(q.type === 'mcq' || q.subject === 'Tiếng Anh') && Array.isArray(q.options) && (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          {q.options.map((opt, oIdx) => (
                            <div key={oIdx} className={`flex items-center gap-2 p-2 rounded-lg border ${q.correct === oIdx ? 'bg-emerald-50 border-emerald-500' : 'bg-white border-slate-200'}`}>
                              <input
                                type="radio"
                                name={`correct_${q.id}`}
                                checked={q.correct === oIdx}
                                onChange={() => updateDraft(origQ, { correct: oIdx })}
                                title="Chọn làm đáp án đúng"
                              />
                              <span className="font-bold text-slate-700">{String.fromCharCode(65 + oIdx)}.</span>
                              <input
                                type="text"
                                value={opt}
                                onChange={e => {
                                  const nextOpts = [...q.options];
                                  nextOpts[oIdx] = e.target.value;
                                  updateDraft(origQ, { options: nextOpts });
                                }}
                                className="flex-1 bg-transparent outline-none text-xs"
                              />
                            </div>
                          ))}
                        </div>
                      )}

                      {/* Chỉnh sửa Đúng/Sai 4 ý (cho Sinh học / Công nghệ) */}
                      {q.subject !== 'Tiếng Anh' && q.type === 'tf' && Array.isArray(q.items) && (
                        <div className="space-y-1.5">
                          {q.items.map((it, itIdx) => (
                            <div key={it.id} className="flex items-center gap-2 bg-white p-2 rounded border">
                              <input
                                type="text"
                                value={it.statement}
                                onChange={e => {
                                  const nextItems = [...q.items];
                                  nextItems[itIdx] = { ...it, statement: e.target.value };
                                  updateDraft(origQ, { items: nextItems });
                                }}
                                className="flex-1 text-xs outline-none"
                              />
                              <select
                                value={it.correct ? 'true' : 'false'}
                                onChange={e => {
                                  const nextItems = [...q.items];
                                  nextItems[itIdx] = { ...it, correct: e.target.value === 'true' };
                                  updateDraft(origQ, { items: nextItems });
                                }}
                                className="border rounded p-1 text-xs font-bold"
                              >
                                <option value="true">Đúng</option>
                                <option value="false">Sai</option>
                              </select>
                            </div>
                          ))}
                        </div>
                      )}

                      {/* Chỉnh sửa Trả lời ngắn */}
                      {q.subject !== 'Tiếng Anh' && q.type === 'sa' && (
                        <div className="flex items-center gap-2">
                          <span className="font-bold">Đáp số chuẩn:</span>
                          <input
                            type="text"
                            value={q.correctAnswer || ''}
                            onChange={e => updateDraft(origQ, { correctAnswer: e.target.value })}
                            className="p-1.5 bg-white border rounded font-mono text-xs"
                          />
                        </div>
                      )}

                      <div>
                        <label className="block font-bold text-slate-600 mb-1">Lời giải chi tiết:</label>
                        <input
                          type="text"
                          value={q.explanation || ''}
                          onChange={e => updateDraft(origQ, { explanation: e.target.value })}
                          className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs"
                        />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* TAB 2: UPLOAD PDF / WORD & TẠO ĐỀ TƯƠNG TỰ (KHÔNG BAO GIỜ ĐÒI API KEY) */}
          {subTab === 'ai_upload' && (
            <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-5 shadow-sm">
              <div className="border-b pb-3">
                <h3 className="font-extrabold text-base text-slate-800">Tạo Đề Tương Tự Từ File PDF / Word (.docx) — Hoạt Động Trực Tiếp Không Cần API Key</h3>
                <p className="text-xs text-slate-500 mt-1">
                  Hệ thống tích hợp sẵn bộ đọc <b>PDF.js</b> và <b>Mammoth Word</b> ngay trên trình duyệt: Thầy chỉ cần đính kèm file đề <b>.pdf</b> hoặc <b>.docx</b>, ứng dụng sẽ tự động tách câu hỏi và tạo bộ đề tương tự để học sinh luyện tập.
                </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="block text-xs font-bold mb-1">Môn học áp dụng:</label>
                  <select value={uploadSubj} onChange={e => setUploadSubj(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-white font-bold">
                    <option value="Tiếng Anh">Tiếng Anh (100% MCQ)</option>
                    <option value="Sinh học">Sinh học</option>
                    <option value="Công nghệ Nông nghiệp">Công nghệ Nông nghiệp</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Khối lớp:</label>
                  <select value={uploadGrade} onChange={e => setUploadGrade(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-white font-bold">
                    <option value="12">Khối 12</option>
                    <option value="11">Khối 11</option>
                    <option value="10">Khối 10</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Tên Bộ Đề / Chủ Đề Lưu Vào Ngân Hàng:</label>
                  <input
                    type="text"
                    value={uploadTopicName}
                    onChange={e => setUploadTopicName(e.target.value)}
                    className="w-full p-2.5 border rounded-xl text-xs bg-white"
                  />
                </div>
              </div>

              {/* Khu vực đính kèm file PDF / DOCX */}
              <div className="border-2 border-dashed border-indigo-300 bg-indigo-50/40 rounded-2xl p-6 text-center space-y-3">
                <div className="text-3xl">📂</div>
                <p className="text-xs font-bold text-indigo-900">
                  Chọn tệp đề thi định dạng <b>.PDF</b>, <b>.DOCX</b> hoặc <b>.TXT</b> từ máy tính của Thầy
                </p>
                <label className="inline-block bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold cursor-pointer shadow">
                  <span>{isReadingFile ? 'Đang đọc nội dung file...' : '📎 Đính Kèm File PDF / Word (.docx)'}</span>
                  <input
                    type="file"
                    accept=".pdf,.docx,.txt"
                    onChange={handleFileUpload}
                    className="hidden"
                  />
                </label>
                {uploadedFileName && (
                  <p className="text-xs text-emerald-700 font-bold">✓ Đã nạp tệp: {uploadedFileName}</p>
                )}
              </div>

              <div className="flex items-center justify-between flex-wrap gap-3 bg-slate-50 p-3 rounded-xl border">
                <label className="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={generateSimilarFlag}
                    onChange={e => setGenerateSimilarFlag(e.target.checked)}
                    className="w-4 h-4"
                  />
                  <span>Tự động biến đổi &amp; xáo trộn tạo thành Đề Tương Tự mới (Thay vì chỉ nhập nguyên bản)</span>
                </label>
                <button
                  onClick={() => {
                    if (!rawExtractedText.trim()) {
                      showToast('Vui lòng đính kèm file PDF/Word hoặc dán nội dung đề trước!');
                      return;
                    }
                    const gen = parseAndGenerateSimilarFromText(rawExtractedText, uploadSubj, uploadGrade, uploadTopicName, generateSimilarFlag);
                    setPreviewGeneratedList(gen);
                    showToast(`Đã tạo ${gen.length} câu hỏi từ nội dung đề!`);
                  }}
                  className="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold"
                >
                  🔄 Phân Tích &amp; Sinh Đề Ngay
                </button>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Nội dung văn bản trích xuất từ PDF/Word (Thầy có thể chỉnh sửa thêm nếu muốn):</label>
                <textarea
                  rows={6}
                  value={rawExtractedText}
                  onChange={e => setRawExtractedText(e.target.value)}
                  placeholder="Nội dung từ file PDF hoặc Word sẽ hiển thị tại đây..."
                  className="w-full p-3 border rounded-xl text-xs font-mono bg-slate-50"
                />
              </div>

              {previewGeneratedList.length > 0 && (
                <div className="border-t pt-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-extrabold text-emerald-800">
                      Xem trước {previewGeneratedList.length} câu hỏi vừa tạo:
                    </span>
                    <button
                      onClick={() => {
                        onAddTopic(uploadSubj, uploadGrade, uploadTopicName);
                        setQuestions(prev => [...previewGeneratedList, ...prev]);
                        setPreviewGeneratedList([]);
                        showToast(`Đã lưu ${previewGeneratedList.length} câu hỏi vào ngân hàng ôn luyện!`);
                      }}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow"
                    >
                      ✅ Lưu Toàn Bộ Vào Ngân Hàng Cho Học Sinh Luyện Tập
                    </button>
                  </div>

                  <div className="space-y-2 max-h-72 overflow-y-auto bg-slate-50 p-3 rounded-xl border">
                    {previewGeneratedList.map((item, i) => (
                      <div key={item.id} className="p-3 bg-white rounded-lg border text-xs space-y-1">
                        <p className="font-bold text-slate-800">Câu {i + 1}: {item.question}</p>
                        <div className="grid grid-cols-2 gap-1 text-[11px] text-slate-600 pl-3">
                          {item.options?.map((o, oi) => (
                            <span key={oi} className={item.correct === oi ? 'text-emerald-700 font-bold' : ''}>
                              {String.fromCharCode(65 + oi)}. {o}
                            </span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 3: XEM & XUẤT KẾT QUẢ LÀM BÀI CỦA HỌC SINH */}
          {subTab === 'submissions' && (
            <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-4 shadow-sm">
              <div className="flex flex-wrap items-center justify-between gap-3 border-b pb-3">
                <div>
                  <h3 className="font-extrabold text-base text-slate-800">Bảng Thống Kê &amp; Xuất Kết Quả Làm Bài Của Học Sinh</h3>
                  <p className="text-xs text-slate-500">Theo dõi chi tiết điểm số, lớp, thời gian nộp bài và xuất ra file Excel (.csv).</p>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button
                    onClick={exportSubmissionsCsv}
                    disabled={filteredSubmissions.length === 0}
                    className="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white px-4 py-2 rounded-xl text-xs font-bold shadow"
                  >
                    📥 Xuất File Excel (.CSV)
                  </button>
                  {submissions.length > 0 && (
                    <button
                      onClick={() => setSubmissions([])}
                      className="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3 py-2 rounded-xl text-xs font-bold"
                    >
                      Xóa lịch sử
                    </button>
                  )}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl">
                  <span className="text-xs text-emerald-700 font-semibold">Tổng lượt nộp bài:</span>
                  <p className="text-2xl font-black text-emerald-900">{filteredSubmissions.length}</p>
                </div>
                <div className="p-3 bg-indigo-50 border border-indigo-200 rounded-xl">
                  <span className="text-xs text-indigo-700 font-semibold">Điểm trung bình (thang 10):</span>
                  <p className="text-2xl font-black text-indigo-900">
                    {filteredSubmissions.length > 0
                      ? (filteredSubmissions.reduce((s, a) => s + Number(a.score10 || 0), 0) / filteredSubmissions.length).toFixed(2)
                      : '0.00'}
                  </p>
                </div>
                <div className="p-3 bg-slate-50 border rounded-xl space-y-1.5">
                  <span className="text-xs font-bold text-slate-600">Lọc theo Môn học:</span>
                  <select value={subSubjectFilter} onChange={e => setSubSubjectFilter(e.target.value)} className="w-full p-1.5 border rounded text-xs bg-white">
                    <option value="Tất cả">Tất cả các môn</option>
                    <option value="Tiếng Anh">Tiếng Anh</option>
                    <option value="Sinh học">Sinh học</option>
                    <option value="Công nghệ Nông nghiệp">Công nghệ Nông nghiệp</option>
                  </select>
                </div>
              </div>

              {filteredSubmissions.length === 0 ? (
                <div className="text-center py-10 text-xs text-slate-400">
                  Chưa có học sinh nào nộp bài. Khi học sinh làm bài ở tab "Luyện Trắc Nghiệm" và nhấn Nộp Bài, kết quả sẽ hiển thị tại đây.
                </div>
              ) : (
                <div className="overflow-x-auto border rounded-xl">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className="bg-slate-100 text-slate-700 font-bold border-b">
                        <th className="p-3">STT</th>
                        <th className="p-3">Họ và Tên</th>
                        <th className="p-3">Lớp</th>
                        <th className="p-3">Môn / Khối</th>
                        <th className="p-3">Đề Thi / Chủ Đề</th>
                        <th className="p-3">Số Câu Đúng</th>
                        <th className="p-3">Điểm (Hệ 10)</th>
                        <th className="p-3">Thời Gian Nộp</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {filteredSubmissions.map((s, idx) => (
                        <tr key={s.id} className="hover:bg-slate-50">
                          <td className="p-3 font-mono">{idx + 1}</td>
                          <td className="p-3 font-bold text-slate-800">{s.name}</td>
                          <td className="p-3">{s.className}</td>
                          <td className="p-3">{s.subject} ({s.grade})</td>
                          <td className="p-3 text-emerald-800 font-medium">{s.topic}</td>
                          <td className="p-3 font-mono font-bold">{s.score} / {s.total}</td>
                          <td className="p-3">
                            <span className="bg-emerald-100 text-emerald-800 font-extrabold px-2 py-0.5 rounded">
                              {s.score10} đ ({s.percentage}%)
                            </span>
                          </td>
                          <td className="p-3 text-slate-500 font-mono">{s.submittedAt}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7. SECTION XUẤT ĐỀ THI RA PDF / IN ẤN
    // =========================================================================
    function ExporterSection({ questions, topicsMap, selectedSubject, setSelectedSubject, selectedGrade, setSelectedGrade }) {
      const [selectedTopic, setSelectedTopic] = useState('Tất cả');
      const [examCode, setExamCode] = useState('1102');
      const [showAnswerKey, setShowAnswerKey] = useState(true);

      const availableTopics = ['Tất cả', ...(topicsMap[selectedSubject]?.[selectedGrade] || [])];
      const exportList = questions.filter(q => {
        if (q.subject !== selectedSubject || q.grade !== selectedGrade) return false;
        if (selectedSubject === 'Tiếng Anh' && q.type !== 'mcq') return false;
        if (selectedTopic !== 'Tất cả' && q.topic !== selectedTopic) return false;
        return true;
      });

      return (
        <div className="space-y-5">
          <div className="bg-white p-4 rounded-2xl border border-slate-200 flex flex-wrap items-center gap-3 print:hidden">
            <select value={selectedSubject} onChange={e => { setSelectedSubject(e.target.value); setSelectedTopic('Tất cả'); }} className="p-2 border rounded-xl text-xs bg-white font-bold">
              <option value="Tiếng Anh">Tiếng Anh</option>
              <option value="Sinh học">Sinh học</option>
              <option value="Công nghệ Nông nghiệp">Công nghệ Nông nghiệp</option>
            </select>
            <select value={selectedGrade} onChange={e => { setSelectedGrade(e.target.value); setSelectedTopic('Tất cả'); }} className="p-2 border rounded-xl text-xs bg-white font-bold">
              <option value="12">Khối 12</option>
              <option value="11">Khối 11</option>
              <option value="10">Khối 10</option>
            </select>
            <select value={selectedTopic} onChange={e => setSelectedTopic(e.target.value)} className="p-2 border rounded-xl text-xs bg-white max-w-xs">
              {availableTopics.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
            <input type="text" value={examCode} onChange={e => setExamCode(e.target.value)} placeholder="Mã đề..." className="w-24 p-2 border rounded-xl text-xs font-mono" />
            <label className="flex items-center gap-1.5 text-xs font-semibold">
              <input type="checkbox" checked={showAnswerKey} onChange={e => setShowAnswerKey(e.target.checked)} />
              <span>Kèm đáp án</span>
            </label>
            <button onClick={() => window.print()} className="ml-auto bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">
              🖨️ In / Lưu File PDF
            </button>
          </div>

          <div className="bg-white p-8 sm:p-10 rounded-2xl border border-slate-200 font-serif text-sm space-y-6 print:border-none print:p-0">
            <div className="border-b-2 border-slate-900 pb-4 flex justify-between text-center">
              <div className="w-1/2">
                <p className="font-bold uppercase">SỞ GIÁO DỤC VÀ ĐÀO TẠO</p>
                <p className="font-bold uppercase">LỚP ÔN THI THẦY TRƯƠNG TRUNG CAN</p>
              </div>
              <div className="w-1/2">
                <p className="font-bold uppercase">ĐỀ ÔN TẬP TỐT NGHIỆP THPT</p>
                <p className="font-bold">Môn: {selectedSubject.toUpperCase()} - Khối {selectedGrade}</p>
                <p className="font-mono text-xs font-bold">Mã đề: {examCode}</p>
              </div>
            </div>

            <div className="space-y-5">
              {exportList.map((q, idx) => (
                <div key={q.id} className="space-y-1.5">
                  <p className="whitespace-pre-line"><b>Question {idx + 1}:</b> {q.question}</p>
                  {Array.isArray(q.options) && (
                    <div className="grid grid-cols-2 gap-x-6 gap-y-1 pl-5">
                      {q.options.map((opt, oi) => (
                        <p key={oi}><b>{String.fromCharCode(65 + oi)}.</b> {opt}</p>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>

            {showAnswerKey && exportList.length > 0 && (
              <div className="pt-6 border-t-2 border-slate-900">
                <h4 className="font-bold text-center uppercase mb-3">BẢNG ĐÁP ÁN MÃ ĐỀ {examCode}</h4>
                <div className="grid grid-cols-5 sm:grid-cols-10 gap-2 text-center font-mono text-xs">
                  {exportList.map((q, i) => (
                    <div key={q.id} className="border border-slate-800 p-1.5">
                      <b>{i + 1}.</b> {q.type === 'mcq' ? String.fromCharCode(65 + q.correct) : q.correctAnswer || 'Đ/S'}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
