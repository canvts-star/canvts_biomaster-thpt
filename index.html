<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioMaster THPT - Thầy Trương Trung Can</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM 18 -->
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel cho JSX -->
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <!-- Thư viện đọc PDF.js & Mammoth.js (.docx) -->
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- Thư viện JSZip đọc trực tiếp lõi XML màu đỏ & gạch dưới trong file .docx -->
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Thư viện OCR Tesseract.js đọc chữ trong khung/ảnh của file PDF -->
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @media print {
      body { background: white !important; color: black !important; }
      .print\:hidden { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, Component } = React;

    // ErrorBoundary bắt lỗi giao diện an toàn
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error?.message || 'Lỗi hiển thị giao diện.' };
      }
      componentDidCatch(error, info) {
        console.error('ErrorBoundary caught:', error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 max-w-lg mx-auto my-10 bg-rose-50 border border-rose-300 rounded-2xl text-center space-y-3">
              <h2 className="text-lg font-bold text-rose-800">Đã xảy ra sự cố hiển thị</h2>
              <p className="text-xs text-rose-600 font-mono">{this.state.errorMessage}</p>
              <button
                onClick={() => this.setState({ hasError: false, errorMessage: '' })}
                className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold"
              >
                Khôi Phục Ứng Dụng
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Cấu hình PDF.js worker an toàn
    if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // =========================================================================
    // 1. CHUẨN HÓA UNICODE TIẾNG VIỆT & ĐỌC FILE PDF / WORD (.DOCX)
    // =========================================================================
    function cleanVietnameseUnicode(str) {
      if (!str) return '';
      return String(str)
        .normalize('NFC')
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFD]/g, '')
        .replace(/\u00A0/g, ' ')
        .replace(/[ \t]+/g, ' ');
    }

    function isRedOrHighlightHex(hexStr) {
      if (!hexStr) return false;
      const clean = String(hexStr).replace(/[^0-9A-Fa-f]/g, '').toUpperCase();
      if (clean.length !== 6) return false;
      if (['000000', 'FFFFFF', 'AUTO', '111111', '222222', '333333', '444444'].includes(clean)) return false;
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      // Nhận diện màu đỏ (r chiếm ưu thế) hoặc các màu tô nổi bật (xanh dương đậm, tím, cam...)
      if (r >= 130 && r > g + 45 && r > b + 45) return true;
      if (b >= 140 && b > r + 50 && b > g + 30) return true;
      return false;
    }

    async function extractTextFromPdfFile(file, onProgress) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        if (!window.pdfjsLib) return { text: '', pageImages: {} };
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';
        const pageImages = {};

        for (let p = 1; p <= pdf.numPages; p++) {
          const page = await pdf.getPage(p);
          const content = await page.getTextContent();
          const ops = await page.getOperatorList();

          let hasGraphicsOrTable = false;
          const redOrUnderlineYCoords = [];

          // Quét OperatorList của PDF để tìm tọa độ Y có chữ màu đỏ hoặc đường gạch dưới
          if (ops && Array.isArray(ops.fnArray) && window.pdfjsLib.OPS) {
            const OPS = window.pdfjsLib.OPS;
            const imgOps = [
              OPS.paintImageXObject,
              OPS.paintInlineImageXObject,
              OPS.paintJpegXObject,
              OPS.paintImageMaskXObject
            ];
            let curIsRed = false;
            let curY = 0;

            for (let k = 0; k < ops.fnArray.length; k++) {
              const fn = ops.fnArray[k];
              const args = ops.argsArray[k] || [];
              if (imgOps.includes(fn)) hasGraphicsOrTable = true;

              if (fn === OPS.setFillRGBColor || fn === OPS.setStrokeRGBColor) {
                const [r, g, b] = args;
                const r255 = r <= 1 ? Math.round(r * 255) : r;
                const g255 = g <= 1 ? Math.round(g * 255) : g;
                const b255 = b <= 1 ? Math.round(b * 255) : b;
                curIsRed = (r255 >= 130 && r255 > g255 + 45 && r255 > b255 + 45);
              } else if (fn === OPS.setFillCMYKColor || fn === OPS.setStrokeCMYKColor) {
                const [c, m, y, bl] = args;
                curIsRed = (m > 0.5 && y > 0.4 && c < 0.3 && bl < 0.4);
              } else if (fn === OPS.setTextMatrix && args.length >= 6) {
                curY = args[5];
              } else if ((fn === OPS.showText || fn === OPS.showSpacedText) && curIsRed) {
                redOrUnderlineYCoords.push(curY);
              } else if (fn === OPS.constructPath && Array.isArray(args[1])) {
                // Kiểm tra nét gạch ngang ngắn (gạch dưới đáp án)
                const coords = args[1];
                if (coords.length >= 4 && Math.abs(coords[1] - coords[3]) < 1.5 && Math.abs(coords[0] - coords[2]) >= 8 && Math.abs(coords[0] - coords[2]) <= 260) {
                  redOrUnderlineYCoords.push(coords[1]);
                }
              }
            }
          }

          const sortedItems = [...content.items].sort((a, b) => {
            const yDiff = Math.abs(b.transform[5] - a.transform[5]);
            if (yDiff > 5) return b.transform[5] - a.transform[5];
            return a.transform[4] - b.transform[4];
          });

          const lines = [];
          let currentLine = [];
          let lastY = null;
          sortedItems.forEach(item => {
            const y = item.transform[5];
            if (lastY !== null && Math.abs(y - lastY) > 6) {
              lines.push(currentLine.join(' '));
              currentLine = [];
            }
            const isMarkedY = redOrUnderlineYCoords.some(ry => Math.abs(ry - y) < 6);
            const strVal = isMarkedY && /^[A-D][\.\:\)]/.test(item.str.trim())
              ? `[[ANS_MARK]]${item.str}`
              : item.str;
            currentLine.push(strVal);
            lastY = y;
          });
          if (currentLine.length > 0) lines.push(currentLine.join(' '));

          let pageText = cleanVietnameseUnicode(lines.join('\n')).trim();

          if (hasGraphicsOrTable || pageText.length < 200) {
            if (onProgress) onProgress(`Đang trích xuất bảng số liệu & hình ảnh Trang ${p}/${pdf.numPages}...`);
            const viewport = page.getViewport({ scale: 1.8 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;

            if (hasGraphicsOrTable) {
              pageImages[p] = canvas.toDataURL('image/png');
            }

            if (pageText.length < 200 && window.Tesseract) {
              const ocrRes = await window.Tesseract.recognize(canvas, 'vie+eng');
              const ocrText = cleanVietnameseUnicode(ocrRes?.data?.text || '').trim();
              if (ocrText.length > pageText.length) {
                pageText = ocrText;
              }
            }
          }

          fullText += `\n[[PAGE_${p}]]\n` + pageText;
        }
        return { text: fullText.trim(), pageImages };
      } catch (err) {
        console.error('Lỗi đọc PDF:', err);
        return { text: '', pageImages: {} };
      }
    }

    async function extractTextFromDocxFile(file) {
      try {
        const arrayBuffer = await file.arrayBuffer();

        // BƯỚC 1: ĐỌC TRỰC TIẾP LÕI XML CỦA FILE WORD (.DOCX) QUA JSZIP ĐỂ BẮT CHÍNH XÁC MÀU ĐỎ & GẠCH DƯỚI
        let xmlExtractedText = '';
        const xmlAnswerHints = {};
        if (window.JSZip) {
          try {
            const zip = await window.JSZip.loadAsync(arrayBuffer);
            const docXmlStr = await zip.file('word/document.xml')?.async('string');
            const stylesXmlStr = await zip.file('word/styles.xml')?.async('string');

            // Đọc các style có quy định màu đỏ hoặc gạch dưới trong word/styles.xml
            const markedStyleIds = new Set();
            if (stylesXmlStr) {
              const sDoc = new DOMParser().parseFromString(stylesXmlStr, 'application/xml');
              sDoc.querySelectorAll('style').forEach(st => {
                const stId = st.getAttribute('w:styleId') || st.getAttribute('styleId');
                const colorEl = st.querySelector('rPr > color');
                const uEl = st.querySelector('rPr > u');
                const colorVal = colorEl?.getAttribute('w:val') || colorEl?.getAttribute('val');
                const uVal = uEl?.getAttribute('w:val') || uEl?.getAttribute('val');
                if ((colorVal && isRedOrHighlightHex(colorVal)) || (uEl && uVal !== 'none')) {
                  if (stId) markedStyleIds.add(stId);
                }
              });
            }

            if (docXmlStr) {
              const xmlDoc = new DOMParser().parseFromString(docXmlStr, 'application/xml');
              const paragraphs = Array.from(xmlDoc.getElementsByTagName('w:p'));
              const pLines = [];

              paragraphs.forEach(p => {
                const runs = Array.from(p.getElementsByTagName('w:r'));
                let lineStr = '';
                runs.forEach(r => {
                  const rPr = r.getElementsByTagName('w:rPr')[0];
                  let isMarkedRun = false;
                  if (rPr) {
                    const colorEl = rPr.getElementsByTagName('w:color')[0];
                    const uEl = rPr.getElementsByTagName('w:u')[0];
                    const hlEl = rPr.getElementsByTagName('w:highlight')[0];
                    const rStyleEl = rPr.getElementsByTagName('w:rStyle')[0];

                    const cVal = colorEl?.getAttribute('w:val') || colorEl?.getAttribute('val');
                    const uVal = uEl?.getAttribute('w:val') || uEl?.getAttribute('val');
                    const hlVal = hlEl?.getAttribute('w:val') || hlEl?.getAttribute('val');
                    const stVal = rStyleEl?.getAttribute('w:val') || rStyleEl?.getAttribute('val');

                    if (cVal && isRedOrHighlightHex(cVal)) isMarkedRun = true;
                    if (uEl && uVal !== 'none') isMarkedRun = true;
                    if (hlEl && hlVal && hlVal !== 'none' && hlVal !== 'white') isMarkedRun = true;
                    if (stVal && markedStyleIds.has(stVal)) isMarkedRun = true;
                  }

                  const tNodes = Array.from(r.getElementsByTagName('w:t'));
                  const rText = tNodes.map(t => t.textContent || '').join('');
                  if (rText) {
                    lineStr += isMarkedRun ? `[[ANS_MARK]]${rText}` : rText;
                  }
                });
                if (lineStr.trim()) pLines.push(lineStr);
              });

              xmlExtractedText = cleanVietnameseUnicode(pLines.join('\n'));
            }
          } catch (xmlErr) {
            console.warn('Không đọc được XML trực tiếp, chuyển sang Mammoth:', xmlErr);
          }
        }

        // BƯỚC 2: DÙNG MAMMOTH LẤY BẢNG BIỂU, HÌNH ẢNH & BẢNG ĐÁP ÁN CUỐI ĐỀ
        if (!window.mammoth) {
          return { text: xmlExtractedText, richBlocks: {}, answerHints: xmlAnswerHints };
        }

        const htmlResult = await window.mammoth.convertToHtml({
          arrayBuffer,
          styleMap: [
            "u => u",
            "b => strong",
            "i => em"
          ]
        });

        if (htmlResult && htmlResult.value) {
          const wrapper = document.createElement('div');
          wrapper.innerHTML = cleanVietnameseUnicode(htmlResult.value);

          const richBlocks = {};
          const answerHints = { ...xmlAnswerHints };
          let blockIdx = 0;

          // Xử lý bảng biểu: tách Bảng đáp án riêng và giữ nguyên Bảng số liệu câu hỏi
          wrapper.querySelectorAll('table').forEach(tbl => {
            const rows = Array.from(tbl.querySelectorAll('tr')).map(tr =>
              Array.from(tr.querySelectorAll('td, th')).map(cell => cell.textContent.replace(/\[\[ANS_MARK\]\]/g, '').trim())
            );

            let isAnswerTable = false;
            const tableAnswerMap = {};

            for (let r = 0; r < rows.length - 1; r++) {
              const nums = rows[r].map(c => parseInt(c.replace(/\D/g, ''), 10));
              const letters = rows[r + 1].map(c => c.replace(/[^A-Da-d]/g, '').toUpperCase());
              const validPairs = nums.filter((n, idx) => !isNaN(n) && n >= 1 && n <= 60 && ['A', 'B', 'C', 'D'].includes(letters[idx]));
              if (validPairs.length >= 3) {
                isAnswerTable = true;
                nums.forEach((n, idx) => {
                  if (!isNaN(n) && n >= 1 && n <= 60 && ['A', 'B', 'C', 'D'].includes(letters[idx])) {
                    tableAnswerMap[n] = letters[idx];
                  }
                });
              }
            }

            rows.forEach(row => {
              row.forEach(cell => {
                const m = cell.match(/^(?:Câu|Question)?\s*(\d{1,2})\s*[\.:\-\)]\s*([A-D])$/i);
                if (m) {
                  tableAnswerMap[parseInt(m[1], 10)] = m[2].toUpperCase();
                  isAnswerTable = true;
                }
              });
              for (let c = 0; c < row.length - 1; c += 2) {
                const qM = row[c].match(/^(?:Câu|Question)?\s*(\d{1,2})\s*[\.:\)]?$/i);
                const aM = row[c + 1].match(/^([A-D])$/i);
                if (qM && aM) {
                  tableAnswerMap[parseInt(qM[1], 10)] = aM[1].toUpperCase();
                  isAnswerTable = true;
                }
              }
            });

            if (isAnswerTable) {
              Object.assign(answerHints, tableAnswerMap);
              tbl.remove();
            } else {
              blockIdx++;
              const token = `[[RICH_BLOCK_${blockIdx}]]`;
              tbl.style.borderCollapse = 'collapse';
              tbl.style.width = '100%';
              tbl.style.margin = '8px 0';
              tbl.querySelectorAll('td, th').forEach(cell => {
                cell.style.border = '1px solid #94a3b8';
                cell.style.padding = '4px 8px';
              });
              richBlocks[token] = tbl.outerHTML;
              tbl.replaceWith(document.createTextNode(`\n${token}\n`));
            }
          });

          // Giữ nguyên hình ảnh nhúng trong file Word
          wrapper.querySelectorAll('img').forEach(img => {
            blockIdx++;
            const token = `[[RICH_BLOCK_${blockIdx}]]`;
            img.style.maxWidth = '100%';
            img.style.height = 'auto';
            img.style.margin = '8px 0';
            richBlocks[token] = img.outerHTML;
            img.replaceWith(document.createTextNode(`\n${token}\n`));
          });

          wrapper.querySelectorAll('p, div, li, h1, h2, h3, h4, br').forEach(el => {
            el.insertAdjacentText('afterend', '\n');
          });

          const mammothText = cleanVietnameseUnicode(wrapper.textContent || '');
          // Ưu tiên dùng văn bản trích xuất từ XML (đã gắn [[ANS_MARK]] chính xác tại mọi chữ màu đỏ / gạch dưới)
          const finalDocxText = xmlExtractedText.includes('[[ANS_MARK]]') ? xmlExtractedText : mammothText;
          return { text: finalDocxText, richBlocks, answerHints };
        }

        return { text: xmlExtractedText, richBlocks: {}, answerHints: xmlAnswerHints };
      } catch (err) {
        console.error('Lỗi đọc DOCX:', err);
        return { text: '', richBlocks: {}, answerHints: {} };
      }
    }

    // Trích xuất bảng đáp án từ văn bản thô (hỗ trợ cả file PDF & Word có BẢNG ĐÁP ÁN ở cuối đề)
    function extractAnswerKeyFromRawText(rawText, preDetectedMap = {}) {
      const ansMap = { ...preDetectedMap };
      if (!rawText) return ansMap;

      const clean = cleanVietnameseUnicode(rawText).replace(/\[\[ANS_MARK\]\]/g, '');
      const keySectionMatch = clean.split(/\n\s*(?:BẢNG\s+ĐÁP\s+ÁN|ĐÁP\s+ÁN\s+CHI\s+TIẾT|ĐÁP\s+ÁN|ANSWER\s+KEY|HƯỚNG\s+DẪN\s+GIẢI)\b/i);
      const targetText = keySectionMatch.length > 1 ? keySectionMatch.slice(1).join('\n') : clean;

      // 1. Dạng liệt kê: 1.A 2.B hoặc 1-A, 2-B hoặc Câu 1: A
      const pairRegex = /(?:^|\s|\||\(|\b)(?:Câu|Question|Q)?\s*(\d{1,2})\s*(?:[\.:\-\)\/\s])\s*([A-D])(?=\s|$|\||,|;|\)|\.|\b)/gi;
      let m;
      while ((m = pairRegex.exec(targetText)) !== null) {
        const qNum = parseInt(m[1], 10);
        if (qNum >= 1 && qNum <= 60 && !ansMap[qNum]) {
          ansMap[qNum] = m[2].toUpperCase();
        }
      }

      // 2. Dạng bảng 2 hàng tách rời trong PDF: Hàng số [1 2 3...] ngay trên hàng chữ cái [A C D...]
      const lines = targetText.split('\n').map(l => l.trim()).filter(Boolean);
      for (let i = 0; i < lines.length - 1; i++) {
        const nums = lines[i].match(/\b\d{1,2}\b/g);
        const letters = lines[i + 1].match(/\b[A-D]\b/g);
        if (nums && letters && nums.length >= 3 && nums.length === letters.length) {
          nums.forEach((nStr, idx) => {
            const qNum = parseInt(nStr, 10);
            if (qNum >= 1 && qNum <= 60) {
              ansMap[qNum] = letters[idx].toUpperCase();
            }
          });
        }
      }

      // 3. Dạng chuỗi đáp án liên tiếp ở cuối đề (1A 2C 3D 4B...)
      const compactRegex = /\b(\d{1,2})([A-D])\b/g;
      let cm;
      while ((cm = compactRegex.exec(targetText)) !== null) {
        const qNum = parseInt(cm[1], 10);
        if (qNum >= 1 && qNum <= 60 && !ansMap[qNum]) {
          ansMap[qNum] = cm[2].toUpperCase();
        }
      }

      return ansMap;
    }

    // =========================================================================
    // 2. BỘ PHÂN TÍCH ĐỀ THI & SINH ĐỀ HOÀN CHỈNH / ĐỀ TƯƠNG TỰ
    // =========================================================================
    function parseAndGenerateSimilarFromText(rawText, subject, grade, topic, options = {}) {
      const { richBlocks = {}, pageImages = {}, answerHints = {}, mode = 'similar' } = options;
      const isEnglish = subject === 'Tiếng Anh';
      const normalized = cleanVietnameseUnicode(rawText);
      const answerKeyMap = extractAnswerKeyFromRawText(normalized, answerHints);

      // Cắt bỏ phần bảng đáp án ở cuối để không bị nhận nhầm thành câu hỏi
      const bodyOnly = normalized.split(/\n\s*(?:BẢNG\s+ĐÁP\s+ÁN|ĐÁP\s+ÁN\s+CHI\s+TIẾT|ANSWER\s+KEY|HƯỚNG\s+DẪN\s+GIẢI)\b/i)[0];

      // Tìm vị trí từng câu hỏi: Câu 1., Câu 1:, Question 1., 1., 1)
      const regexSplit = /(?:^|\n)\s*(?:Câu|Question)\s*(\d{1,2})\s*[\.:\)]\s*/gi;
      const matches = [];
      let m;
      while ((m = regexSplit.exec(bodyOnly)) !== null) {
        matches.push({
          qNum: parseInt(m[1], 10),
          start: m.index,
          contentStart: m.index + m[0].length
        });
      }

      const results = [];
      for (let idx = 0; idx < matches.length; idx++) {
        const curMatch = matches[idx];
        const nextMatch = matches[idx + 1];
        const rawBlock = bodyOnly.slice(curMatch.contentStart, nextMatch ? nextMatch.start : bodyOnly.length).trim();
        if (!rawBlock) continue;

        // Kiểm tra xem câu này thuộc trang PDF nào (nếu có)
        const textBefore = bodyOnly.slice(0, curMatch.start);
        const pageMarkers = Array.from(textBefore.matchAll(/\[\[PAGE_(\d+)\]\]/g));
        const currentPageNum = pageMarkers.length > 0 ? parseInt(pageMarkers[pageMarkers.length - 1][1], 10) : 1;
        const pageImg = pageImages[currentPageNum] || null;

        // Tách các khối bảng biểu / hình ảnh Word ([[RICH_BLOCK_x]])
        let matchedRichHtml = '';
        const cleanedBlock = rawBlock.replace(/\[\[RICH_BLOCK_(\d+)\]\]/g, (tok) => {
          if (richBlocks[tok]) matchedRichHtml += richBlocks[tok];
          return '';
        }).replace(/\[\[PAGE_\d+\]\]/g, '').trim();

        // Tìm vị trí 4 phương án A., B., C., D. (cho phép có [[ANS_MARK]] nằm trước hoặc ngay sau chữ cái phương án)
        const findMarkerPos = (letter, searchFrom) => {
          const re = new RegExp(`(?:^|\\n|\\s)(?:\\[\\[ANS_MARK\\]\\]\\s*)*(\\*?)${letter}\\s*(?:\\[\\[ANS_MARK\\]\\]\\s*)*[\\.:\\)]\\s*(?:\\[\\[ANS_MARK\\]\\]\\s*)*`, 'g');
          re.lastIndex = searchFrom;
          const found = re.exec(cleanedBlock);
          return found
            ? {
                start: found.index,
                contentStart: found.index + found[0].length,
                markerMarked: found[0].includes('[[ANS_MARK]]') || found[1] === '*'
              }
            : null;
        };

        const posA = findMarkerPos('A', 0);
        const posB = posA ? findMarkerPos('B', posA.contentStart) : null;
        const posC = posB ? findMarkerPos('C', posB.contentStart) : null;
        const posD = posC ? findMarkerPos('D', posC.contentStart) : null;

        const qNum = curMatch.qNum;

        if (posA && posB && posC && posD) {
          const questionStemRaw = cleanedBlock.slice(0, posA.start).replace(/\[\[ANS_MARK\]\]/g, '').trim();
          const rawOpts = [
            cleanedBlock.slice(posA.contentStart, posB.start),
            cleanedBlock.slice(posB.contentStart, posC.start),
            cleanedBlock.slice(posC.contentStart, posD.start),
            cleanedBlock.slice(posD.contentStart)
          ];

          let markedCorrectIdx = -1;
          const markerFlags = [posA.markerMarked, posB.markerMarked, posC.markerMarked, posD.markerMarked];
          const cleanOpts = rawOpts.map((optStr, oIdx) => {
            if (markerFlags[oIdx] || optStr.includes('[[ANS_MARK]]')) {
              markedCorrectIdx = oIdx;
            }
            return optStr.replace(/\[\[ANS_MARK\]\]/g, '').replace(/\s+/g, ' ').trim();
          });

          // Nếu chế độ là 'similar' và không phải Tiếng Anh, biến đổi nhẹ số liệu độc lập trong đề dẫn
          let finalQuestionText = questionStemRaw;
          if (mode === 'similar' && !isEnglish && !matchedRichHtml && !pageImg) {
            finalQuestionText = finalQuestionText.replace(/\b(\d+)\b/g, (numStr) => {
              const v = parseInt(numStr, 10);
              if (v >= 12 && v <= 2000 && v !== 2018 && v !== 2025 && v !== 2026) {
                return String(v * 2);
              }
              return numStr;
            });
          }

          let detectedOrigCorrect = -1;
          let answerSourceNote = '';
          if (markedCorrectIdx >= 0) {
            detectedOrigCorrect = markedCorrectIdx;
            answerSourceNote = 'Nhận diện từ đánh dấu màu / gạch dưới / in đậm';
          } else if (answerKeyMap[qNum]) {
            detectedOrigCorrect = Math.max(0, ['A', 'B', 'C', 'D'].indexOf(answerKeyMap[qNum]));
            answerSourceNote = `Nhận diện từ Bảng đáp án (${answerKeyMap[qNum]})`;
          } else if (answerKeyMap[idx + 1]) {
            detectedOrigCorrect = Math.max(0, ['A', 'B', 'C', 'D'].indexOf(answerKeyMap[idx + 1]));
            answerSourceNote = `Nhận diện từ Bảng đáp án (${answerKeyMap[idx + 1]})`;
          } else {
            detectedOrigCorrect = 0;
            answerSourceNote = '⚠️ File gốc chưa có bảng đáp án / tô màu (tạm đặt A)';
          }

          const originalCorrectText = cleanOpts[detectedOrigCorrect];
          let finalOptions = [...cleanOpts];
          let finalCorrect = detectedOrigCorrect;

          if (mode === 'similar') {
            finalOptions = [...cleanOpts].sort(() => Math.random() - 0.5);
            finalCorrect = Math.max(0, finalOptions.indexOf(originalCorrectText));
          }

          results.push({
            id: `${mode === 'exact' ? 'EXACT' : 'SIM'}_${Date.now()}_${idx + 1}`,
            subject,
            grade,
            topic,
            type: 'mcq',
            question: finalQuestionText,
            options: finalOptions,
            correct: finalCorrect,
            richHtml: matchedRichHtml,
            pageImage: pageImg,
            explanation: `${mode === 'exact' ? '[Đề gốc]' : '[Đề tương tự]'} ${answerSourceNote}. Đáp án đúng: ${String.fromCharCode(65 + finalCorrect)}.`
          });
        } else {
          const cleanStem = cleanedBlock.replace(/\[\[ANS_MARK\]\]/g, '').trim();
          results.push({
            id: `${mode === 'exact' ? 'EXACT' : 'SIM'}_${Date.now()}_${idx + 1}`,
            subject,
            grade,
            topic,
            type: isEnglish ? 'mcq' : 'sa',
            question: cleanStem,
            options: isEnglish ? ['Option A', 'Option B', 'Option C', 'Option D'] : undefined,
            correct: isEnglish ? 0 : undefined,
            correctAnswer: !isEnglish ? (answerKeyMap[qNum] || answerKeyMap[idx + 1] || '100') : undefined,
            richHtml: matchedRichHtml,
            pageImage: pageImg,
            explanation: `${mode === 'exact' ? '[Đề gốc]' : '[Đề tương tự]'} Đã giữ nguyên dữ liệu câu hỏi.`
          });
        }
      }
      return results;
    }

    function downloadExamAsWordDoc(examTitle, examCode, teacherName, timeAllowed, subject, grade, questionsList) {
      const isEnglish = subject === 'Tiếng Anh';
      const labelWord = isEnglish ? 'Question' : 'Câu';
      const questionsHtml = questionsList.map((q, idx) => {
        const optsHtml = (q.options || []).map((opt, oi) =>
          `<div style="margin-left:20px;margin-top:3px;"><b>${String.fromCharCode(65 + oi)}.</b> ${opt}</div>`
        ).join('');
        const imgHtml = q.pageImage ? `<div style="margin:6px 0;"><img src="${q.pageImage}" style="max-width:480px;height:auto;" /></div>` : '';
        return `
          <div style="margin-bottom:12px;">
            <div><b>${labelWord} ${idx + 1}:</b> ${q.question}</div>
            ${q.richHtml ? `<div>${q.richHtml}</div>` : ''}
            ${imgHtml}
            ${optsHtml}
          </div>
        `;
      }).join('');

      const keyCells = questionsList.map((q, i) => {
        const ans = q.type === 'mcq' ? String.fromCharCode(65 + (q.correct || 0)) : (q.correctAnswer || 'Đ/S');
        return `<td style="border:1px solid #000;padding:4px;text-align:center;"><b>${i + 1}</b><br/>${ans}</td>`;
      }).join('');

      const fullHtml = `\uFEFF
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
        <head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>${examTitle}</title></head>
        <body style="font-family:'Times New Roman',serif;font-size:13pt;line-height:1.4;">
          <table style="width:100%;border-bottom:2px solid #000;margin-bottom:16px;">
            <tr>
              <td style="text-align:center;width:45%;"><b>SỞ GIÁO DỤC & ĐÀO TẠO</b><br/><b>${teacherName.toUpperCase()}</b></td>
              <td style="text-align:center;width:55%;"><b>${examTitle.toUpperCase()}</b><br/>Môn: ${subject} - Khối ${grade}<br/>Thời gian: ${timeAllowed} phút | Mã đề: <b>${examCode}</b></td>
            </tr>
          </table>
          ${questionsHtml}
          <h4 style="margin-top:20px;">BẢNG ĐÁP ÁN MÃ ĐỀ ${examCode}</h4>
          <table style="border-collapse:collapse;width:100%;"><tr>${keyCells}</tr></table>
        </body>
        </html>
      `;

      const blob = new Blob([fullHtml], { type: 'application/msword;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `De_${subject.replace(/\s+/g, '_')}_Ma_${examCode}.doc`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function buildInitialQuestions() {
      const bank = [];
      Object.entries(SUBJECT_GRADE_TOPICS).forEach(([subject, gradesObj]) => {
        Object.entries(gradesObj).forEach(([grade, topicsList]) => {
          topicsList.forEach((topic, tIdx) => {
            for (let i = 1; i <= 5; i++) {
              bank.push({
                id: `${subject.slice(0, 3).toUpperCase()}_${grade}_T${tIdx + 1}_Q${i}`,
                subject,
                grade,
                topic,
                type: 'mcq',
                question: subject === 'Tiếng Anh'
                  ? `[${topic}] Question ${i}: Choose the best option to complete the sentence or passage according to the 2025+ exam format.`
                  : `[${subject} ${grade} - ${topic}] Nhận định nào sau đây là chính xác khi nghiên cứu về ${topic} (mẫu số ${i})?`,
                options: subject === 'Tiếng Anh'
                  ? ['Option A (Context-appropriate choice)', 'Option B (Alternative structure)', 'Option C (Correct grammatical/lexical form)', 'Option D (Distractor item)']
                  : [
                      `Đặc điểm đúng chuẩn chương trình GDPT 2018 (${subject} lớp ${grade})`,
                      `Phát biểu chưa chính xác về cơ chế vận hành`,
                      `Quá trình diễn ra độc lập không chịu tác động môi trường`,
                      `Chỉ xuất hiện trong điều kiện phòng thí nghiệm`
                    ],
                correct: subject === 'Tiếng Anh' ? 2 : 0,
                explanation: `Hướng dẫn giải chi tiết cho ${subject} lớp ${grade} - ${topic}.`
              });
            }
          });
        });
      });
      return bank;
    }

    function QuizView({ questions, customExams, topicsMap, selectedSubject, setSelectedSubject, selectedGrade, setSelectedGrade, onSaveSubmission }) {
      const [selectedTopic, setSelectedTopic] = useState('Tất cả');
      const [selectedCustomExamId, setSelectedCustomExamId] = useState('');
      const [studentName, setStudentName] = useState('');
      const [studentClass, setStudentClass] = useState('');
      const [started, setStarted] = useState(false);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [activeList, setActiveList] = useState([]);

      const topics = useMemo(() => ['Tất cả', ...(topicsMap[selectedSubject]?.[selectedGrade] || [])], [topicsMap, selectedSubject, selectedGrade]);
      const matchingCustomExams = useMemo(
        () => (customExams || []).filter(ex => ex.subject === selectedSubject && ex.grade === selectedGrade),
        [customExams, selectedSubject, selectedGrade]
      );
      const filtered = useMemo(() => {
        if (selectedCustomExamId) {
          const foundExam = (customExams || []).find(ex => String(ex.id) === String(selectedCustomExamId));
          return foundExam ? foundExam.questions : [];
        }
        return questions.filter(q =>
          q.subject === selectedSubject &&
          q.grade === selectedGrade &&
          (selectedSubject !== 'Tiếng Anh' || q.type === 'mcq') &&
          (selectedTopic === 'Tất cả' || q.topic === selectedTopic)
        );
      }, [questions, customExams, selectedCustomExamId, selectedSubject, selectedGrade, selectedTopic]);

      const score = useMemo(() => activeList.reduce((acc, q, i) => (q.type === 'mcq' && answers[i] === q.correct ? acc + 1 : acc), 0), [activeList, answers]);

      if (!started) {
        return (
          <div className="max-w-2xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">

              <h3 className="font-bold text-sm leading-relaxed">{qLabel}: {cur.question}</h3>

              <div className="space-y-2">
                {(cur.options || []).map((opt, oi) => {
                  const picked = answers[currentIdx] === oi;

                  if (submitted) {

                    else if (picked) cls = 'border-rose-500 bg-rose-50 text-rose-900';
                  } else if (picked) {
                    cls = 'border-emerald-600 bg-emerald-50 font-semibold';
                  }
                  return (
                    <button key={oi} onClick={() => !submitted && setAnswers(p => ({ ...p, [currentIdx]: oi }))} className={`w-full p-3 border rounded-xl text-left text-xs ${cls}`}>
                      <b>{String.fromCharCode(65 + oi)}.</b> {opt}
                    </button>

              </div>

              </div>
            </div>
          )}
        </div>
      );

      const handleUploadFile = async (e, mode) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploadStatus(`Đang đọc & nhận diện đáp án từ tệp "${file.name}"...`);
        let extracted = { text: '', richBlocks: {}, pageImages: {}, answerHints: {} };
        if (file.name.toLowerCase().endsWith('.pdf')) {
          extracted = await extractTextFromPdfFile(file, setUploadStatus);
        } else if (file.name.toLowerCase().endsWith('.docx')) {
          extracted = await extractTextFromDocxFile(file);
        } else {
          extracted.text = cleanVietnameseUnicode(await file.text());
        }
        const generated = parseAndGenerateSimilarFromText(extracted.text, subj, grade, topicName.trim() || file.name, {
          richBlocks: extracted.richBlocks,
          pageImages: extracted.pageImages,
          answerHints: extracted.answerHints,
          mode
        });
        setParsedList(generated);
        setPreviewMode(true);
        setUploadStatus(generated.length > 0 ? `Đã xử lý thành công ${generated.length} câu hỏi!` : 'Không tìm thấy cấu trúc câu hỏi chuẩn trong file.');

          {subTab === 'upload' && (

                  <input type="file" accept=".pdf,.docx,.txt" onChange={e => handleUploadFile(e, 'exact')} className="hidden" />

                            subject: subj,

                            createdAt: new Date().toLocaleString('vi-VN'),
                            questions: parsedList

                          setCustomExams(prev => [newExamObj, ...prev]);
                          showToast(`Đã lưu thành bộ đề riêng "${newExamObj.title}" (Không lẫn vào ngân hàng có sẵn)!`);
                        }}
                        className="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold"
                      >
                        💾 Lưu Thành Đề Riêng (Không Lẫn Ngân Hàng)
                      </button>
                    </div>
                  </div>

                  {previewMode && (
                    <div className="max-h-96 overflow-y-auto space-y-2 border rounded-xl p-3 bg-slate-50 text-xs">
                      {parsedList.map((q, idx) => (
                        <div key={q.id} className="p-3 bg-white rounded-lg border space-y-1">
                          <div className="font-bold">{subj === 'Tiếng Anh' ? `Question ${idx + 1}:` : `Câu ${idx + 1}:`} {q.question}</div>
                          {q.richHtml && <div dangerouslySetInnerHTML={{ __html: q.richHtml }} />}
                          {q.pageImage && <img src={q.pageImage} alt="Trang PDF" className="max-h-48 border rounded" />}
                          {(q.options || []).map((o, oi) => (
                            <div key={oi} className={q.correct === oi ? 'text-emerald-700 font-bold pl-3' : 'pl-3'}>

                            <h4 className="font-bold text-sm text-slate-800 mt-1">{eIdx + 1}. {ex.title} ({ex.questions.length} câu hỏi)</h4>

                              {isViewing ? 'Thu Gọn' : '👁️ Xem Chi Tiết'}
                            </button>
                            <button
                              onClick={() => downloadExamAsWordDoc(ex.title, ex.examCode, 'Thầy Trương Trung Can', '50', ex.subject, ex.grade, ex.questions)}
                              className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold"
                            >
                              📥 Xuất Word (.DOC)

                            <button
                              onClick={() => setCustomExams(prev => prev.filter(item => item.id !== ex.id))}
                              className="px-3 py-1.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg text-xs font-bold"
                            >
                              Xóa Đề
                            </button>
                          </div>
                        </div>

                        {isViewing && (

                              <div key={q.id || qi} className="p-2.5 bg-white rounded-lg border space-y-1">
                                <div className="font-bold">{ex.subject === 'Tiếng Anh' ? `Question ${qi + 1}:` : `Câu ${qi + 1}:`} {q.question}</div>
                                {(q.options || []).map((opt, oi) => (
                                  <div key={oi} className={q.correct === oi ? 'text-emerald-700 font-bold pl-3' : 'pl-3'}>
                                    {String.fromCharCode(65 + oi)}. {opt} {q.correct === oi && '✓'}
                                  </div>
                                ))}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {subTab === 'batchEdit' && (
            <div className="bg-white p-5 rounded-2xl border space-y-4">

                    <option value="Sinh học">Sinh học</option>
                    <option value="Công nghệ Nông nghiệp">Công nghệ Nông nghiệp</option>
                  </select>
                  <select value={editGrade} onChange={e => setEditGrade(e.target.value)} className="p-2 border rounded-lg text-xs font-bold">
                    <option value="12">Khối 12</option>
                    <option value="11">Khối 11</option>
                    <option value="10">Khối 10</option>

                <button

                  }}
                  className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold"
                >
                  💾 Lưu Tất Cả Thay Đổi
                </button>
              </div>
              <div className="space-y-3 max-h-[500px] overflow-y-auto">
                {editableQuestions.map((q, idx) => {

                  return (
                    <div key={q.id} className="p-3 bg-slate-50 border rounded-xl space-y-2 text-xs">
                      <div className="font-bold text-slate-700">{editSubj === 'Tiếng Anh' ? `Question ${idx + 1}` : `Câu ${idx + 1}`}</div>

                        rows={2}
                        value={curItem.question}
                        onChange={e => setDrafts(p => ({ ...p, [q.id]: { ...curItem, question: e.target.value } }))}

                      />

                              onChange={() => setDrafts(p => ({ ...p, [q.id]: { ...curItem, correct: oi } }))}

                              value={opt}

                )}

    function ExporterView({ questions, customExams, topicsMap, selectedSubject, setSelectedSubject, selectedGrade, setSelectedGrade }) {
      const [selectedTopic, setSelectedTopic] = useState('Tất cả');
      const [selectedCustomExamId, setSelectedCustomExamId] = useState('');
      const [examCode, setExamCode] = useState('101');
      const topics = useMemo(() => ['Tất cả', ...(topicsMap[selectedSubject]?.[selectedGrade] || [])], [topicsMap, selectedSubject, selectedGrade]);
      const matchingCustomExams = useMemo(
        () => (customExams || []).filter(ex => ex.subject === selectedSubject && ex.grade === selectedGrade),
        [customExams, selectedSubject, selectedGrade]
      );
      const activeCustomExam = useMemo(
        () => matchingCustomExams.find(ex => String(ex.id) === String(selectedCustomExamId)) || null,
        [matchingCustomExams, selectedCustomExamId]
      );
      const exportList = useMemo(() => {
        if (activeCustomExam) return activeCustomExam.questions;
        return questions.filter(q =>
          q.subject === selectedSubject &&
          q.grade === selectedGrade &&
          (selectedSubject !== 'Tiếng Anh' || q.type === 'mcq') &&
          (selectedTopic === 'Tất cả' || q.topic === selectedTopic)
        );
      }, [questions, activeCustomExam, selectedSubject, selectedGrade, selectedTopic]);

      const labelWord = selectedSubject === 'Tiếng Anh' ? 'Question' : 'Câu';

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-xl border flex flex-wrap gap-2 items-center print:hidden">
            <select value={selectedSubject} onChange={e => { setSelectedSubject(e.target.value); setSelectedTopic('Tất cả'); setSelectedCustomExamId(''); }} className="p-2 border rounded-lg text-xs bg-white font-bold">
              <option value="Sinh học">Sinh học</option>
              <option value="Công nghệ Nông nghiệp">Công nghệ Nông nghiệp</option>
              <option value="Tiếng Anh">Tiếng Anh</option>

            <select value={selectedGrade} onChange={e => { setSelectedGrade(e.target.value); setSelectedTopic('Tất cả'); setSelectedCustomExamId(''); }} className="p-2 border rounded-lg text-xs bg-white font-bold">
              <option value="12">Khối 12</option>
              <option value="11">Khối 11</option>
              <option value="10">Khối 10</option>
            </select>
            {matchingCustomExams.length > 0 && (
              <select
                value={selectedCustomExamId}
                onChange={e => {
                  setSelectedCustomExamId(e.target.value);

                  <option key={ex.id} value={ex.id}>📁 Đề riêng: {ex.title} (Mã {ex.examCode})</option>

              <select value={selectedTopic} onChange={e => setSelectedTopic(e.target.value)} className="p-2 border rounded-lg text-xs bg-white">
                {topics.map(t => <option key={t} value={t}>{t}</option>)}

            <input type="text" value={examCode} onChange={e => setExamCode(e.target.value)} className="w-20 p-2 border rounded-lg text-xs font-mono" placeholder="Mã đề" />

              <button
                onClick={() => downloadExamAsWordDoc(activeCustomExam ? activeCustomExam.title : `ĐỀ KIỂM TRA MÔN ${selectedSubject.toUpperCase()}`, examCode, 'Thầy Trương Trung Can', '50', selectedSubject, selectedGrade, exportList)}

              >
                📥 Tải File Word (.DOC)
              </button>
              <button onClick={() => window.print()} className="px-3 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold">

              <p className="text-xs italic">Giáo viên: Thầy Trương Trung Can | Mã đề: {examCode}</p>
            </div>
            {exportList.map((q, idx) => (
              <div key={q.id} className="space-y-1">
                <p className="font-bold">{labelWord} {idx + 1}: <span className="font-normal">{q.question}</span></p>

                    <div key={oi}><b>{String.fromCharCode(65 + oi)}.</b> {o}</div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
