    function useLocalStorageState(key, defaultValue) {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(key);
          return saved ? JSON.parse(saved) : defaultValue;
        } catch {
          return defaultValue;
        }
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(state)); } catch {}
      }, [key, state]);
      return [state, setState];
    }

    function calculateSimilarity(str1, str2) {
      const norm = (s) => s.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "").split(/\s+/).filter(w => w.length > 2);
      const s1 = new Set(norm(str1)), s2 = new Set(norm(str2));
      if (!s1.size || !s2.size) return 0;
      let inter = 0;
      s1.forEach(w => { if (s2.has(w)) inter++; });
      return inter / (s1.size + s2.size - inter);
    }

    function isDuplicateQuestion(newContent, existingList) {
      return existingList.some(q => calculateSimilarity(newContent, q.content) >= 0.72);
    }

    async function callGeminiAPI(apiKey, prompt, jsonSchema = null) {
      if (!apiKey || !apiKey.trim()) {
        throw new Error("MISSING_KEY");
      }
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: "Bạn là chuyên gia ra đề thi Tốt nghiệp THPT môn Sinh học của Việt Nam (Chương trình GDPT 2018)." }] }
      };
      if (jsonSchema) {
        payload.generationConfig = { responseMimeType: "application/json", responseSchema: jsonSchema };
      }
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`API_ERROR_${res.status}`);
      const data = await res.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error("EMPTY_RESPONSE");
      return jsonSchema ? JSON.parse(text) : text;
    }

    function PracticeSection({ exams, questions, role, showToast, onSaveResult, onDeleteExam }) {
      const [mode, setMode] = useState('list');
      const [activeExam, setActiveExam] = useState(null);
      const [studentName, setStudentName] = useState('');
      const [studentClass, setStudentClass] = useState('12A1');
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(0);
      const [scoreSummary, setScoreSummary] = useState(null);
      const [selectedTopic, setSelectedTopic] = useState('cd1');
      const [quickCount, setQuickCount] = useState(10);

      useEffect(() => {
        if (mode !== 'taking' || timeLeft <= 0) return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) { clearInterval(timer); handleSubmitExam(); return 0; }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [mode, timeLeft]);

      const startExam = (examObj) => {
        if (!studentName.trim()) {
          showToast('Vui lòng nhập Họ và tên học sinh trước khi làm bài!', 'error');
          return;
        }
        setActiveExam(examObj);
        setAnswers({});
        setScoreSummary(null);
        setTimeLeft((examObj.duration || 50) * 60);
        setMode('taking');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const startQuickTopic = () => {
        if (!studentName.trim()) {
          showToast('Vui lòng nhập Họ và tên học sinh!', 'error');
          return;
        }
        const pool = questions.filter(q => q.topicId === selectedTopic);
        if (!pool.length) {
          showToast('Chủ đề này chưa có câu hỏi!', 'error');
          return;
        }
        const shuffled = [...pool].sort(() => 0.5 - Math.random()).slice(0, quickCount);
        const topicObj = TOPICS_12.find(t => t.id === selectedTopic);
        startExam({
          id: 'quick_' + Date.now(),
          title: `Luyện tập chuyên đề: ${topicObj?.short || selectedTopic}`,
          duration: Math.max(10, shuffled.length * 2),
          questions: shuffled
        });
      };

      const handleSubmitExam = () => {
        if (!activeExam) return;
        const qs = activeExam.questions || [];
        let totalRaw = 0, maxRaw = 0, correctCount = 0;

        qs.forEach(q => {
          if (q.type === 'MCQ') {
            maxRaw += 0.25;
            if (answers[q.id] === q.correctAnswer) { totalRaw += 0.25; correctCount++; }
          } else if (q.type === 'TF') {
            maxRaw += 1.0;
            const userSub = answers[q.id] || {};
            let subOk = 0;
            (q.subItems || []).forEach(sub => { if (userSub[sub.id] === sub.answer) subOk++; });
            totalRaw += ({ 0: 0, 1: 0.1, 2: 0.25, 3: 0.5, 4: 1.0 }[subOk] || 0);
            if (subOk === 4) correctCount++;
          } else if (q.type === 'SHORT') {
            maxRaw += 0.5;
            const u = String(answers[q.id] || '').trim().replace(',', '.').toLowerCase();
            const c = String(q.correctAnswer || '').trim().replace(',', '.').toLowerCase();
            if (u !== '' && u === c) { totalRaw += 0.5; correctCount++; }
          }
        });

        const score10 = maxRaw > 0 ? Math.round(((totalRaw / maxRaw) * 10) * 100) / 100 : 0;
        const summary = {
          id: 'res_' + Date.now(),
          studentName: studentName.trim(),
          studentClass: studentClass.trim() || '12',
          examTitle: activeExam.title,
          score: score10,
          correctCount,
          totalQuestions: qs.length,
          submittedAt: new Date().toISOString()
        };
        setScoreSummary(summary);
        setMode('review');
        onSaveResult(summary);
        showToast(`Đã nộp bài! Điểm của bạn: ${score10} / 10`, 'success');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const formatTime = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

      if (mode === 'taking' || mode === 'review') {
        const qs = activeExam.questions || [];
        return (
          <div className="space-y-6">
            <div className="bg-white rounded-2xl p-4 sm:p-5 shadow-md border border-slate-200 flex flex-wrap items-center justify-between gap-4 sticky top-20 z-30">
              <div>
                <h2 className="font-bold text-slate-900">{activeExam.title}</h2>
                <p className="text-xs text-slate-500">Thí sinh: <strong className="text-emerald-700">{studentName}</strong> ({studentClass}) • {qs.length} câu</p>
              </div>
              <div className="flex items-center gap-3">
                {mode === 'taking' ? (
                  <>
                    <div className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl font-mono font-bold ${timeLeft < 300 ? 'bg-rose-100 text-rose-700' : 'bg-emerald-50 text-emerald-700'}`}>
                      <Icon name="clock" className="w-4 h-4" />
                      <span>{formatTime(timeLeft)}</span>
                    </div>
                    <button onClick={handleSubmitExam} className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-md">Nộp bài</button>
                  </>
                ) : (
                  <button onClick={() => setMode('list')} className="px-4 py-2 rounded-xl bg-slate-800 text-white font-semibold">Quay lại danh sách đề</button>
                )}
              </div>
            </div>

            {mode === 'review' && scoreSummary && (
              <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white rounded-2xl p-6 shadow-xl flex items-center justify-between">
                <div>
                  <span className="text-xs uppercase bg-white/20 px-2.5 py-1 rounded-full font-semibold">Kết quả chính thức</span>
                  <h3 className="text-3xl font-extrabold mt-2">Điểm số: {scoreSummary.score} / 10 điểm</h3>
                  <p className="text-emerald-100 text-sm mt-1">Đúng trọn vẹn {scoreSummary.correctCount}/{scoreSummary.totalQuestions} câu hỏi.</p>
                </div>
                <Icon name="award" className="w-16 h-16 text-amber-300" />
              </div>
            )}

            <div className="space-y-5">
              {qs.map((q, idx) => {
                const isReview = mode === 'review';
                return (
                  <div key={q.id || idx} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <div className="flex items-center justify-between gap-2 mb-3">
                      <div className="flex items-center gap-2">
                        <span className="bg-emerald-100 text-emerald-800 font-bold text-xs px-3 py-1 rounded-lg">Câu {idx + 1}</span>
                        <span className="text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600">
                          {q.type === 'MCQ' ? 'Phần I: Nhiều lựa chọn' : q.type === 'TF' ? 'Phần II: Đúng / Sai' : 'Phần III: Trả lời ngắn'}
                        </span>
                      </div>
                      {q.source && <span className="text-xs text-slate-400 italic">{q.source}</span>}
                    </div>
                    <p className="text-slate-800 font-medium leading-relaxed mb-4 whitespace-pre-line">{q.content}</p>

                    {q.type === 'MCQ' && (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {(q.options || []).map((opt, oIdx) => {
                          const letter = ['A', 'B', 'C', 'D'][oIdx];
                          const selected = answers[q.id] === letter;
                          const isCorrect = q.correctAnswer === letter;
                          let style = 'border-slate-200 hover:border-emerald-400';
                          if (isReview) {
                            if (isCorrect) style = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold';
                            else if (selected) style = 'border-rose-500 bg-rose-50 text-rose-900';
                          } else if (selected) {
                            style = 'border-emerald-600 bg-emerald-50 text-emerald-900 font-semibold';
                          }
                          return (
                            <button key={letter} disabled={isReview} onClick={() => setAnswers({ ...answers, [q.id]: letter })} className={`flex items-start gap-3 p-3.5 rounded-xl border text-left ${style}`}>
                              <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 ${selected || (isReview && isCorrect) ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}`}>{letter}</span>
                              <span className="text-sm pt-0.5">{opt}</span>
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {q.type === 'TF' && (
                      <div className="border border-slate-200 rounded-xl overflow-hidden">
                        <div className="grid grid-cols-12 bg-slate-100 px-4 py-2 text-xs font-bold text-slate-600 uppercase">
                          <div className="col-span-8">Mệnh đề</div>
                          <div className="col-span-2 text-center">Đúng</div>
                          <div className="col-span-2 text-center">Sai</div>
                        </div>
                        {(q.subItems || []).map(sub => {
                          const uVal = (answers[q.id] || {})[sub.id];
                          return (
                            <div key={sub.id} className="grid grid-cols-12 items-center px-4 py-3 border-t border-slate-200 gap-2">
                              <div className="col-span-8 text-sm">
                                <strong className="uppercase mr-1 text-emerald-700">{sub.id})</strong> {sub.text}
                                {isReview && (
                                  <span className={`ml-2 text-xs font-bold px-2 py-0.5 rounded ${uVal === sub.answer ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                    Đáp án: {sub.answer ? 'Đúng' : 'Sai'}
                                  </span>
                                )}
                              </div>
                              <div className="col-span-2 flex justify-center">
                                <button disabled={isReview} onClick={() => setAnswers({ ...answers, [q.id]: { ...(answers[q.id] || {}), [sub.id]: true } })} className={`w-8 h-8 rounded-lg border font-bold text-xs ${uVal === true ? 'bg-emerald-600 text-white' : 'bg-white text-slate-500'}`}>Đ</button>
                              </div>
                              <div className="col-span-2 flex justify-center">
                                <button disabled={isReview} onClick={() => setAnswers({ ...answers, [q.id]: { ...(answers[q.id] || {}), [sub.id]: false } })} className={`w-8 h-8 rounded-lg border font-bold text-xs ${uVal === false ? 'bg-rose-600 text-white' : 'bg-white text-slate-500'}`}>S</button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {q.type === 'SHORT' && (
                      <div className="max-w-md">
                        <input type="text" disabled={isReview} value={answers[q.id] || ''} onChange={e => setAnswers({ ...answers, [q.id]: e.target.value })} placeholder="Nhập đáp số (VD: 2495 hoặc 0.1)" className="w-full px-4 py-2.5 rounded-xl border border-slate-300 font-mono font-bold" />
                        {isReview && <p className="mt-2 text-sm font-bold text-emerald-700">Đáp án chuẩn: <span className="bg-emerald-100 px-2 py-0.5 rounded">{q.correctAnswer}</span></p>}
                      </div>
                    )}

                    {isReview && q.explanation && (
                      <div className="mt-4 p-4 rounded-xl bg-amber-50 border border-amber-200 text-sm text-slate-700">
                        <strong className="text-amber-800 block mb-1">💡 Hướng dẫn giải:</strong> {q.explanation}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-8">
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 className="text-lg font-bold text-slate-900 mb-4">Thông tin thí sinh luyện tập</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Họ và tên học sinh *</label>
                <input type="text" value={studentName} onChange={e => setStudentName(e.target.value)} placeholder="VD: Nguyễn Văn An" className="w-full px-4 py-2.5 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-emerald-500" />
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Lớp / Khối</label>
                <input type="text" value={studentClass} onChange={e => setStudentClass(e.target.value)} placeholder="VD: 12A1" className="w-full px-4 py-2.5 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-emerald-500" />
              </div>
            </div>
          </div>

          <div className="bg-gradient-to-br from-teal-900 to-emerald-950 text-white rounded-2xl p-6 shadow-lg">
            <h3 className="text-lg font-bold mb-1">Luyện tập tự chọn theo Chuyên đề (Khối 10 - 11 - 12)</h3>
            <p className="text-sm text-teal-100 mb-5">Trích xuất ngẫu nhiên câu hỏi từ Ngân hàng theo chủ đề bạn chọn.</p>
            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
              <div className="md:col-span-7">
                <label className="block text-xs font-semibold text-teal-200 mb-1">Chọn chuyên đề ôn luyện</label>
                <select value={selectedTopic} onChange={e => setSelectedTopic(e.target.value)} className="w-full px-4 py-2.5 rounded-xl bg-white/10 border border-white/20 text-white">
                  {TOPICS_12.map(t => (
                    <option key={t.id} value={t.id} className="text-slate-900">[Khối {t.grade}] {t.name} ({questions.filter(q => q.topicId === t.id).length} câu)</option>
                  ))}
                </select>
              </div>
              <div className="md:col-span-2">
                <label className="block text-xs font-semibold text-teal-200 mb-1">Số câu</label>
                <select value={quickCount} onChange={e => setQuickCount(Number(e.target.value))} className="w-full px-4 py-2.5 rounded-xl bg-white/10 border border-white/20 text-white">
                  <option value={5} className="text-slate-900">5 câu</option>
                  <option value={10} className="text-slate-900">10 câu</option>
                  <option value={20} className="text-slate-900">20 câu</option>
                  <option value={40} className="text-slate-900">40 câu</option>
                </select>
              </div>
              <div className="md:col-span-3">
                <button onClick={startQuickTopic} className="w-full py-2.5 px-5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold shadow-md flex items-center justify-center gap-2">
                  <Icon name="play" className="w-4 h-4" />
                  <span>Bắt đầu luyện ngay</span>
                </button>
              </div>
            </div>
          </div>

          <div>
            <h3 className="text-xl font-bold text-slate-900 mb-4">Bộ Đề Thi Thử TNTHPT & Đề Giáo Viên Giao ({exams.length})</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {exams.map(ex => (
                <div key={ex.id} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between text-xs mb-2">
                      <span className="font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">Sinh học {ex.grade || '12'}</span>
                      <span className="text-slate-500">{ex.duration || 50} phút • {(ex.questions || []).length} câu</span>
                    </div>
                    <h4 className="font-bold text-slate-900 text-lg mb-2">{ex.title}</h4>
                    <p className="text-sm text-slate-600 mb-4">{ex.description}</p>
                  </div>
                  <div className="flex items-center justify-between pt-4 border-t border-slate-100">
                    <button onClick={() => startExam(ex)} className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm flex items-center gap-2">
                      <Icon name="play" className="w-4 h-4" />
                      <span>Vào làm bài thi</span>
                    </button>
                    {role === 'teacher' && (
                      <button onClick={() => onDeleteExam(ex.id)} className="p-2 text-rose-500 hover:bg-rose-50 rounded-lg"><Icon name="trash" className="w-4 h-4" /></button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. MODULE NGÂN HÀNG CÂU HỎI (ĐỦ 50 CÂU/CHỦ ĐỀ)
    // ==========================================
    function QuestionBankSection({ questions, setQuestions, role, geminiKey, showToast }) {
      const [filterTopic, setFilterTopic] = useState('all');
      const [filterType, setFilterType] = useState('all');
      const [search, setSearch] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);
      const [isGenerating, setIsGenerating] = useState(false);
      const [editingQ, setEditingQ] = useState(null);

      const filtered = questions.filter(q => {
        const mTopic = filterTopic === 'all' || q.topicId === filterTopic;
        const mType = filterType === 'all' || q.type === filterType;
        const mSearch = !search.trim() || q.content.toLowerCase().includes(search.toLowerCase());
        return mTopic && mType && mSearch;
      });

      const handleAutoFill50 = async (topicObj) => {
        const current = questions.filter(q => q.topicId === topicObj.id).length;
        const needed = Math.max(0, 50 - current);
        if (!needed) { showToast('Chủ đề này đã đạt đủ 50 câu!', 'info'); return; }
        const batchSize = Math.min(needed, 10);
        setIsGenerating(true);
        showToast(`AI Gemini đang biên soạn ${batchSize} câu chuẩn TNTHPT 2023-2026 cho "${topicObj.short}"...`, 'info');
        try {
          const prompt = `Tạo ${batchSize} câu hỏi trắc nghiệm Sinh học THPT mới, KHÔNG TRÙNG LẶP cho chủ đề: "${topicObj.name}". Phong cách đề minh họa & đề chính thức TNTHPT 2023-2026. Gồm cả 3 dạng: "MCQ" (4 lựa chọn A,B,C,D), "TF" (Đúng/Sai 4 ý a,b,c,d), "SHORT" (Trả lời ngắn ra số).`;
          const schema = {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                type: { type: "STRING" },
                source: { type: "STRING" },
                content: { type: "STRING" },
                options: { type: "ARRAY", items: { type: "STRING" } },
                subItems: { type: "ARRAY", items: { type: "OBJECT", properties: { id: { type: "STRING" }, text: { type: "STRING" }, answer: { type: "BOOLEAN" } } } },
                correctAnswer: { type: "STRING" },
                explanation: { type: "STRING" }
              },
              required: ["type", "content", "explanation"]
            }
          };
          const res = await callGeminiAPI(geminiKey, prompt, schema);
          const fresh = [];
          res.forEach((item, i) => {
            if (!isDuplicateQuestion(item.content, [...questions, ...fresh])) {
              fresh.push({ ...item, id: 'ai_' + Date.now() + '_' + i, grade: topicObj.grade, topicId: topicObj.id, source: item.source || 'Đề phát triển TNTHPT 2026' });
            }
          });
          setQuestions([...fresh, ...questions]);
          showToast(`Đã bổ sung ${fresh.length} câu hỏi mới (đã lọc trùng)!`, 'success');
        } catch (err) {
          showToast(err.message === 'MISSING_KEY' ? 'Vui lòng nhập Gemini API Key ở khung màu vàng phía trên!' : 'Lỗi khi gọi AI Gemini!', 'error');
        } finally {
          setIsGenerating(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div>
                <h2 className="text-lg font-bold text-slate-900">Tiến độ Ngân hàng Câu hỏi theo Chủ đề (Mục tiêu: 50 câu/chủ đề)</h2>
                <p className="text-xs text-slate-500">Nguồn đề minh họa & đề chính thức TNTHPT 2023-2026, tự động lọc trùng lặp.</p>
              </div>
              {role === 'teacher' && (
                <button onClick={() => setEditingQ({ type: 'MCQ', grade: '12', topicId: 'cd1', source: 'Giáo viên biên soạn', content: '', options: ['', '', '', ''], correctAnswer: 'A', subItems: [{ id: 'a', text: '', answer: true }, { id: 'b', text: '', answer: false }, { id: 'c', text: '', answer: true }, { id: 'd', text: '', answer: false }], explanation: '' })} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold text-sm flex items-center gap-1.5">
                  <Icon name="plus" className="w-4 h-4" /> <span>Thêm câu hỏi</span>
                </button>
              )}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              {TOPICS_12.map(t => {
                const count = questions.filter(q => q.topicId === t.id).length;
                return (
                  <div key={t.id} className="p-3.5 rounded-xl border border-slate-200 bg-slate-50/60 flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between text-xs font-bold mb-1">
                        <span className="text-emerald-700">Lớp {t.grade}</span>
                        <span className={count >= 50 ? 'text-emerald-600' : 'text-amber-600'}>{count}/50 câu</span>
                      </div>
                      <p className="text-xs font-semibold text-slate-800 mb-2">{t.short}</p>
                      <div className="w-full h-2 bg-slate-200 rounded-full overflow-hidden mb-3">
                        <div className="h-full bg-emerald-500" style={{ width: `${Math.min(100, (count / 50) * 100)}%` }} />
                      </div>
                    </div>
                    {role === 'teacher' && count < 50 && (
                      <button disabled={isGenerating} onClick={() => handleAutoFill50(t)} className="w-full py-1.5 rounded-lg bg-white hover:bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-semibold flex items-center justify-center gap-1">
                        <Icon name="sparkles" className="w-3.5 h-3.5" /> <span>AI bổ sung (+{Math.min(10, 50 - count)} câu)</span>
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Bộ lọc & Xóa hàng loạt */}
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
            <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
              <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Tìm kiếm nội dung câu hỏi..." className="md:col-span-5 px-4 py-2 rounded-xl border border-slate-300 text-sm" />
              <select value={filterTopic} onChange={e => setFilterTopic(e.target.value)} className="md:col-span-4 px-3.5 py-2 rounded-xl border border-slate-300 text-sm">
                <option value="all">Tất cả chủ đề</option>
                {TOPICS_12.map(t => <option key={t.id} value={t.id}>[Lớp {t.grade}] {t.short}</option>)}
              </select>
              <select value={filterType} onChange={e => setFilterType(e.target.value)} className="md:col-span-3 px-3.5 py-2 rounded-xl border border-slate-300 text-sm">
                <option value="all">Tất cả dạng câu hỏi</option>
                <option value="MCQ">4 Lựa chọn</option>
                <option value="TF">Đúng / Sai</option>
                <option value="SHORT">Trả lời ngắn</option>
              </select>
            </div>

            {role === 'teacher' && (
              <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100">
                <label className="flex items-center gap-2 text-sm font-medium cursor-pointer">
                  <input type="checkbox" checked={filtered.length > 0 && selectedIds.length === filtered.length} onChange={() => setSelectedIds(selectedIds.length === filtered.length ? [] : filtered.map(q => q.id))} className="w-4 h-4" />
                  <span>Chọn tất cả ({selectedIds.length}/{filtered.length} câu)</span>
                </label>
                {selectedIds.length > 0 && (
                  <button onClick={() => { setQuestions(questions.filter(q => !selectedIds.includes(q.id))); showToast(`Đã xóa ${selectedIds.length} câu hỏi!`, 'info'); setSelectedIds([]); }} className="px-3.5 py-1.5 rounded-lg bg-rose-100 text-rose-800 text-xs font-bold flex items-center gap-1">
                    <Icon name="trash" className="w-3.5 h-3.5" /> <span>Xóa hàng loạt ({selectedIds.length})</span>
                  </button>
                )}
              </div>
            )}
          </div>

          {/* Danh sách câu hỏi */}
          <div className="space-y-4">
            {filtered.map((q, idx) => (
              <div key={q.id} className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2">
                    {role === 'teacher' && (
                      <input type="checkbox" checked={selectedIds.includes(q.id)} onChange={() => setSelectedIds(prev => prev.includes(q.id) ? prev.filter(i => i !== q.id) : [...prev, q.id])} className="w-4 h-4" />
                    )}
                    <span className="text-xs font-bold px-2.5 py-1 rounded bg-slate-800 text-white">#{idx + 1}</span>
                    <span className="text-xs font-semibold px-2.5 py-1 rounded bg-emerald-100 text-emerald-800">{TOPICS_12.find(t => t.id === q.topicId)?.short}</span>
                    <span className="text-xs text-slate-400">{q.source}</span>
                  </div>
                  {role === 'teacher' && (
                    <div className="flex gap-1">
                      <button onClick={() => setEditingQ(q)} className="p-1.5 text-slate-600 hover:bg-slate-100 rounded"><Icon name="edit" className="w-4 h-4" /></button>
                      <button onClick={() => setQuestions(questions.filter(item => item.id !== q.id))} className="p-1.5 text-rose-500 hover:bg-rose-50 rounded"><Icon name="trash" className="w-4 h-4" /></button>
                    </div>
                  )}
                </div>
                <p className="font-medium text-slate-800 mb-3 whitespace-pre-line">{q.content}</p>
                {q.type === 'MCQ' && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm mb-2">
                    {(q.options || []).map((opt, i) => {
                      const l = ['A', 'B', 'C', 'D'][i];
                      return <div key={l} className={`px-3 py-2 rounded-lg border ${q.correctAnswer === l ? 'bg-emerald-50 border-emerald-400 font-semibold text-emerald-900' : 'bg-slate-50 border-slate-200'}`}><strong>{l}.</strong> {opt}</div>;
                    })}
                  </div>
                )}
                {q.type === 'TF' && (
                  <div className="space-y-1 text-sm mb-2">
                    {(q.subItems || []).map(sub => (
                      <div key={sub.id} className="flex justify-between px-3 py-1.5 rounded bg-slate-50 border">
                        <span><strong className="uppercase text-emerald-700">{sub.id})</strong> {sub.text}</span>
                        <span className={`text-xs font-bold px-2 py-0.5 rounded ${sub.answer ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>{sub.answer ? 'ĐÚNG' : 'SAI'}</span>
                      </div>
                    ))}
                  </div>
                )}
                {q.type === 'SHORT' && <p className="text-sm mb-2">Đáp án: <strong className="font-mono bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded">{q.correctAnswer}</strong></p>}
                {q.explanation && <p className="text-xs text-slate-600 bg-amber-50 p-2.5 rounded-lg"><strong>Giải thích:</strong> {q.explanation}</p>}
              </div>
            ))}
          </div>

          {editingQ && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <h3 className="text-lg font-bold">{editingQ.id ? 'Sửa câu hỏi' : 'Thêm câu hỏi mới'}</h3>
                <select value={editingQ.topicId} onChange={e => setEditingQ({ ...editingQ, topicId: e.target.value })} className="w-full px-3 py-2 rounded-xl border">
                  {TOPICS_12.map(t => <option key={t.id} value={t.id}>[Lớp {t.grade}] {t.short}</option>)}
                </select>
                <textarea rows={3} value={editingQ.content} onChange={e => setEditingQ({ ...editingQ, content: e.target.value })} placeholder="Nội dung câu hỏi..." className="w-full p-3 rounded-xl border text-sm" />
                {editingQ.type === 'MCQ' && ['A', 'B', 'C', 'D'].map((l, i) => (
                  <div key={l} className="flex items-center gap-2">
                    <input type="radio" checked={editingQ.correctAnswer === l} onChange={() => setEditingQ({ ...editingQ, correctAnswer: l })} />
                    <strong>{l}.</strong>
                    <input type="text" value={(editingQ.options || [])[i] || ''} onChange={e => { const n = [...(editingQ.options || ['', '', '', ''])]; n[i] = e.target.value; setEditingQ({ ...editingQ, options: n }); }} className="flex-1 px-3 py-1.5 rounded-lg border text-sm" />
                  </div>
                ))}
                <textarea rows={2} value={editingQ.explanation || ''} onChange={e => setEditingQ({ ...editingQ, explanation: e.target.value })} placeholder="Lời giải chi tiết..." className="w-full p-3 rounded-xl border text-sm" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setEditingQ(null)} className="px-4 py-2 rounded-xl text-slate-600">Hủy</button>
                  <button onClick={() => {
                    if (editingQ.id) setQuestions(questions.map(q => q.id === editingQ.id ? editingQ : q));
                    else setQuestions([{ ...editingQ, id: 'q_' + Date.now() }, ...questions]);
                    setEditingQ(null);
                    showToast('Đã lưu câu hỏi!', 'success');
                  }} className="px-5 py-2 rounded-xl bg-emerald-600 text-white font-bold">Lưu</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 7. MODULE SOẠN ĐỀ TỪ FILE GỐC & NHÂN BẢN ĐỀ TƯƠNG TỰ
    // ==========================================
    function ExamGeneratorSection({ questions, setQuestions, exams, setExams, geminiKey, showToast }) {
      const [rawContent, setRawContent] = useState('');
      const [parsedQs, setParsedQs] = useState([]);
      const [examTitle, setExamTitle] = useState('Đề Luyện Tập Sinh Học 12 - Chuẩn TNTHPT 2026');
      const [duration, setDuration] = useState(50);
      const [loading, setLoading] = useState(false);

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          if (file.name.endsWith('.docx') && window.mammoth) {
            const buf = await file.arrayBuffer();
            const res = await window.mammoth.convertToHtml({ arrayBuffer: buf });
            const docHtml = new DOMParser().parseFromString(res.value, 'text/html');
            docHtml.querySelectorAll('u, ins').forEach(el => { el.textContent = ` [GẠCH_CHÂN: ${el.textContent}] `; });
            docHtml.querySelectorAll('[style*="color"]').forEach(el => {
              const st = el.getAttribute('style') || '';
              if (st.includes('red') || st.includes('#ff0000') || st.includes('255, 0, 0')) {
                el.textContent = ` [TÔ_ĐỎ: ${el.textContent}] `;
              }
            });
            setRawContent(docHtml.body.innerText || '');
            setExamTitle(file.name.replace(/\.docx$/i, ''));
            showToast('Đã đọc file Word & bảo toàn dấu hiệu tô đỏ / gạch chân!', 'success');
          } else {
            setRawContent(await file.text());
            setExamTitle(file.name.replace(/\.[^/.]+$/, ''));
            showToast('Đã đọc nội dung file văn bản!', 'success');
          }
        } catch {
          showToast('Lỗi đọc file!', 'error');
        }
      };

      const processWithAI = async (modeType) => {
        if (!rawContent.trim() && !parsedQs.length) {
          showToast('Vui lòng tải file đề gốc hoặc dán nội dung đề!', 'error');
          return;
        }
        setLoading(true);
        showToast(modeType === 'parse' ? 'AI đang bóc tách đề gốc & nhận diện đáp án...' : 'AI đang đổi số liệu & tình huống tạo đề tương tự...', 'info');
        try {
          const prompt = modeType === 'parse'
            ? `Phân tích đề thi Sinh học sau thành JSON array. Nhận diện chính xác 3 dạng: "MCQ" (4 lựa chọn), "TF" (Đúng/Sai 4 ý a,b,c,d), "SHORT" (Trả lời ngắn). Bảo toàn đáp án dựa vào [TÔ_ĐỎ], [GẠCH_CHÂN], dấu * hoặc bảng đáp án cuối đề:\n${rawContent.slice(0, 22000)}`
            : `Dựa trên đề thi gốc sau, hãy tạo ĐỀ TƯƠNG TỰ MỚI HOÀN TOÀN: giữ nguyên dạng câu hỏi ("MCQ", "TF", "SHORT") nhưng THAY ĐỔI SỐ LIỆU tính toán (tính lại đáp án chính xác) và ĐỔI TÌNH HUỐNG / ĐỐI TƯỢNG sinh học:\n${parsedQs.length ? JSON.stringify(parsedQs) : rawContent.slice(0, 20000)}`;

          const schema = {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                type: { type: "STRING" },
                content: { type: "STRING" },
                options: { type: "ARRAY", items: { type: "STRING" } },
                subItems: { type: "ARRAY", items: { type: "OBJECT", properties: { id: { type: "STRING" }, text: { type: "STRING" }, answer: { type: "BOOLEAN" } } } },
                correctAnswer: { type: "STRING" },
                explanation: { type: "STRING" }
              },
              required: ["type", "content"]
            }
          };
          const res = await callGeminiAPI(geminiKey, prompt, schema);
          const formatted = res.map((q, i) => ({ ...q, id: 'gen_' + Date.now() + '_' + i, topicId: 'cd1', source: modeType === 'parse' ? 'Đề gốc tải lên' : 'Đề tương tự AI 2026' }));
          setParsedQs(formatted);
          if (modeType === 'clone') setExamTitle(prev => prev.includes('(Đề tương tự)') ? prev : `${prev} (Đề tương tự)`);
          showToast(`Hoàn tất ${formatted.length} câu hỏi chuẩn xác!`, 'success');
        } catch (err) {
          showToast(err.message === 'MISSING_KEY' ? 'Vui lòng nhập Gemini API Key ở khung màu vàng phía trên!' : 'Lỗi xử lý AI!', 'error');
        } finally {
          setLoading(false);
        }
      };

      const saveAndPublish = () => {
        if (!parsedQs.length) return;
        const newExam = {
          id: 'exam_' + Date.now(),
          title: examTitle,
          grade: '12',
          duration: Number(duration) || 50,
          description: `Đề gồm ${parsedQs.length} câu hỏi được giáo viên biên soạn và xuất bản.`,
          questions: parsedQs
        };
        setExams([newExam, ...exams]);
        const uniqueNew = parsedQs.filter(q => !isDuplicateQuestion(q.content, questions));
        if (uniqueNew.length) setQuestions([...uniqueNew, ...questions]);
        showToast(`Đã xuất bản đề cho học sinh & lưu ${uniqueNew.length} câu mới vào Ngân hàng!`, 'success');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div>
                <h2 className="text-xl font-bold text-slate-900">Soạn Đề Từ File Gốc & Nhân Bản Đề Tương Tự Bằng AI</h2>
                <p className="text-sm text-slate-500">Hỗ trợ .docx / .txt. Tự động nhận diện đáp án tô đỏ, gạch chân hoặc bảng đáp án.</p>
              </div>
              <label className="cursor-pointer px-4 py-2.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 font-semibold text-sm flex items-center gap-2">
                <Icon name="upload" className="w-4 h-4" />
                <span>Tải file đề gốc (.docx / .txt)</span>
                <input type="file" accept=".docx,.txt" onChange={handleFileUpload} className="hidden" />
              </label>
            </div>
            <textarea rows={6} value={rawContent} onChange={e => setRawContent(e.target.value)} placeholder="Dán nội dung đề thi gốc vào đây hoặc tải file .docx lên..." className="w-full p-4 rounded-xl border border-slate-300 text-sm font-mono mb-4" />
            <div className="flex flex-wrap gap-3">
              <button disabled={loading} onClick={() => processWithAI('parse')} className="px-5 py-2.5 rounded-xl bg-slate-800 text-white font-semibold text-sm">
                {loading ? 'Đang xử lý...' : '1. Trích xuất & Chuẩn hóa Đề gốc'}
              </button>
              <button disabled={loading} onClick={() => processWithAI('clone')} className="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm">
                {loading ? 'Đang xử lý...' : '2. Tạo Đề Tương Tự (Đổi số liệu & tình huống)'}
              </button>
            </div>
          </div>

          {parsedQs.length > 0 && (
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
              <div className="flex flex-wrap items-end justify-between gap-4 pb-4 border-b">
                <div className="flex-1 min-w-[240px]">
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Tên đề thi xuất bản</label>
                  <input type="text" value={examTitle} onChange={e => setExamTitle(e.target.value)} className="w-full px-4 py-2 rounded-xl border font-bold" />
                </div>
                <div className="w-28">
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Phút</label>
                  <input type="number" value={duration} onChange={e => setDuration(e.target.value)} className="w-full px-3 py-2 rounded-xl border font-bold" />
                </div>
                <button onClick={saveAndPublish} className="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm flex items-center gap-2">
                  <Icon name="save" className="w-4 h-4" /> <span>Lưu & Xuất bản cho Học sinh ({parsedQs.length} câu)</span>
                </button>
              </div>
              {parsedQs.map((q, idx) => (
                <div key={q.id} className="p-4 rounded-xl border bg-slate-50/50 space-y-2">
                  <div className="flex justify-between">
                    <span className="text-xs font-bold bg-emerald-700 text-white px-2 py-0.5 rounded">Câu {idx + 1} ({q.type})</span>
                    <button onClick={() => setParsedQs(parsedQs.filter((_, i) => i !== idx))} className="text-xs text-rose-600 font-semibold">Xóa</button>
                  </div>
                  <p className="text-sm font-medium">{q.content}</p>
                  {q.type === 'MCQ' && <p className="text-xs text-emerald-700 font-bold">Đáp án đúng: {q.correctAnswer}</p>}
                  {q.type === 'SHORT' && <p className="text-xs text-emerald-700 font-bold">Đáp số: {q.correctAnswer}</p>}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 8. MODULE TIỆN ÍCH & CÔNG THỨC SINH HỌC 12
    // ==========================================
    function UtilitiesSection({ utilities, setUtilities, role, showToast }) {
      const [subTab, setSubTab] = useState('formula');
      const [calcL, setCalcL] = useState(408);
      const [calcA, setCalcA] = useState(480);
      const [editing, setEditing] = useState(null);

      const calc = useMemo(() => {
        const N = Math.round((2 * Number(calcL) * 10) / 3.4);
        const A = Number(calcA);
        const G = Math.max(0, Math.round(N / 2 - A));
        return { N, A, G, H: 2 * A + 3 * G, C: N / 20, M: N * 300 };
      }, [calcL, calcA]);

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl shadow-sm border">
            <div className="flex flex-wrap gap-2">
              {[['formula', 'Công thức Giải nhanh 12'], ['term', 'Thuật ngữ Sinh 12'], ['concept', 'Khái niệm & So sánh'], ['calculator', 'Máy tính Bài tập Phân tử']].map(([id, label]) => (
                <button key={id} onClick={() => setSubTab(id)} className={`px-4 py-2 rounded-xl text-sm font-bold ${subTab === id ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}`}>
                  {label}
                </button>
              ))}
            </div>
            {role === 'teacher' && subTab !== 'calculator' && (
              <button onClick={() => setEditing({ category: subTab, topic: 'Sinh học 12', title: '', content: '' })} className="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold">+ Thêm mục</button>
            )}
          </div>

          {subTab === 'calculator' ? (
            <div className="bg-white rounded-2xl p-6 shadow-sm border max-w-2xl mx-auto space-y-5">
              <h3 className="text-lg font-bold">Máy tính nhanh Thông số Cấu trúc DNA / Gene</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Chiều dài L (nm)</label>
                  <input type="number" value={calcL} onChange={e => setCalcL(e.target.value)} className="w-full px-4 py-2 rounded-xl border font-mono font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Số lượng Nu loại A</label>
                  <input type="number" value={calcA} onChange={e => setCalcA(e.target.value)} className="w-full px-4 py-2 rounded-xl border font-mono font-bold" />
                </div>
              </div>
              <div className="grid grid-cols-3 gap-3 bg-emerald-50 p-5 rounded-2xl border border-emerald-200">
                <div><span className="text-xs text-slate-500 block">Tổng Nu (N)</span><strong className="text-xl font-mono text-emerald-800">{calc.N}</strong></div>
                <div><span className="text-xs text-slate-500 block">Liên kết H</span><strong className="text-xl font-mono text-emerald-800">{calc.H}</strong></div>
                <div><span className="text-xs text-slate-500 block">Chu kì xoắn (C)</span><strong className="text-xl font-mono text-emerald-800">{calc.C}</strong></div>
                <div><span className="text-xs text-slate-500 block">A = T</span><strong className="text-lg font-mono">{calc.A}</strong></div>
                <div><span className="text-xs text-slate-500 block">G = C</span><strong className="text-lg font-mono">{calc.G}</strong></div>
                <div><span className="text-xs text-slate-500 block">Khối lượng (M)</span><strong className="text-lg font-mono">{calc.M.toLocaleString()}</strong></div>
              </div>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {utilities.filter(u => u.category === subTab).map(item => (
                <div key={item.id} className="bg-white rounded-2xl p-5 shadow-sm border">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-teal-50 text-teal-700">{item.topic}</span>
                    {role === 'teacher' && (
                      <div className="flex gap-1">
                        <button onClick={() => setEditing(item)} className="p-1 text-slate-500 hover:bg-slate-100 rounded"><Icon name="edit" className="w-4 h-4" /></button>
                        <button onClick={() => { setUtilities(utilities.filter(u => u.id !== item.id)); showToast('Đã xóa!', 'info'); }} className="p-1 text-rose-500 hover:bg-rose-50 rounded"><Icon name="trash" className="w-4 h-4" /></button>
                      </div>
                    )}
                  </div>
                  <h4 className="font-bold text-slate-900 mb-2">{item.title}</h4>
                  <p className="text-sm text-slate-700 whitespace-pre-line bg-slate-50 p-3.5 rounded-xl">{item.content}</p>
                </div>
              ))}
            </div>
          )}

          {editing && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="font-bold text-lg">{editing.id ? 'Sửa tiện ích' : 'Thêm tiện ích mới'}</h3>
                <input type="text" value={editing.topic} onChange={e => setEditing({ ...editing, topic: e.target.value })} placeholder="Chuyên đề" className="w-full px-3 py-2 rounded-xl border text-sm" />
                <input type="text" value={editing.title} onChange={e => setEditing({ ...editing, title: e.target.value })} placeholder="Tiêu đề" className="w-full px-3 py-2 rounded-xl border text-sm font-bold" />
                <textarea rows={4} value={editing.content} onChange={e => setEditing({ ...editing, content: e.target.value })} placeholder="Nội dung..." className="w-full px-3 py-2 rounded-xl border text-sm" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setEditing(null)} className="px-4 py-2 rounded-xl text-slate-600">Hủy</button>
                  <button onClick={() => {
                    if (editing.id) setUtilities(utilities.map(u => u.id === editing.id ? editing : u));
                    else setUtilities([{ ...editing, id: 'ut_' + Date.now() }, ...utilities]);
                    setEditing(null);
                    showToast('Đã lưu!', 'success');
                  }} className="px-5 py-2 rounded-xl bg-emerald-600 text-white font-bold">Lưu</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 9. MODULE KẾT QUẢ LÀM BÀI CỦA HỌC SINH
    // ==========================================
    function ResultsSection({ results, setResults, showToast }) {
      const [search, setSearch] = useState('');
      const filtered = results.filter(r => !search.trim() || r.studentName.toLowerCase().includes(search.toLowerCase()) || r.examTitle.toLowerCase().includes(search.toLowerCase()));

      return (
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-xl font-bold text-slate-900">Bảng Điểm & Lịch Sử Làm Bài Của Học Sinh</h2>
              <p className="text-xs text-slate-500">Tự động lưu điểm sau mỗi lượt luyện tập hoặc thi thử.</p>
            </div>
            <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Tìm tên học sinh, đề thi..." className="px-4 py-2 rounded-xl border text-sm w-full sm:w-64" />
          </div>

          {filtered.length === 0 ? (
            <p className="text-center py-10 text-slate-400">Chưa có kết quả làm bài nào được lưu.</p>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="border-b text-xs font-bold uppercase text-slate-500 bg-slate-50">
                    <th className="py-3 px-4">Học sinh</th>
                    <th className="py-3 px-4">Lớp</th>
                    <th className="py-3 px-4">Bài thi / Chuyên đề</th>
                    <th className="py-3 px-4 text-center">Đúng trọn vẹn</th>
                    <th className="py-3 px-4 text-center">Điểm (Thang 10)</th>
                    <th className="py-3 px-4">Thời gian</th>
                    <th className="py-3 px-4 text-right">Xóa</th>
                  </tr>
                </thead>
                <tbody className="divide-y text-sm">
                  {filtered.map(r => (
                    <tr key={r.id} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-bold">{r.studentName}</td>
                      <td className="py-3 px-4">{r.studentClass}</td>
                      <td className="py-3 px-4 max-w-xs truncate">{r.examTitle}</td>
                      <td className="py-3 px-4 text-center">{r.correctCount}/{r.totalQuestions}</td>
                      <td className="py-3 px-4 text-center">
                        <span className={`px-3 py-1 rounded-full font-bold text-xs ${r.score >= 8 ? 'bg-emerald-100 text-emerald-800' : r.score >= 5 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}`}>
                          {r.score} đ
                        </span>
                      </td>
                      <td className="py-3 px-4 text-xs text-slate-500">{new Date(r.submittedAt).toLocaleString('vi-VN')}</td>
                      <td className="py-3 px-4 text-right">
                        <button onClick={() => { setResults(results.filter(item => item.id !== r.id)); showToast('Đã xóa kết quả!', 'info'); }} className="text-rose-500 hover:underline text-xs font-semibold">Xóa</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
